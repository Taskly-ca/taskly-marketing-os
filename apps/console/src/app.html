      costCents: Number(m.costCents) || 0,
      threadId: detail.id ?? S.threadId,
      messageId: m.id ?? null,
      flagged: 0,
      // `dropped` is passed only when it has content. A fast run stores `[]`
      // because it HAS no drop stage, not because the stage ran and found
      // nothing — and an empty array here would be rendered as the latter.
      dropped: (Array.isArray(payload.dropped) && payload.dropped.length) ? payload.dropped : undefined,
      unanswered: payload.unanswered,
      queries: payload.queries,
      note: isNote ? body : undefined,
    });
    turn = null;
  }
  SCROLLER.scrollTop = 0;
}

/** Badges on a replayed answer are settled but unjudged. See replayThread. */
function markStored(turn) {
  for (const n of turn.order) {
    const s = turn.sentences.get(n);
    s.verdict = 'stored';
    s.node.classList.remove('pending');
    for (const b of s.badges) {
      b.classList.remove('pending');
      b.classList.add('stored');
      paintBadgeKind(turn, b);
    }
    markForecastSentence(turn, s);
  }
}

/* ══ turn DOM ══════════════════════════════════════════════════════════════ */

function buildTurn(turn) {
  const root = el('article', 'turn');
  root.id = turn.id;

  const q = el('h2', 'q', turn.question);
  root.appendChild(q);

  /* status */
  const status = el('div', 'status');
  const live = el('div', 'live');
  const phase = el('span', 'phase', 'Planning searches…');
  const detail = el('span', 'detail');
  live.append(el('span', 'dot'), phase, detail);
  const toggle = el('button', 'steps-toggle hidden');
  toggle.setAttribute('aria-expanded', 'false');
  const steps = el('ol', 'steps hidden');
  toggle.addEventListener('click', () => {
    const open = steps.classList.toggle('hidden') === false;
    toggle.setAttribute('aria-expanded', String(open));
  });
  status.append(live, toggle, steps);
  root.appendChild(status);

  /* The clarify card sits ABOVE everything the run would produce, because when
     it is on screen the run has not produced anything and has not started. */
  const clarify = el('section', 'clarify hidden');
  root.appendChild(clarify);

  /* The deep panel goes above the sources for the same reason the sources go
     above the prose: the plan is what makes the first ninety seconds legible,
     and by the time a source card lands the reader has already decided whether
     to stay. */
  const deep = el('section', 'deep hidden');
  root.appendChild(deep);

  /* sources — before the prose, deliberately: it is what makes the wait legible */
  const sources = el('section', 'sources hidden');
  const shead = el('div', 'srchead');
  shead.append(el('span', 'eyebrow', 'Sources'), el('span', 'eyebrow srccount', ''));
  // Groups, not one flat grid. Grouping IS the at-a-glance cue: before a word
  // of prose you can see that half this answer rests on documents we wrote.
  // With a single kind on screen the group label is hidden, so a web run looks
  // exactly as it did.
  const sgroups = el('div', 'srcgroups');
  sources.append(shead, sgroups);
  root.appendChild(sources);

  // Shown only when the run asked for grounded and came back all-web. A mode
  // that is silently ignored is worse than one that is refused.
  const modenote = el('div', 'blank hidden');
  root.appendChild(modenote);

  // The key to the marker glyphs. Only the kinds actually on screen.
  const legend = el('div', 'legend hidden');
  root.appendChild(legend);

  /* prose */
  const prose = el('div', 'prose');
  const cursor = el('span', 'cursor hidden');
  prose.appendChild(cursor);
  root.appendChild(prose);

  const blank = el('div', 'blank hidden');
  root.appendChild(blank);

  const err = el('div', 'err hidden');
  root.appendChild(err);

  /* the sections §7 says are the most tempting thing to delete */
  const refusals = el('section', 'refusals hidden');
  root.appendChild(refusals);

  const related = el('section', 'related hidden');
  root.appendChild(related);

  const actions = el('div', 'actions hidden');
  root.appendChild(actions);

  turn.els = { root, live, phase, detail, toggle, steps, clarify, deep, sources, sgroups,
               modenote, legend, scount: shead.lastChild, prose, cursor, blank, err,
               refusals, related, actions };
  return root;
}

/* ══ event handlers — one per name in ANSWER_EVENTS ════════════════════════ */

/**
 * WHAT THE LIVE RUN CHANGED HERE.
 *
 * The first cut rendered `detail || PHASE_LABEL[phase]` as the whole live line,
 * on the assumption that a detail is a nicer sentence than a label. Against the
 * real pipeline it is not: `reading` arrives with `"33 result(s)"` and
 * `searching` with four model-written queries joined by `·`. The line read
 * "33 result(s)" — a number with no verb in front of it — and then a 90-column
 * query list. So the phase always speaks in words, and the detail rides beside
 * it, clipped, with the full string on hover and in the steps list.
 */
function onStatus(turn, ev) {
  const phase = String(ev && ev.phase || '');
  const detail = ev && ev.detail ? String(ev.detail) : '';
  turn.steps.push({ phase, detail });
  turn.phase = phase;
  turn.phaseDetail = detail;
  turn.els.phase.textContent = phaseLabel(turn, phase);
  paintDetail(turn);
  const li = el('li');
  // The one place markup is built from a string rather than nodes. `detail`
  // carries a search query the model wrote, so it goes through esc() — same
  // guard, same shape as ui.html.
  li.innerHTML = '<b>' + esc(phase) + '</b>' + esc(detail || phaseLabel(turn, phase));
  turn.els.steps.appendChild(li);
}

/**
 * The second thing the live run showed: sources do not burst, they trickle.
 * The robots-gated reader holds a 2s-per-host floor, so eight documents took
 * 19 seconds to land — from 8s to 27s — with the status frozen on one line the
 * whole time. A running count is the difference between "reading" and "stuck".
 */
function paintDetail(turn) {
  const bits = [];
  if (turn.phaseDetail) bits.push(turn.phaseDetail);
  if (turn.phase === 'reading' && turn.sources.length > 0) {
    bits.push(turn.sources.length + ' read');
  }
  const line = bits.join('  ·  ');
  turn.els.detail.textContent = line;
  turn.els.detail.title = line;
}

/**
 * A SOURCE CARD IS A PROMISE ABOUT WHAT THE READER CAN DO NEXT.
 *
 * Four kinds arrive on the same event and only one of them opens in a tab.
 * The failure this function exists to prevent is four uniform cards: a Brain
 * passage rendered like a web page tells the reader they can go and check it,
 * and they cannot — nothing outside Taskly says it. Flattening them is the
 * single easiest way to throw away everything grounded mode is worth.
 *
 * So each kind gets its own card shape, its own words, and — for the two that
 * cannot be opened — no anchor at all. See KIND for why `linkable` is not
 * merely cosmetic.
 */
function onSource(turn, ev) {
  const i = Number(ev && ev.i) || (turn.sources.length + 1);
  const kind = kindOf(ev && ev.kind);
  const linkable = KIND[kind].linkable;
  // An internal locator NEVER reaches safeUrl: it would resolve against the
  // page origin and come back a valid http URL to a 404.
  const url = linkable ? safeUrl(ev && ev.url) : null;
  const locator = linkable ? '' : String((ev && ev.url) || '');
  const domain = String((ev && ev.domain) || (linkable ? domainOf(url, '') : KIND[kind].origin));
  const title = String((ev && ev.title) || domain || locator || 'Untitled');
  const observedAt = ev && ev.observedAt ? String(ev.observedAt) : '';
  const part = splitLocator(linkable ? '' : String((ev && ev.url) || ''));
  const rec = { i, kind, url, locator, domain, title, observedAt,
                path: part.path, section: part.section };
  turn.sources.push(rec);

  const internal = INTERNAL[kind] === true;
  const card = el(url ? 'a' : 'div', 'src k-' + kind + (internal ? ' internal' : ''));
  if (url) { card.href = url; card.target = '_blank'; card.rel = 'noreferrer noopener'; }

  const top = el('div', 'top');
  // A favicon is a claim that there is a site. Only web gets one — asking
  // Google for the favicon of "taskly brain" would also hand a third party the
  // name of an internal record for nothing.
  top.appendChild(kind === 'web' ? favicon(domain) : kindMark(kind));
  top.appendChild(el('span', 'dom', internal ? KIND[kind].origin : domain));
  top.appendChild(el('span', 'num', String(i)));
  // WHAT A LIVE RUN SHOWED AND A FIXTURE COULD NOT. A real Brain locator is
  //   70-decisions/ADR-005-two-sided-fee-model.md
  //     § 70-decisions/ADR-005-two-sided-fee-model.md › ADR-005 — Two-sided take…
  // and `title` is the path again — so the first cut printed the path three
  // times and the heading, the one human-readable part, was buried at the end
  // of a wrapped mono block.
  //
  // This SPLITS that string for display; it never edits it. The path goes on
  // its own line, the heading trail becomes the card's title, and the only
  // characters not shown are the literal repeat of the path. `Copy path` still
  // copies the locator exactly as it arrived.
  card.appendChild(top);
  const headline = part.section || (part.path === title.trim() ? '' : title);
  if (headline) card.appendChild(el('div', 'ttl', headline));

  if (!internal && url === null) {
    card.appendChild(el('span', 'cant',
      'No openable URL came with this source, so there is nothing to click through to.'));
  }

  if (kind === 'world') {
    // The link goes to their page as it is NOW. What we are citing is what it
    // said on the day we read it, and those are not the same thing.
    const when = whenText(observedAt);
    card.appendChild(el('span', 'when', when ? 'Read on ' + when : 'Read — no date recorded'));
    // Only the exception is per-card: a fact with no date is weaker than one
    // with a stale date, and the group hint cannot say that about one card.
    if (!when) card.appendChild(el('span', 'cant',
      'No date came with this one, so how current it is cannot be told from here.'));
    card.title = 'Our observation of ' + domain + (when ? ' on ' + when : '') +
      '. Opens their page as it stands today.';
  } else if (kind === 'brain') {
    if (part.path) card.appendChild(el('div', 'loc', part.path));
    if (locator) card.appendChild(copyLocator(locator, 'Copy path'));
  } else if (kind === 'ledger') {
    if (part.path) card.appendChild(el('div', 'loc', part.path));
    const when = whenText(observedAt);
    card.appendChild(el('span', 'when', when ? 'Recorded ' + when : 'Recorded — no date noted'));
    if (locator) card.appendChild(copyLocator(locator, 'Copy row'));
  }

  gridFor(turn, kind).appendChild(card);
  turn.els.sources.classList.remove('hidden');
  // The first non-web source is what earns the grounded wording, so the live
  // line is repainted the moment one lands.
  if (turn.mode === 'grounded' && kind !== 'web' && turn.phase) {
    turn.els.phase.textContent = phaseLabel(turn, turn.phase);
  }
  paintSourceCount(turn);
  paintLegend(turn);
  paintDetail(turn);

  // Staggered, capped: eight sources should not take a second to appear.
  const delay = Math.min(turn.sources.length - 1, 9) * 55;
  setTimeout(() => card.classList.add('in'), 20 + delay);
}

/**
 * A locator, split for display into the document and the place inside it.
 *
 * Presentation only. Nothing is rewritten and nothing is inferred: the two
 * halves are the exact substrings either side of the first ` § `, and the one
 * thing dropped is the path where the route repeats it at the head of the
 * section trail. A locator with no ` § ` — a ledger row — comes back whole.
 */
function splitLocator(locator) {
  const raw = String(locator || '');
  const at = raw.indexOf(' § ');
  if (at === -1) return { path: raw, section: '' };
  const path = raw.slice(0, at);
  let section = raw.slice(at + 3);
  if (section.startsWith(path)) section = section.slice(path.length).replace(/^\s*›\s*/, '');
  return { path, section: section.trim() };
}

/** The glyph that stands where a favicon would. Same 14px box, so a mixed
 *  strip stays on one grid. */
function kindMark(kind) {
  const n = el('span', 'kmark', KIND[kind].mark);
  n.setAttribute('aria-hidden', 'true');
  return n;
}

/** An internal source cannot be opened, so it gets the one thing it CAN
 *  offer: the locator, in your clipboard, ready to paste into the vault. */
function copyLocator(locator, label) {
  const b = el('button', 'copy', label);
  b.type = 'button';
  b.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    copyText(locator, 'Copied — ' + locator);
  });
  return b;
}

/**
 * Groups appear in KIND_ORDER regardless of arrival order, because the order
 * is itself information: what the open web said, then what we saw on their
 * page, then what we wrote, then what we guessed. Weakest-to-ours, ending on
 * the thing that is not evidence at all.
 */
function gridFor(turn, kind) {
  const have = turn.groups.get(kind);
  if (have) return have.grid;

  const sec = el('section', 'srcgroup');
  sec.dataset.kind = kind;
  const lab = el('span', 'eyebrow', KIND[kind].group);
  const grid = el('div', 'srcgrid');
  sec.append(lab);
  if (KIND[kind].hint) sec.appendChild(el('span', 'ghint', KIND[kind].hint));
  sec.appendChild(grid);

  const at = KIND_ORDER.indexOf(kind);
  let before = null;
  for (const k of KIND_ORDER.slice(at + 1)) {
    const g = turn.groups.get(k);
    if (g) { before = g.sec; break; }
  }
  turn.els.sgroups.insertBefore(sec, before);
  turn.groups.set(kind, { sec, grid, lab });

  // A strip that is nothing but web pages needs no headings — that is a web
  // run, and it should look exactly as it did before grounded mode existed.
  // Any other single kind KEEPS its heading, because the heading is where the
  // "these cannot be opened" caveat now lives.
  const webOnly = turn.groups.size === 1 && turn.groups.has('web');
  for (const g of turn.groups.values()) g.sec.classList.toggle('bare', webOnly);
  return grid;
}

/** The count line carries the MIX, not just the total. "7 sources" over an
 *  answer that is five of our own documents is a true number telling a false
 *  story. */
function paintSourceCount(turn) {
  const counts = new Map();
  for (const r of turn.sources) counts.set(r.kind, (counts.get(r.kind) || 0) + 1);
  if (counts.size < 2) { turn.els.scount.textContent = String(turn.sources.length); return; }
  const bits = KIND_ORDER.filter((k) => counts.get(k)).map((k) => {
    const n = counts.get(k);
    return n + ' ' + (n === 1 ? KIND[k].one : KIND[k].many);
  });
  turn.els.scount.textContent = turn.sources.length + ' · ' + bits.join(' · ');
}

/** A form language nobody was taught is decoration. The key names every glyph
 *  actually on screen, and nothing else. */
function paintLegend(turn) {
  const kinds = new Set(turn.sources.map((r) => r.kind));
  const box = turn.els.legend;
  box.replaceChildren();
  if (kinds.size < 2 && !kinds.has('brain') && !kinds.has('ledger') && !kinds.has('world')) {
    box.classList.add('hidden');
    return;
  }
  const row = (glyph, cls, text) => {
    const n = el('span');
    n.appendChild(el('i', cls, glyph));
    n.appendChild(document.createTextNode(text));
    box.appendChild(n);
  };
  // `n`, not a digit. The first cut used 1 / 2 / §3 / ~4 and a live run put the
  // key directly under a five-card strip, where "§3" read as a pointer at
  // source 3 rather than as the shape of any brain marker.
  if (kinds.has('web')) row('n', null, 'a page off the open web — opens');
  if (kinds.has('world')) row('n', 'u', 'a competitor’s page, as we read it on a date — opens');
  if (kinds.has('brain')) row('§n', null, 'a document we wrote — no link, we are citing ourselves');
  if (kinds.has('ledger')) row('~n', null, 'a forecast — what we expect, never what we measured');
  box.classList.remove('hidden');
}

/** Favicon, with a CSS-drawn monogram when the fetch fails (or is blocked). */
function favicon(domain) {
  const fb = el('span', 'fav-fb', (domain || '?').slice(0, 1));
  if (!domain) return fb;
  const img = el('img', 'fav');
  img.alt = '';
  img.loading = 'lazy';
  img.referrerPolicy = 'no-referrer';
  img.src = 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(domain);
  img.addEventListener('error', () => { img.replaceWith(fb); }, { once: true });
  return img;
}

function onSpan(turn, ev) {
  const id = Number(ev && ev.id);
  if (!Number.isFinite(id)) return;
  turn.spans.set(id, {
    id,
    sourceIndex: Number(ev.sourceIndex),
    quote: String(ev.quote ?? ''),
  });
}

/* ── the hot path ─────────────────────────────────────────────────────────
   `delta` arrives many times a second. It must not read or rebuild anything
   above the sentence it names. The end of this function is appendData(). */

function sentenceOf(turn, n) {
  let s = turn.sentences.get(n);
  if (s) return s;
  const node = el('span', 'sent pending');
  node.dataset.n = String(n);
  s = { n, node, raw: '', cut: 0, badges: [], verdict: 'pending', why: '' };
  turn.sentences.set(n, s);
  turn.order.push(n);
  // Sentences are separated by a space; HTML collapses a doubled one, so this
  // is safe whether or not the server's text carries its own leading space.
  const prose = turn.els.prose;
  prose.insertBefore(node, turn.els.cursor);
  prose.insertBefore(document.createTextNode(' '), turn.els.cursor);
  turn.els.cursor.classList.remove('hidden');
  return s;
}

/**
 * Markers are written " [1]." and read "…October¹." — the space in front of a
 * superscript is a rendering artefact, so it comes back out here rather than
 * being trimmed from the model's text (which we never rewrite).
 *
 * `endsWith(' ')` was not enough, and the live run is what showed it: Groq
 * writes U+202F NARROW NO-BREAK SPACE before a marker (and inside money ranges
 * — "$40\u202fto\u202f$150"). Being no-break, it does not collapse the way an
 * ordinary space does, so every citation rendered as "$52 ¹ ." with a visible
 * gap on both sides. The scripted demo used ASCII spaces and could never have
 * caught it. `\s` in JS already covers the whole Unicode space-separator class,
 * so one character of any whitespace comes off.
 */
function eatTrailingSpace(s) {
  const last = s.node.lastChild;
  if (last && last.nodeType === 3 && /\s$/.test(last.data)) {
    last.deleteData(last.data.length - 1, 1);
  }
}

function appendText(s, text) {
  if (!text) return;
  const last = s.node.lastChild;
  if (last && last.nodeType === 3) last.appendData(text);   // ← the whole point
  else s.node.appendChild(document.createTextNode(text));
}

const MARKER_RE = /^\s*\d{1,3}(\s*[,;]\s*\d{1,3})*\s*$/;

/**
 * Consume as much of the accumulated sentence text as is unambiguous.
 *
 * A marker can be split across deltas ("[" then "2]"), so an unclosed bracket
 * is HELD rather than printed — otherwise a stray "[" flashes on screen and
 * then has to be un-printed, which means rewriting text already committed to
 * the DOM. It is released as literal text after 32 characters with no "]",
 * which is long enough for any marker and short enough that real prose
 * containing a bracket does not stall.
 */
function drain(turn, s) {
  const raw = s.raw;
  let i = s.cut;
  while (i < raw.length) {
    const open = raw.indexOf('[', i);
    if (open === -1) { appendText(s, raw.slice(i)); i = raw.length; break; }
    if (open > i) { appendText(s, raw.slice(i, open)); i = open; }
    const close = raw.indexOf(']', open);
    if (close === -1) {
      if (raw.length - open > 32) { appendText(s, '['); i = open + 1; continue; }
      break;                                    // wait for more text
    }
    const inner = raw.slice(open + 1, close);
    if (MARKER_RE.test(inner)) {
      eatTrailingSpace(s);
      for (const part of inner.split(/[,;]/)) addBadge(turn, s, Number(part.trim()));
    } else {
      appendText(s, raw.slice(open, close + 1)); // "[sic]" is prose, not a marker
    }
    i = close + 1;
  }
  s.cut = i;
}

function feedDelta(turn, n, text) {
  if (!Number.isFinite(n)) return;
  const s = sentenceOf(turn, n);
  s.raw += text;
  drain(turn, s);
}

function addBadge(turn, s, id) {
  if (!Number.isFinite(id)) return;
  const b = el('sup', 'cb ' + s.verdict, String(id));
  b.dataset.span = String(id);
  b.dataset.turn = turn.id;
  b.dataset.n = String(s.n);
  b.tabIndex = 0;
  b.setAttribute('role', 'button');
  s.badges.push(b);
  s.node.appendChild(b);
  paintBadgeKind(turn, b);
}

/* ── kind, on the marker ──────────────────────────────────────────────────
   The strip tells you what this answer rests on. The marker has to tell you
   what THIS SENTENCE rests on, or the reader has to scroll up and count.

   The glyph inherits the verdict colour rather than introducing one, so the
   two channels never collide: colour still means confirmed / unconfirmed /
   stored, and form still means where it came from. */

function sourceForSpan(turn, id) {
  const span = turn.spans.get(Number(id));
  if (!span) return null;
  return turn.sources.find((x) => x.i === span.sourceIndex) || null;
}

const KIND_SAYS = {
  web: 'from a web page',
  world: 'from a competitor’s page as we read it',
  brain: 'from a document we wrote',
  ledger: 'from a forecast, not a measurement',
};

const VERDICT_SAYS = {
  pending: 'checking',
  confirmed: 'confirmed',
  flagged: 'could not be confirmed',
  stored: 'from a saved answer',
};

function paintBadgeKind(turn, b) {
  const src = sourceForSpan(turn, b.dataset.span);
  const sent = turn.sentences.get(Number(b.dataset.n));
  const verdict = sent ? sent.verdict : 'pending';
  // A span can arrive after the marker it numbers. Until it does the badge is
  // simply un-kinded — never guessed at.
  if (src && b.dataset.kind !== src.kind) {
    b.dataset.kind = src.kind;
    for (const k of KIND_ORDER) b.classList.toggle('k-' + k, k === src.kind);
    const mark = (src.kind === 'brain' || src.kind === 'ledger') ? KIND[src.kind].mark : '';
    let g = b.querySelector('.g');
    if (mark === '') { if (g) g.remove(); }
    else if (g) { g.textContent = mark; }
    else {
      g = el('i', 'g', mark);
      g.setAttribute('aria-hidden', 'true');
      b.insertBefore(g, b.firstChild);
    }
  }
  b.setAttribute('aria-label', 'Citation ' + b.dataset.span +
    (src ? ', ' + KIND_SAYS[src.kind] : '') + ', ' + VERDICT_SAYS[verdict]);
}

/**
 * A SENTENCE THAT IS ENTIRELY FORECAST IS THE ONE THAT CAN PASS FOR A FINDING.
 *
 * Every other mixed case has at least one observation holding it up. A
 * sentence citing only ledger rows is a statement about a future that has not
 * happened, written in the same voice as the rest of the answer — so it is
 * labelled in words at the head of the sentence, not decorated and left for
 * the reader to decode.
 */
function markForecastSentence(turn, sent) {
  if (!sent || !sent.badges.length) return;
  const kinds = sent.badges.map((b) => b.dataset.kind || '');
  const all = kinds.every((k) => k === 'ledger');
  const has = sent.node.firstChild && sent.node.firstChild.classList &&
              sent.node.firstChild.classList.contains('fx');
  sent.node.classList.toggle('fcast', all);
  if (all && !has) {
    const tag = el('i', 'fx', 'forecast');
    tag.title = 'Every citation in this sentence is a forecast we recorded. Nothing here was measured.';
    sent.node.insertBefore(tag, sent.node.firstChild);
  } else if (!all && has) {
    sent.node.firstChild.remove();
  }
}

/**
 * pending → confirmed | flagged.
 *
 * The class swap is the entire mechanism: the badge is already in the DOM with
 * `.pending`, and the verdict replaces one class on each badge plus one on the
 * sentence. No text moves, so a settle mid-stream cannot disturb the prose the
 * reader is in the middle of.
 */
function onVerdict(turn, ev) {
  const n = Number(ev && ev.n);
  const v = (ev && ev.verdict) === 'flagged' ? 'flagged' : 'confirmed';
  const s = sentenceOf(turn, n);
  s.verdict = v;
  s.why = ev && ev.why ? String(ev.why) : '';
  s.node.classList.remove('pending');
  s.node.classList.add(v);
  for (const b of s.badges) {
    b.classList.remove('pending');
    b.classList.add(v);
    paintBadgeKind(turn, b);
  }
  markForecastSentence(turn, s);
}

/* ══ DEEP RESEARCH — plan · step · reflect ═════════════════════════════════

   events: plan     { steps: [{n, question, why}], revisedBecause? }
           step     { n, state: running|done|skipped, detail?, found? }
           reflect  { after, stillOpen: [], note, stop? }

   THE ONE NUMBER THAT MATTERS IS `found`, AND IT IS NOT A COUNT OF PAGES.

   The contract is explicit that `found` is NEW PROVEN SPANS — not documents
   read, not results returned — and that a step which read nine pages and
   proved nothing is the single most useful thing a watching reader can be
   told. Everything about how a step renders follows from that: a finished step
   with `found: 0` gets the hollow dotted marker this file already uses for
   "not an observation", the word "nothing proved" in the alarm colour, and its
   `detail` printed beside it so the nine pages are visible as effort that
   bought nothing. It never gets the filled marker a productive step gets.

   Two finished steps and nothing proved raises a banner saying so in words,
   because that is the moment to stop and the interface should be the thing
   that says it — not the clock. */

const DEEP_LEAD =
  'Deep runs take two to four minutes. The plan below went up before anything was searched, ' +
  'so it can be judged on its questions rather than on how long it has been going. ' +
  'Each step reports how many NEW proven quotes it added — not how many pages it read.';

/** Elapsed, in the shortest form that is still exact. */
function fmtElapsed(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
}

/** The panel appears the moment a deep run starts — before the first `plan`,
 *  so the four seconds of planning are not four seconds of nothing. */
function deepBegin(turn) {
  if (turn.deepStartedAt) return;
  turn.deepStartedAt = Date.now();
  turn.els.deep.classList.remove('hidden');
  renderDeep(turn);
  // Only the meter is repainted on the tick. The plan rows do not move.
  turn.tick = setInterval(() => paintDeepMeter(turn), 1000);
}

function deepStopTick(turn) {
  if (turn && turn.tick) { clearInterval(turn.tick); turn.tick = 0; }
}

/** The highest step that has already been reported on. A revision that arrives
 *  now belongs after THAT row, because that is where in the run it happened. */
function lastTouchedStep(turn) {
  let last = 0;
  for (const n of turn.planOrder) {
    const s = turn.plan.get(n);
    if (s && s.state !== 'pending') last = Math.max(last, n);
  }
  return last;
}

/**
 * A REVISED PLAN IS A CHANGE TO THE PLAN ON SCREEN, NEVER A REPLACEMENT OF IT.
 *
 * `PlanStep.n` is documented stable across a revision — a replan revises
 * `question` and never renumbers — and that is exactly what makes an honest
 * render possible. Swapping the list for the new one would leave a reader who
 * looked away for thirty seconds unable to tell that anything had changed, and
 * a run that quietly rewrites its own questions mid-flight is the thing this
 * whole panel exists to make visible.
 *
 * So a revision: keeps every old question, struck, under its replacement;
 * marks genuinely new steps as added; marks steps the revision dropped as
 * dropped rather than deleting the row; and prints `revisedBecause` as a dated
 * event in the timeline, in the position it actually happened.
 */
function onPlan(turn, ev) {
  deepBegin(turn);
  const raw = (ev && Array.isArray(ev.steps)) ? ev.steps : [];
  const because = String((ev && ev.revisedBecause) || '').trim();
  const first = turn.planOrder.length === 0;
  const changed = [];
  const added = [];
  const seen = new Set();
  /* WHERE THIS REVISION HAPPENED, READ BEFORE ANYTHING IS TOUCHED.
   *
   * Rewording a step resets it to `pending`, so asking afterwards which step
   * the run had reached gets the answer "the one before" — the demo rendered
   * "the plan changed after step 1" for a revision caused by step 2 failing,
   * which points the reader at the wrong step and hides the actual cause. */
  const afterN = lastTouchedStep(turn);

  for (const s of raw) {
    const n = Number(s && s.n);
    if (!Number.isFinite(n)) continue;
    seen.add(n);
    const question = String((s && s.question) || '').trim();
    const why = String((s && s.why) || '').trim();
    const have = turn.plan.get(n);
    if (!have) {
      turn.plan.set(n, { n, question, why, state: 'pending', detail: '', found: null,
                         was: [], isNew: !first, dropped: false });
      turn.planOrder.push(n);
      if (!first) added.push(n);
      continue;
    }
    have.dropped = false;
    if (question !== '' && question !== have.question) {
      /* A REWORDED SLOT DOES NOT INHERIT THE OLD QUESTION'S RESULT.
       *
       * Caught on the first render of the demo, and it is not cosmetic. Step 2
       * read eleven pages, proved nothing, and was reworded because of it —
       * and the row went on showing "done" until the new question reported,
       * then showed the NEW question above the OLD question's outcome. The
       * reflection underneath still said "nothing survived the check", so the
       * panel contradicted itself.
       *
       * `n` is stable across a revision, but the QUESTION is what the outcome
       * belongs to. So the old question keeps its own result, struck, and the
       * slot goes back to pending until the revised question reports its own.
       * `foundTotal` is deliberately NOT rolled back: those spans were really
       * proved, by the question that proved them. */
      have.was.push({ question: have.question, state: have.state,
                      found: have.found, detail: have.detail });
      have.question = question;
      have.state = 'pending';
      have.detail = '';
      have.found = null;
      changed.push(n);
    }
    if (why !== '') have.why = why;
  }

  // A step the revision left out. Not deleted — a plan that quietly loses a
  // question is a plan whose reader cannot tell it ever had one.
  if (!first) {
    for (const n of turn.planOrder) {
      const s = turn.plan.get(n);
      if (s && !seen.has(n) && s.state === 'pending') s.dropped = true;
    }
  }

  turn.planOrder.sort((a, b) => a - b);
  if (!first) {
    turn.revisions.push({
      because, afterN, changed, added,
      droppedCount: turn.planOrder.filter((n) => turn.plan.get(n).dropped).length,
    });
  }
  renderDeep(turn);
}

/** `state` is a closed set on the wire. Anything else is left as-is rather
 *  than guessed at, which shows up as a step that never leaves `pending` —
 *  visibly wrong, rather than invisibly wrong. */
const STEP_STATES = { running: true, done: true, skipped: true };

function onStep(turn, ev) {
  deepBegin(turn);
  const n = Number(ev && ev.n);
  if (!Number.isFinite(n)) return;
  let s = turn.plan.get(n);
  if (!s) {
    // A step for a question that was never published. Rendered anyway — the
    // alternative is dropping the only evidence that the plan and the run
    // disagree about what is being done.
    s = { n, question: '', why: '', state: 'pending', detail: '', found: null,
          was: [], isNew: false, dropped: false, unplanned: true };
    turn.plan.set(n, s);
    turn.planOrder.push(n);
    turn.planOrder.sort((a, b) => a - b);
  }
  const state = String((ev && ev.state) || '');
  if (STEP_STATES[state]) s.state = state;
  s.detail = String((ev && ev.detail) || '');
  const found = Number(ev && ev.found);
  if (Number.isFinite(found)) {
    // `found` is a per-step count of NEW spans, so the run total is a sum and
    // the delta has to be taken rather than the raw value re-added on a repeat.
    turn.foundTotal += found - (Number.isFinite(s.found) ? s.found : 0);
    s.found = found;
  }
  renderDeep(turn);
}

function onReflect(turn, ev) {
  deepBegin(turn);
  const after = Number(ev && ev.after);
  turn.reflects.push({
    after: Number.isFinite(after) ? after : 0,
    stillOpen: (ev && Array.isArray(ev.stillOpen) ? ev.stillOpen : [])
      .map(String).map((x) => x.trim()).filter((x) => x !== ''),
    note: String((ev && ev.note) || '').trim(),
    stop: (ev && typeof ev.stop === 'string' && ev.stop.trim() !== '') ? ev.stop.trim() : '',
  });
  renderDeep(turn);
}

/** Just the meter, so a per-second tick does not rebuild the plan. */
function paintDeepMeter(turn) {
  if (!turn.els || !turn.els.deepMeter) return;
  const bits = [];
  if (turn.deepStartedAt) {
    bits.push(fmtElapsed((turn.doneAt || Date.now()) - turn.deepStartedAt));
  }
  const total = turn.planOrder.filter((n) => !turn.plan.get(n).dropped).length;
  const settled = turn.planOrder.filter((n) => {
    const s = turn.plan.get(n);
    return s.state === 'done' || s.state === 'skipped';
  }).length;
  if (total > 0) bits.push(settled + '/' + total + ' steps');
  // Named in full every time. "4 spans" beside a step count reads as four of
  // something the run did; the word "proved" is the entire distinction.
  bits.push(turn.foundTotal + (turn.foundTotal === 1 ? ' span proved' : ' spans proved'));
  turn.els.deepMeter.textContent = bits.join('  ·  ');
}

function renderDeep(turn) {
  const box = turn.els.deep;
  box.replaceChildren();
  box.classList.remove('hidden');

  const head = el('div', 'deep-head');
  head.appendChild(el('span', 'eyebrow', 'Deep research'));
  const meter = el('span', 'deep-meter');
  head.appendChild(meter);
  box.appendChild(head);
  turn.els.deepMeter = meter;

  const running = !turn.doneAt && !turn.stopped && !turn.errored;
  box.appendChild(el('p', 'deep-why', running
    ? DEEP_LEAD
    : 'The plan this run followed, and what each step actually proved. Kept on screen: an answer ' +
      'is easier to judge when the questions behind it are visible.'));

  /* THE ABANDON CONTROL. First-class, beside the plan, live from the first
     second — not hidden behind a menu and not only offered once things look
     bad, because by then it is minute four. */
  if (running && !S.demo) {
    const bar = el('div', 'deep-bar');
    const stop = el('button', null, 'Stop this run');
    stop.type = 'button';
    stop.title = 'Stop showing this run here.';
    stop.addEventListener('click', () => stopRun(turn));
    bar.appendChild(stop);
    // Said out loud because it is not what the button looks like it does. The
    // route has no cancel channel — `sse.ts` writes into the response and
    // nothing upstream watches for a closed socket — so closing the stream
    // stops the RENDER, and the server finds out when a write fails.
    bar.appendChild(el('span', 'deep-meter',
      'stops the display — the server has no cancel channel yet'));
    box.appendChild(bar);
  } else if (running && S.demo) {
    const bar = el('div', 'deep-bar');
    const stop = el('button', null, 'Stop this run');
    stop.type = 'button';
    stop.addEventListener('click', () => stopRun(turn));
    bar.appendChild(stop);
    bar.appendChild(el('span', 'deep-meter', 'scripted — nothing is being spent'));
    box.appendChild(bar);
  }

  /* The banner that exists so nobody has to infer it from a column of dotted
     circles. Two settled steps and nothing proved is the abandon signal. */
  const settled = turn.planOrder.filter((n) => {
    const s = turn.plan.get(n);
    return s.state === 'done' || s.state === 'skipped';
  });
  if (settled.length >= 2 && turn.foundTotal === 0) {
    /* Tense matters. Mid-run this is advice — stop now. After the run it is a
     * finding, and telling a reader to stop something that has already ended
     * makes the banner read as decoration the next time it fires while it can
     * still be acted on. Seen on the first live deep run, which finished 4/4
     * steps having proved nothing at all. */
    box.appendChild(el('div', 'deep-warn', running
      ? settled.length + ' steps have finished and nothing has been proved yet — no quote from any ' +
        'page read so far survived the verbatim check. Pages read is not progress. If the rest of ' +
        'the plan rests on the same sources, this is the point to stop rather than at minute four.'
      : 'All ' + settled.length + ' steps finished and nothing was proved. ' +
        (turn.sources.length
          ? turn.sources.length + ' page(s) were read and not one sentence on them survived the ' +
            'verbatim check, so there was nothing this run could quote. '
          : 'No page this run read carried a quotable sentence. ') +
        'That is a result about these sources, not about the question.'));
  }

  if (turn.planOrder.length === 0) {
    box.appendChild(el('p', 'deep-why',
      running ? 'Working out the sub-questions. Nothing has been searched yet.'
              : 'This run published no plan.'));
    paintDeepMeter(turn);
    return;
  }

  const list = el('ol', 'plan');
  const usedRev = new Set();
  const usedRefl = new Set();

  // A revision that landed before any step ran, which is the planner correcting
  // itself rather than the run doing so.
  turn.revisions.forEach((r, i) => {
    if (r.afterN === 0) { list.appendChild(revisionRow(r)); usedRev.add(i); }
  });

  for (const n of turn.planOrder) {
    list.appendChild(stepRow(turn, turn.plan.get(n)));
    // Reflection first, then the revision it justifies: that is the order they
    // happen in, and reading them the other way round makes the revision look
    // unprompted.
    turn.reflects.forEach((rf, i) => {
      if (rf.after === n && !usedRefl.has(i)) { list.appendChild(reflectRow(rf)); usedRefl.add(i); }
    });
    turn.revisions.forEach((r, i) => {
      if (r.afterN === n && !usedRev.has(i)) { list.appendChild(revisionRow(r)); usedRev.add(i); }
    });
  }

  // Anything anchored to a step that never appeared still gets rendered. A
  // reflection is the run's own reasoning and dropping it because its anchor is
  // missing would delete the very thing this panel is for.
  turn.reflects.forEach((rf, i) => { if (!usedRefl.has(i)) list.appendChild(reflectRow(rf)); });
  turn.revisions.forEach((r, i) => { if (!usedRev.has(i)) list.appendChild(revisionRow(r)); });

  box.appendChild(list);
  paintDeepMeter(turn);
}

const STEP_MARK = { pending: '·', running: '›', done: '✓', skipped: '–' };

function stepRow(turn, s) {
  const barren = s.state === 'done' && s.found === 0;
  const li = el('li', 'pstep ' + s.state + (barren ? ' barren' : '') + (s.dropped ? ' skipped' : ''));

  const mk = el('span', 'mk', barren ? '0' : (STEP_MARK[s.state] || '·'));
  mk.setAttribute('aria-hidden', 'true');
  li.appendChild(mk);

  const qn = el('div', 'qn');
  qn.appendChild(document.createTextNode(
    s.question || (s.unplanned ? 'A step the plan never named' : 'Sub-question ' + s.n)));
  if (s.isNew) {
    const t = el('span', 'tag-new', 'added');
    t.title = 'This sub-question was not in the original plan — it was added by a revision.';
    qn.appendChild(t);
  }
  li.appendChild(qn);

  if (s.why) li.appendChild(el('div', 'why', s.why));

  // Every question this slot has previously carried — newest first, struck,
  // each with the outcome it actually reached before it was replaced.
  for (let i = s.was.length - 1; i >= 0; i--) {
    const prev = s.was[i];
    const was = el('div', 'was');
    was.appendChild(el('b', null, 'was'));
    was.appendChild(el('s', null, prev.question));
    const bits = [];
    if (prev.state === 'done') {
      bits.push(prev.found === null ? 'done, found not reported'
        : prev.found === 0 ? 'read, proved nothing'
        : 'proved ' + prev.found + (prev.found === 1 ? ' span' : ' spans'));
    } else if (prev.state === 'running') bits.push('was still running');
    else if (prev.state === 'skipped') bits.push('skipped');
    else bits.push('never ran');
    if (prev.detail) bits.push(prev.detail);
    was.appendChild(el('em', null, bits.join(' · ')));
    li.appendChild(was);
  }

  const st = el('div', 'st');
  if (s.dropped) {
    st.appendChild(el('span', 'nil', 'dropped by a revision'));
  } else if (s.state === 'running') {
    st.appendChild(document.createTextNode('running'));
  } else if (s.state === 'skipped') {
    st.appendChild(document.createTextNode('skipped'));
  } else if (s.state === 'done') {
    if (s.found === null) {
      // The contract makes `found` optional, and "not reported" is not zero.
      st.appendChild(el('span', 'nil', 'found not reported'));
    } else if (s.found === 0) {
      const n = el('span', 'nil', 'nothing proved');
      n.title = 'This step finished without adding a single quote that survived the verbatim check. ' +
                'Whatever it read, none of it can be cited.';
      st.appendChild(n);
    } else {
      st.appendChild(el('span', 'found',
        '+' + s.found + (s.found === 1 ? ' span proved' : ' spans proved')));
    }
  } else {
    st.appendChild(document.createTextNode('not started'));
  }
  if (s.detail) {
    const d = el('span', 'det', s.detail);
    d.title = s.detail;
    st.appendChild(d);
  }
  li.appendChild(st);
  return li;
}

function revisionRow(r) {
  const li = el('li', 'prev');
  li.appendChild(el('span', 'eyebrow',
    r.afterN > 0 ? 'The plan changed after step ' + r.afterN : 'The plan changed before it started'));
  li.appendChild(el('p', null, r.because ||
    'The run revised its plan and gave no reason. The changed questions are marked below.'));
  // Named by step number, so the banner points at the rows it is about rather
  // than leaving the reader to find them.
  const bits = [];
  const nums = (a) => a.map((n) => '#' + n).join(', ');
  if (r.changed.length) bits.push('reworded ' + nums(r.changed));
  if (r.added.length) bits.push('added ' + nums(r.added));
  if (r.droppedCount) bits.push('dropped ' + r.droppedCount);
  if (bits.length) {
    const p = el('p', null, bits.join(' · ') +
      ' — a reworded step keeps its old question and its old result, struck, underneath.');
    p.style.color = 'var(--faint)';
    li.appendChild(p);
  }
  return li;
}

function reflectRow(rf) {
  const li = el('li');
  const box = el('div', 'refl' + (rf.stop ? ' stop' : ''));
  // A run emits one LAST reflection that is about the run, not about the step
  // it happens to follow — it carries `stop` and reports the totals. Rendered
  // with the step heading it produced two boxes both titled "after step 5",
  // one of them a summary, which reads as the run thinking twice about the
  // same step.
  box.appendChild(el('span', 'eyebrow',
    rf.stop ? 'How the run ended'
      : rf.after > 0 ? 'What the run thought after step ' + rf.after
      : 'What the run thought'));
  if (rf.note) box.appendChild(el('p', null, rf.note));
  if (rf.stillOpen.length) {
    box.appendChild(el('span', 'eyebrow', 'Still open'));
    const ul = el('ul');
    for (const o of rf.stillOpen) ul.appendChild(el('li', null, o));
    box.appendChild(ul);
  } else if (rf.note) {
    /* SILENCE IS NOT CLOSURE. This line used to read "Nothing left open at this
     * point", and the first live run showed why that is wrong: the final
     * reflection of a run that proved NOTHING carried an empty `stillOpen`,
     * directly under a previous reflection listing four open questions. The
     * page then announced that everything was settled, about a run that had
     * answered none of it. The frame reports what the run said; it cannot
     * report what the run meant. */
    const p = el('p', null, 'The run listed nothing as still open here.');
    p.style.color = 'var(--faint)';
    p.style.fontSize = '12px';
    box.appendChild(p);
  }
  if (rf.stop) {
    // "The plan is answered" and "the budget cap ended it" are different
    // outcomes, and the contract says so. The reason is printed, never a
    // generic "finished".
    const s = el('div', 'stopline');
    s.appendChild(el('b', null, 'stopped here'));
    s.appendChild(document.createTextNode(rf.stop));
    box.appendChild(s);
  }
  li.appendChild(box);
  return li;
}

/**
 * ABANDONING A RUN, AND WHAT IT HONESTLY DOES.
 *
 * It closes the EventSource, which stops the render. It does NOT cancel the
 * run: `sse.ts` writes frames into the response and nothing upstream watches
 * for a closed socket, so the server keeps going until a write fails. Saying
 * "cancelled" here would be inventing a capability, so the wording is about
 * the display and the fine print says where the run actually is.
 */
function stopRun(turn) {
  if (turn.doneAt || turn.stopped) return;
  turn.stopped = true;
  turn.stoppedAt = turn.deepStartedAt ? fmtElapsed(Date.now() - turn.deepStartedAt) : '';
  stopStream();
  finishTurn(turn, null);
  toast('Stopped — nothing more will be shown for this run');
}

/* ══ clarify — the round trip ══════════════════════════════════════════════

   event: clarify { questions: string[], because: string } — AND THE STREAM ENDS.

   That ending is not a failure and it is not a `done`. Nothing was searched,
   no model wrote anything, and nothing was spent — the run stopped at the door
   because the question was too broad to spend minutes on. The card therefore
   has to say the one thing a reader will otherwise assume from a big box
   appearing under their question: this has not started.

   SSE has no upstream channel, so answering is a NEW REQUEST. That is the
   contract's own reasoning and it decides the shape here: the answers are
   collected in the page, the same turn is reset, and the stream is opened
   again with the replies riding in the query string.

   THE TRANSPORT IS THE ROUTE'S, READ OFF IT — repeated `a=` parameters, one
   per clarifying question, IN THE ORDER `ClarifyEvent.questions` listed them.
   `server.ts` reads them with `getAll('a')` and hands them to
   `parseClarifications`, and `ClarifyEvent` carries no ids, so POSITION IS THE
   ADDRESSING. Two consequences the page has to honour:

     · AN INTERIOR BLANK KEEPS ITS SLOT. Dropping an unanswered question shifts
       every later reply onto the wrong question, and the result is a
       well-formed set of answers to a different set of questions — which
       nothing downstream can detect. So a blank is sent as an empty `a=`.
     · The caps are the route's: 8 replies, 500 characters each. Enforced here
       too, so what is sent is what is used rather than what was silently cut.

   The run still checks its own work: if a second clarify comes back carrying
   the SAME questions, the answers did not arrive, and the card says exactly
   that instead of looping silently. */

const CLARIFY_PARAM = 'a';
const CLARIFY_MAX = 8;        // MAX_CLARIFICATIONS in answer-route.ts
const CLARIFY_CHARS = 500;    // MAX_CLARIFICATION_CHARS, ditto

const sameQuestions = (a, b) =>
  a.length === b.length && a.every((x, i) => x === b[i]);

function onClarify(turn, ev) {
  const questions = (ev && Array.isArray(ev.questions) ? ev.questions : [])
    .map(String).map((s) => s.trim()).filter((s) => s !== '');
  const because = String((ev && ev.because) || '').trim();

  if (turn.clarifyAnswers &&
      sameQuestions(turn.clarifyAnswers.map((a) => a.question), questions)) {
    turn.reAsked = true;
  }
  turn.clarify = { questions, because };

  // The stream ends here — but this is not `done`, so no refusals card, no
  // actions bar, no cost line. There is nothing to report on yet.
  deepStopTick(turn);
  turn.els.live.classList.add('hidden');
  turn.els.cursor.classList.add('hidden');
  turn.els.deep.classList.add('hidden');
  stopStream();
  S.live = null;
  setBusy(false);
  renderClarify(turn);
  nudgeScroll(false);
}

function renderClarify(turn) {
  const box = turn.els.clarify;
  box.replaceChildren();
  box.classList.remove('hidden', 'answered');
  const c = turn.clarify;

  box.appendChild(el('span', 'eyebrow', 'Before it spends anything'));
  box.appendChild(el('h3', null, 'It wants to know what you mean first'));
  box.appendChild(el('p', 'lead', c.because ||
    'The run judged the question too broad to spend two to four minutes on, and stopped to ask ' +
    'before searching anything.'));
  // The single most important line on this card.
  box.appendChild(el('p', 'spend',
    'Nothing has run. No search has been made, no page has been fetched and nothing has been ' +
    'spent — the plan has not even been written yet. Answering starts the run; closing the tab ' +
    'costs nothing.'));

  if (turn.reAsked) {
    box.appendChild(el('div', 'deep-warn',
      'It has asked the same questions a second time, which means the answers you gave did not ' +
      'reach the run. The route may not read them yet. Nothing has been spent — but answering ' +
      'again is likely to land in the same place.'));
  }

  const inputs = [];
  c.questions.forEach((q, i) => {
    const wrap = el('div', 'cq');
    const id = turn.id + '-cq' + i;
    const label = el('label');
    label.htmlFor = id;
    label.appendChild(el('span', 'n', String(i + 1)));
    label.appendChild(document.createTextNode(q));
    const input = el('input');
    input.id = id;
    input.type = 'text';
    input.autocomplete = 'off';
    input.placeholder = 'Your answer — or leave it blank';
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); go.click(); }
    });
    wrap.append(label, input);
    box.appendChild(wrap);
    inputs.push(input);
  });

  if (c.questions.length === 0) {
    box.appendChild(el('p', 'lead',
      'It stopped to ask something and then sent no questions, so there is nothing here to answer. ' +
      'Starting it anyway sends the question as you typed it.'));
  }

  const row = el('div', 'row');
  const go = el('button', 'primary', 'Start the deep run');
  go.type = 'button';
  go.addEventListener('click', () => {
    const answers = c.questions.map((q, i) => ({ question: q, answer: inputs[i].value.trim() }));
    startAfterClarify(turn, answers);
  });
  const other = el('button', null, 'Ask something else');
  other.type = 'button';
  other.title = 'Leave this one unstarted and type a different question. Nothing has been spent.';
  other.addEventListener('click', () => { $('#q1').focus(); });
  row.append(go, other);
  box.appendChild(row);

  box.appendChild(el('p', 'fine',
    'A blank answer tells the run you have no constraint there — it is not skipped, it is answered ' +
    '"no preference". Your replies are sent as a new request: the stream that asked has already ' +
    'ended, and there is no way back up it.'));
}

/** The card does not vanish once it has done its job — it becomes the record
 *  of what was asked and what you said, above the answer it shaped. */
function collapseClarify(turn) {
  const box = turn.els.clarify;
  box.replaceChildren();
  box.classList.add('answered');
  box.appendChild(el('span', 'eyebrow', 'It asked first — you answered'));
  const list = el('div', 'cans');
  for (const a of (turn.clarifyAnswers || [])) {
    const row = el('div');
    row.appendChild(el('b', null, a.question));
    row.appendChild(a.answer === ''
      ? el('i', null, 'left blank — no constraint')
      : document.createTextNode(a.answer));
    list.appendChild(row);
  }
  box.appendChild(list);
}

function startAfterClarify(turn, answers) {
  turn.clarifyAnswers = answers;
  turn.clarify = null;
  collapseClarify(turn);
  resetTurnForRerun(turn);
  S.live = turn;
  setBusy(true);
  startRun(turn);
  nudgeScroll(false);
}

/**
 * Answering a clarify is a NEW REQUEST, so everything the previous request put
 * on screen has to go — while the question, and the clarify record above it,
 * stay. The alternative (a second turn) would print the question twice and
 * separate the answers from the run they shaped.
 */
function resetTurnForRerun(turn) {
  deepStopTick(turn);
  turn.steps = [];
  turn.sources = [];
  turn.groups = new Map();
  turn.spans = new Map();
  turn.sentences = new Map();
  turn.order = [];
  turn.phase = '';
  turn.phaseDetail = '';
  turn.plan = new Map();
  turn.planOrder = [];
  turn.revisions = [];
  turn.reflects = [];
  turn.foundTotal = 0;
  turn.deepStartedAt = null;
  turn.epilogue = null;
  turn.lastDone = null;
  turn.doneAt = null;
  turn.errored = false;
  turn.stopped = false;

  const e = turn.els;
  e.sgroups.replaceChildren();
  e.sources.classList.add('hidden');
  e.steps.replaceChildren();
  e.steps.classList.add('hidden');
  e.toggle.classList.add('hidden');
  e.toggle.setAttribute('aria-expanded', 'false');
  e.deep.replaceChildren();
  e.deep.classList.add('hidden');
  e.legend.classList.add('hidden');
  e.modenote.classList.add('hidden');
  e.blank.classList.add('hidden');
  e.err.classList.add('hidden');
  e.refusals.classList.add('hidden');
  e.related.classList.add('hidden');
  e.actions.classList.add('hidden');
  // The cursor lives inside .prose and sentenceOf inserts before it, so it is
  // the one node that survives the clear.
  e.prose.replaceChildren(e.cursor);
  e.cursor.classList.add('hidden');
  e.live.classList.remove('hidden');
  e.phase.textContent = 'Planning searches…';
  e.detail.textContent = '';
}

function showError(turn, msg) {
  turn.errored = true;
  const e = turn.els.err;
  e.replaceChildren(el('b', null, 'Stopped'), document.createTextNode(String(msg)));
  e.classList.remove('hidden');
  turn.els.live.classList.add('hidden');
  turn.els.cursor.classList.add('hidden');
}

/* ══ `epilogue` — the frame that is ABOUT the answer ════════════════════════

   event: epilogue
   data:  { unanswered: string[], note: string, related: string[] }

   Emitted at most once, immediately before `done`, and — this is the part the
   renderer has to respect — ONLY when at least one of the three carries
   something. `done` is unchanged, so a reader that ignores this frame loses
   nothing it used to have.

   Three fields, three different jobs:
     · `unanswered` fills the **Not answerable** card. §7 item 1: these are the
       most tempting thing to delete for a cleaner screen. They stay.
     · `note` co-occurs with an EMPTY answer. When it is here there is no prose
       on screen, and this is the reader's only explanation — so it renders
       first in the refusals card, above the lists.
     · `related` is what the PIPELINE proposed, never what this page invented.
       Chips beside a cited answer borrow the answer's credibility, so they say
       in a footnote that nothing checked them.

   `dropped` is deliberately not here — the route says attribution's refusals
   arrive per-span while the answer is still being built, on a frame that does
   not exist yet. So the Dropped group stays unreported rather than empty. */

const EPILOGUE_EVENT = 'epilogue';

/** Absent is NOT empty. A field this frame does not carry stays `undefined`,
 *  and renderRefusals says "not reported" rather than "nothing". */
function applyEpilogue(turn, raw) {
  const d = (raw && typeof raw === 'object') ? raw : {};
  const list = (v) => (Array.isArray(v) ? v.map(String).filter((x) => x.trim() !== '') : undefined);
  const next = {};
  const related = list(d.related);
  if (related !== undefined) next.related = related;
  const unanswered = list(d.unanswered);
  if (unanswered !== undefined) next.unanswered = unanswered;
  if (typeof d.note === 'string' && d.note.trim() !== '') next.note = d.note.trim();
  if (Object.keys(next).length === 0) return;
  turn.epilogue = Object.assign({}, turn.epilogue, next);
  // It arrives before `done` — but a run that dies in the half-second between
  // the two should still show what it managed to say. Cheap, and idempotent.
  if (turn.doneAt) { renderRefusals(turn, turn.lastDone); renderRelated(turn, turn.lastDone); }
}

/** `done` plus the epilogue, without letting either invent the other's fields.
 *  Null when neither arrived, which renderRefusals reads as "not reported". */
function mergeEpilogue(turn, done) {
  if (done == null && turn.epilogue == null) return null;
  const out = Object.assign({}, done || {});
  for (const k of ['related', 'unanswered', 'note']) {
    if (out[k] === undefined && turn.epilogue && turn.epilogue[k] !== undefined) {
      out[k] = turn.epilogue[k];
    }
  }
  return out;
}

/* ══ done: collapse the status, surface the refusals ═══════════════════════ */

function finishTurn(turn, done) {
  turn.doneAt = Date.now();
  turn.els.live.classList.add('hidden');
  turn.els.cursor.classList.add('hidden');
  // The plan panel stays — it is the record of what was asked and what each
  // step proved — but the clock freezes and the Stop button goes, because a
  // control that cannot do anything is a control that lies.
  deepStopTick(turn);
  /* A RUN REFUSED AT THE DOOR HAS NO WORK TO SHOW.
   *
   * Seen on the first live deep run: the concurrency guard refused the request
   * instantly, and the panel — opened optimistically at submit so the planning
   * seconds are not blank — was left reading "Deep research · 0s · 0 spans
   * proved · this run published no plan", stacked under the error box. Three
   * lines of ceremony about a run that never started, and the "0 spans proved"
   * in particular reads as a result. The error IS the whole story, exactly as
   * it is for the refusals card below. */
  if (turn.deepStartedAt) {
    if ((turn.errored || turn.stopped) && turn.planOrder.length === 0) {
      turn.els.deep.replaceChildren();
      turn.els.deep.classList.add('hidden');
    } else {
      renderDeep(turn);
    }
  }
  // A replayed answer has no steps to re-open, and "Completed 0 steps" is a
  // button that lies about having something behind it.
  if (turn.steps.length > 0) {
    // These are PHASE steps (planning, searching, reading…), not the deep
    // run's plan steps, and a deep answer showed "Completed 19 steps" directly
    // above a panel reading "5/5 STEPS". One word, two meanings, one screen.
    turn.els.toggle.textContent = 'Completed ' + turn.steps.length + ' stage' +
      (turn.steps.length === 1 ? '' : 's');
    turn.els.toggle.classList.remove('hidden');
  }

  const full = mergeEpilogue(turn, done);
  turn.lastDone = full;

  if (full && full.threadId) { S.threadId = String(full.threadId); turn.threadId = S.threadId; }
  if (full && full.messageId) turn.messageId = String(full.messageId);

  renderBlank(turn, full);
  renderModeNote(turn);
  renderRefusals(turn, full);
  renderRelated(turn, full);
  renderActions(turn, full);

  S.live = null;
  setBusy(false);
}

/**
 * AN EMPTY ANSWER IS A RESULT, AND IT HAS TO SAY SO WHERE THE ANSWER WOULD BE.
 *
 * Seen on a live run, 2026-08-31: eight documents read, zero quotable spans, so
 * the model was given an empty citable universe and correctly wrote nothing.
 * The screen showed a source strip, an empty gap, and a refusals card — and the
 * run's own explanation ("The documents carried nothing quotable for this
 * question") was inside the status line, which collapses at `done`. A reader
 * saw eight sources and silence.
 *
 * So the reason is lifted to where the prose would have been. `note` from the
 * `epilogue` frame is preferred, because it is the same string that got
 * persisted as the message body and the two cannot disagree; the run's last
 * status detail is the fallback, and a plain line the floor.
 */
function renderBlank(turn, done) {
  const box = turn.els.blank;
  box.replaceChildren();
  const wrote = turn.order.some((n) => {
    const s = turn.sentences.get(n);
    return s && stripMarkers(s.raw) !== '';
  });
  if (wrote || turn.errored) { box.classList.add('hidden'); return; }

  /* Stopped is not empty, and it is not an error. The run was going somewhere;
     the reader decided it was not worth the remaining minutes. What that leaves
     behind is real — the plan and what each step proved are still on screen —
     and the one thing that must not be implied is that the run failed. */
  if (turn.stopped) {
    box.append(
      el('b', null, 'You stopped this run'),
      document.createTextNode(
        'Stopped' + (turn.stoppedAt ? ' at ' + turn.stoppedAt : '') + ', before an answer was ' +
        'written. Everything that had arrived is above — the plan, the steps and what each one ' +
        'proved. Nothing more will be shown here. There is no cancel channel to the server yet, ' +
        'so the run may keep going there until it notices nobody is listening.'),
    );
    box.classList.remove('hidden');
    return;
  }

  const note = (done && typeof done.note === 'string' && done.note.trim() !== '')
    ? done.note.trim()
    : (turn.phaseDetail || '');
  box.append(
    el('b', null, 'No answer written'),
    document.createTextNode(note !== ''
      ? note
      : 'The documents this run read carried nothing quotable for that question. ' +
        'Nothing is being withheld — there was no sourced sentence to write.'),
  );
  box.classList.remove('hidden');
}

/**
 * A MODE THAT IS SILENTLY IGNORED IS WORSE THAN ONE THAT IS REFUSED.
 *
 * `mode=grounded` is a query parameter, and a route that does not know it
 * drops it and answers off the web anyway. The reader gets a normal-looking
 * answer under a pill that says Grounded, which is the interface lying about
 * where its evidence came from.
 *
 * There is no capability endpoint to ask, and probing costs a paid run, so
 * this is decided from the answer itself: a grounded run whose every source
 * came back `web` did not run grounded. Said plainly, above the answer.
 */
function renderModeNote(turn) {
  const box = turn.els.modenote;
  box.replaceChildren();

  /* THE SAME TRAP, ONE MODE ALONG — and it would be worse here.
   *
   * A grounded answer that came back off the web at least looked odd. A fast
   * answer under the Deep pill looks like a deep run that happened to be quick,
   * which is the most flattering possible way to be wrong.
   *
   * The route refuses an unwired `deep` today rather than downgrading it, so
   * this should not fire — but it is checked anyway, and cheaply, because the
   * tell is STRUCTURAL and needs no reading of the prose: a deep run publishes
   * a plan before it searches anything. An answer with no plan behind it was
   * not researched in stages, whatever the pill said and whatever the route
   * intended. */
  if (turn.mode === 'deep') {
    if (turn.errored || turn.stopped || turn.planOrder.length > 0) {
      box.classList.add('hidden');
      return;
    }
    box.append(
      el('b', null, 'Asked in deep mode — answered in one pass'),
      document.createTextNode(
        'No plan, no steps and no reflection arrived, so this question was never broken into ' +
        'sub-questions and nothing was researched in stages. Whatever this server did, it was ' +
        'not a deep run. Read what is below as an ordinary answer.'),
    );
    box.classList.remove('hidden');
    return;
  }

  const internalish = turn.sources.some((r) => r.kind !== 'web');
  if (turn.mode !== 'grounded' || turn.errored || turn.sources.length === 0 || internalish) {
    box.classList.add('hidden');
    return;
  }
  box.append(
    el('b', null, 'Asked in grounded mode — answered from the web'),
    document.createTextNode(
      'Every source that came back is an open-web page, with no competitor observation, ' +
      'no document of ours and no ledger row among them. This server has not wired grounded ' +
      'mode up yet, so read the answer as a Web answer. Nothing below is from our own evidence.'),
  );
  box.classList.remove('hidden');
}

/**
 * §7.1 — Perplexity shows you an answer; we show what we refused.
 *
 * Two of the three lists here are derived from the wire contract itself: a
 * `sentence` verdict of `flagged` IS a refusal to vouch, and it is guaranteed
 * to arrive. `dropped` / `unanswered` are read off `done` if the pipeline
 * chooses to carry them — read defensively, never required, never invented.
 *
 * When nothing was refused the section still renders, saying so in words. A
 * gate whose refusals are invisible teaches nobody anything, and an empty
 * section that disappears is indistinguishable from a gate that never ran.
 */
function renderRefusals(turn, done) {
  const box = turn.els.refusals;
  box.replaceChildren();

  // A run that was refused at the door (budget, the concurrency guard, an
  // unreachable server) has no refusals of its own to report — the error box
  // above IS the whole story, and three "nothing to report" lines under it read
  // as a gate that ran. It did not run.
  // A run stopped by the reader is the same case: the gate did not run, and
  // three "nothing to report" lines under a stop notice read as one that did.
  if ((turn.errored || turn.stopped) && turn.order.length === 0) {
    box.classList.add('hidden');
    return;
  }

  const flagged = turn.order
    .map((n) => turn.sentences.get(n))
    .filter((s) => s && s.verdict === 'flagged');
  const has = (k) => done != null && done[k] !== undefined && done[k] !== null;
  const dropped = Array.isArray(done && done.dropped) ? done.dropped : [];
  const unanswered = Array.isArray(done && done.unanswered) ? done.unanswered : [];
  // An empty citable universe produces no prose at all, and every "none" line
  // below reads as a clean bill of health unless it knows that. "Every sentence
  // matched the spans it cites" is a lie about zero sentences.
  const wroteNothing = turn.order.every((n) => {
    const s = turn.sentences.get(n);
    return !s || stripMarkers(s.raw) === '';
  });

  box.appendChild(el('h3', null, 'What this answer does not carry'));
  box.appendChild(el('p', 'why-here',
    'Kept on screen on purpose. A short answer you can act on beats a fluent one you cannot check.'));

  /* 0 · the run's own words. `note` co-occurs with an empty answer, so when it
     is here there is nothing above this card and this line is the reader's only
     explanation. It goes first, before any list. */
  const note = (done && typeof done.note === 'string') ? done.note.trim() : '';
  // When there is no prose the note is already standing where the answer would
  // be (renderBlank). Printing it twice on one screen makes one explanation
  // look like two findings.
  if (note !== '' && !wroteNothing) {
    const g0 = el('div', 'rgroup');
    g0.appendChild(el('span', 'eyebrow', 'What the run said about itself'));
    g0.appendChild(el('div', 'note', note));
    box.appendChild(g0);
  }

  /* 1 · sentences whose citations did not vouch for them */
  const g1 = el('div', 'rgroup');
  g1.appendChild(el('span', 'eyebrow', 'Could not be confirmed'));
  // `wroteNothing` is tested BEFORE `replayed`: a stored turn with no prose has
  // no sentences whose verdicts could have been kept, and "verdicts are not
  // stored" implies there were some.
  if (wroteNothing) {
    g1.appendChild(el('div', 'none',
      'Nothing was written, so nothing was checked. This is not a clean run — it is an empty one.'));
  } else if (turn.replayed) {
    g1.appendChild(el('div', 'none',
      'Per-sentence verdicts are not stored with an answer. Ask it again to re-run the checks.'));
  } else if (!flagged.length) {
    g1.appendChild(el('div', 'none', 'None — every sentence matched the spans it cites.'));
  } else {
    for (const s of flagged) {
      const d = el('div', 'drop');
      d.appendChild(el('span', 'qt', stripMarkers(s.raw)));
      d.appendChild(el('em', null, s.why ||
        'Could not be confirmed from what it cites — the quote is real, the claim goes further.'));
      g1.appendChild(d);
    }
  }
  box.appendChild(g1);

  /* 2 · points the verbatim gate refused outright */
  const g2 = el('div', 'rgroup');
  g2.appendChild(el('span', 'eyebrow', 'Dropped'));
  if (!dropped.length) {
    // THREE different empties, and collapsing them is the failure this card
    // exists to avoid. A fast run has no claim-level drop stage AT ALL — spans
    // are proven verbatim before a word is written, so no claim is ever written
    // and then withdrawn. Printing "nothing was dropped" about a stage that
    // does not exist reads as a gate that ran clean. It did not run.
    g2.appendChild(el('div', 'none',
      turn.mode !== 'verified'
        ? 'No drop stage on a ' + (MODES[turn.mode] ? MODES[turn.mode].label.toLowerCase() : 'web') +
          ' run — every span is proven verbatim before the prose is written, so a claim is never ' +
          'written and then withdrawn. The drop list belongs to Verified mode.'
        : has('dropped')
          ? 'Nothing was dropped on this run.'
          : 'Not reported by this run.'));
  } else {
    for (const d of dropped) {
      const row = el('div', 'drop');
      row.appendChild(el('b', null, String(d && d.claim || d)));
      if (d && d.why) row.appendChild(el('em', null, String(d.why)));
      g2.appendChild(row);
    }
  }
  box.appendChild(g2);

  /* 3 · the hole, named */
  const g3 = el('div', 'rgroup');
  g3.appendChild(el('span', 'eyebrow', 'Not answerable from these sources'));
  if (!unanswered.length) {
    // Three empties again, and the middle one is subtle: `epilogue` is sent
    // ONLY when it has something, so a completed run with no frame is a run
    // that named no gap — which is weaker than a gap check that ran and
    // passed, and is written as the weaker thing.
    g3.appendChild(el('div', 'none',
      has('unanswered')
        ? (wroteNothing
            ? 'The run listed no gap — but it also wrote no answer, so read the reason above rather than this line.'
            // AN EMPTY GAP LIST IS NOT A CLAIM OF COVERAGE.
            //
            // This read "The retrieved pages covered the question as asked."
            // Live, 2026-08-31, a deep run on "which is the most trendy job in
            // Toronto?" printed that under an answer whose own step-5
            // reflection said "no final synthesis of which job is most trendy
            // yet", and in which FOUR OF FIVE STEPS PROVED NOTHING. The panel
            // whose entire job is to say what the answer does not carry was
            // reassuring the reader instead.
            //
            // The run reports gaps it NOTICED. Silence is the absence of a
            // report, never evidence the question was covered — the same
            // distinction this file already draws two lines below for a missing
            // frame, and got wrong here for an empty one.
            : 'The run named no gap. That is silence, not a claim that the question was covered — judge that from the answer and the sources above.')
        : (done && done.messageId)
          ? 'This run named no gap. The gap list is only sent when there is one, so this is silence rather than a check that ran and passed.'
          : 'Not reported by this run.'));
  } else {
    for (const u of unanswered) g3.appendChild(el('div', 'drop', String(u)));
  }
  box.appendChild(g3);

  /* 4 · what a confirmed badge on OUR OWN evidence does not buy.
     Only when internal evidence was actually used, because a caveat printed
     under an answer it does not apply to is noise, and noise is how the real
     ones stop being read. */
  const usedBrain = turn.sources.some((r) => r.kind === 'brain');
  const usedLedger = turn.sources.some((r) => r.kind === 'ledger');
  const usedWorld = turn.sources.some((r) => r.kind === 'world');
  if (usedBrain || usedLedger || usedWorld) {
    const g4 = el('div', 'rgroup');
    g4.appendChild(el('span', 'eyebrow', 'What our own evidence does not prove'));
    if (usedBrain) {
      g4.appendChild(el('div', 'none',
        'A confirmed citation to one of our documents means the quote is really in it — not that ' +
        'the document is right. It was checked when it was written, not by this run, and nothing ' +
        'outside Taskly was consulted for those lines.'));
    }
    if (usedWorld) {
      g4.appendChild(el('div', 'none',
        'A competitor fact is our reading of their page on a date. Their page may have changed ' +
        'since; the date on each card is how far back the claim reaches.'));
    }
    if (usedLedger) {
      g4.appendChild(el('div', 'none',
        'A forecast is not an outcome. Anything cited from the ledger is what we expected at some ' +
        'probability — it has not been measured, and it may not happen.'));
    }
    box.appendChild(g4);
  }

  box.classList.remove('hidden');
}

/**
 * Related questions, as chips that CONTINUE the thread rather than start one.
 *
 * `submit()` carries `S.threadId`, so a chip is a follow-up — which is the only
 * reading that makes sense: the questions were generated from this answer's own
 * spans, and answering them in a fresh thread would throw away the sources they
 * came from and re-buy them.
 *
 * They are suggestions, not findings, and the footnote says so. A rail of
 * confident-looking questions beside a cited answer borrows the answer's
 * credibility; these are model-written and nothing checked them.
 */
function renderRelated(turn, done) {
  const rel = Array.isArray(done && done.related) ? done.related : [];
  const box = turn.els.related;
  box.replaceChildren();
  if (!rel.length) { box.classList.add('hidden'); return; }
  box.appendChild(el('span', 'eyebrow', 'Ask next'));
  const chips = el('div', 'chips');
  for (const r of rel) {
    const b = el('button', 'rq');
    b.appendChild(el('span', 'plus', '+'));
    b.appendChild(document.createTextNode(String(r)));
    b.addEventListener('click', () => submit(String(r)));
    chips.appendChild(b);
  }
  box.appendChild(chips);
  box.appendChild(el('div', 'foot',
    'Suggestions, not findings — written from this answer\u2019s spans and not checked against anything. Each one continues this thread.'));
  box.classList.remove('hidden');
}

function renderActions(turn, done) {
  const box = turn.els.actions;
  box.replaceChildren();

  const copy = el('button', null, 'Copy answer');
  copy.addEventListener('click', () => copyText(plainAnswer(turn, false), 'Answer copied'));
  const copyCited = el('button', null, 'Copy with sources');
  copyCited.addEventListener('click', () => copyText(plainAnswer(turn, true), 'Copied with sources'));
  const again = el('button', null, 'Ask again');
  again.addEventListener('click', () => submit(turn.question));
  // §7.2 — thread bloat with no fork is their top complaint. Fork is first-class.
  const fork = el('button', null, 'Fork from here');
  fork.title = 'Copy this thread up to and including this answer into a new one, and continue there.';
  fork.addEventListener('click', () => { void forkTurn(turn, fork); });

  box.append(copy, copyCited, again);
  // A turn that never reached the store has nothing to fork FROM. Offering the
  // button and then explaining it does not work is worse than not offering it.
  if (!S.demo && (turn.threadId || S.threadId)) box.appendChild(fork);

  const bits = [];
  if (done && Number.isFinite(Number(done.costCents))) {
    bits.push((Number(done.costCents)).toFixed(2) + '¢');
  }
  if (done && Number(done.flagged) > 0) bits.push(Number(done.flagged) + ' flagged');
  bits.push(turn.sources.length + ' sources');
  // On a deep run the count that decides whether the minutes bought anything is
  // proven spans, not sources — a run can read thirty pages and prove nothing.
  if (turn.deepStartedAt) {
    bits.push(turn.foundTotal + ' proved');
    if (turn.doneAt) bits.push(fmtElapsed(turn.doneAt - turn.deepStartedAt));
  }
  box.appendChild(el('span', 'cost', bits.join(' · ')));
  box.classList.remove('hidden');
}

/**
 * FORK — §7.2, the gap Perplexity is most complained about.
 *
 * The server takes `{seq}`: everything up to and including that message is
 * copied into a new thread, and the rest is left behind. `done` hands us a
 * `messageId`, not a seq — deliberately, since seq is the store's ordering and
 * not the wire's — so the seq is resolved from the transcript at fork time.
 * That is one GET, on a click, and it is exact; counting turns in the browser
 * would guess, and a fork that cuts one message off is a fork nobody trusts.
 *
 * If the route is not there yet, this degrades to what it did before: a new
 * thread with the same question, and a toast that says the fork was not
 * available rather than pretending the new thread is a fork of the old one.
 */
async function seqFor(threadId, messageId) {
  if (!threadId || !messageId) return null;
  try {
    const res = await fetch('/api/threads/' + encodeURIComponent(threadId));
    if (!res.ok) return null;
    const detail = await res.json();
    const m = (detail && Array.isArray(detail.messages) ? detail.messages : [])
      .find((x) => x && x.id === messageId);
    const n = m ? Number(m.seq) : NaN;
    return Number.isFinite(n) ? n : null;
  } catch { return null; }
}

async function forkTurn(turn, btn) {
  const threadId = turn.threadId || S.threadId;
  if (S.demo) { toast('Fork needs the real thread store — leave the demo to try it'); return; }
  if (!threadId) { toast('Nothing to fork yet — this turn was never saved'); return; }

  btn.disabled = true;
  const fallback = (why) => {
    // Honest degradation: the same question in a NEW thread, and a line saying
    // that is what happened. Silently re-asking and calling it a fork would put
    // a thread in the sidebar that claims a parent it does not have.
    toast(why + ' — asking it again as a new thread instead');
    const q = turn.question;
    resetToEmpty();
    submit(q);
  };

  try {
    let seq = Number.isInteger(Number(turn.seq)) ? Number(turn.seq) : null;
    if (seq === null) seq = await seqFor(threadId, turn.messageId);
    if (seq === null || seq < 1) { fallback('Could not find this answer in the saved thread'); return; }
    turn.seq = seq;

    const res = await fetch('/api/threads/' + encodeURIComponent(threadId) + '/fork', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ seq }),
    });
    // 404 is the route not being there; 405 is it not taking POST. Both are
    // "not built yet", and neither is worth a scary message.
    if (res.status === 404 || res.status === 405) { fallback('Fork is not available on this server'); return; }
    if (!res.ok) { fallback('The fork was refused (HTTP ' + res.status + ')'); return; }

    const body = await res.json();
    const id = String((body && body.id) || '');
    if (!id) { fallback('The fork came back without a thread id'); return; }

    await loadThreads();
    await openThreadById(id);
    toast('Forked at this answer — the thread you came from is untouched');
  } catch {
    fallback('Could not reach the fork endpoint');
  } finally {
    btn.disabled = false;
  }
}

function plainAnswer(turn, withSources) {
  const prose = turn.order.map((n) => turn.sentences.get(n).raw).join(' ').replace(/\s+/g, ' ').trim();
  if (!withSources) return stripMarkers(prose);
  const lines = [turn.question, '', prose, ''];
  // A deep answer pasted without its plan loses the part that makes it
  // checkable: which questions were asked, and which of them proved nothing.
  if (turn.planOrder.length) {
    lines.push('Plan:');
    for (const n of turn.planOrder) {
      const s = turn.plan.get(n);
      const state = s.dropped ? 'dropped'
        : s.state === 'done' ? (s.found === null ? 'done, found not reported'
            : s.found === 0 ? 'done, nothing proved' : 'done, +' + s.found + ' spans proved')
        : s.state;
      lines.push('  ' + n + '. ' + s.question + '  [' + state + ']');
    }
    lines.push('');
  }
  for (const s of turn.sources) lines.push('[' + s.i + '] ' + s.title + ' — ' + (s.url || s.domain));
  const flagged = turn.order.map((n) => turn.sentences.get(n)).filter((s) => s.verdict === 'flagged');
