<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMOS — Ask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  THE ANSWER ENGINE SHELL.

  One file, no bundler, no framework. Not asceticism — arithmetic. React here
  would mean a build step, new devDeps in a LOCKED pnpm-lock.yaml, a knip entry,
  and a jsdom test env this repo does not have, to render a page that is one
  list, one paragraph, and a text box.

  ── WHY THIS IS NOT ui.html WITH A NEW TAB ─────────────────────────────────

  ui.html renders by rebuilding innerHTML from a snapshot. That is fine for a
  dashboard that changes once a minute and impossible for prose that changes
  forty times a second: rebuilding the answer on every token throws away the
  selection, the scroll anchor, the hover target and any animation in flight,
  and it is quadratic in answer length.

  So this file has a state object and functions that touch only the nodes that
  changed. The hot path — `feedDelta` — ends at `Text.appendData()`. Nothing
  above the live sentence is read, re-created or re-laid-out while text streams.

  ── WHAT IS UNTRUSTED ──────────────────────────────────────────────────────

  Everything the server sends. Page titles come from other people's HTML, and
  prose comes from a language model that has read other people's HTML. Dynamic
  values are written with `textContent` or through `esc()`; a URL is opened only
  after `safeUrl()` has agreed it is http(s).

  ── ?demo=1 ────────────────────────────────────────────────────────────────

  Replays a scripted run of the real events with real timing, no server, no
  spend. It exists because the staging IS the product and the staging cannot be
  reviewed from a screenshot of a finished answer — and because a UI you can
  only exercise by paying for a 60-second pipeline run is a UI nobody exercises.
-->
<script>
/* ══ THEME, RESOLVED BEFORE THE FIRST PAINT ════════════════════════════════

   This runs in <head>, ahead of the stylesheet, for one reason: a theme
   applied from the bottom of <body> paints the light page first and then
   repaints it dark, and that flash is the single most visible way a theme
   control can look broken.

   Three states, not two. `system` is the default and is not the same thing as
   whichever colour the system happens to be right now — it is a standing
   instruction to follow the OS, so it keeps listening. `light` and `dark` are
   the reader overruling that.

   What is stamped on <html>:
     data-theme       the RESOLVED theme — only ever `light` or `dark`.
                      The stylesheet reads this and nothing else, so there is
                      exactly one dark block in the CSS instead of one per
                      selector-and-media-query pair that has to be kept in sync.
     data-theme-pref  what the reader actually chose, so the control can show
                      System as pressed while the page renders dark.

   EVERY storage access is wrapped. `localStorage` does not merely come back
   empty in a private window or with site data blocked — the getter itself
   THROWS, and an unhandled throw here, before the stylesheet, is a blank page.
   So a failed read is not an error condition: it means `system`, which is the
   default anyway. */
(function () {
  var KEY = 'tmos:theme';
  var root = document.documentElement;
  var mq = null;
  try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { mq = null; }

  var read = function () {
    try {
      var v = localStorage.getItem(KEY);
      return (v === 'light' || v === 'dark' || v === 'system') ? v : 'system';
    } catch (e) { return 'system'; }
  };

  var T = {
    pref: read(),
    resolve: function (p) { return p === 'system' ? ((mq && mq.matches) ? 'dark' : 'light') : p; },
    /** Stamp, then persist. Persisting is best-effort — a reader in a private
     *  window still gets the theme they clicked, for this session. */
    set: function (p, persist) {
      T.pref = (p === 'light' || p === 'dark') ? p : 'system';
      root.setAttribute('data-theme', T.resolve(T.pref));
      root.setAttribute('data-theme-pref', T.pref);
      if (persist) { try { localStorage.setItem(KEY, T.pref); } catch (e) { /* private window */ } }
    },
  };

  T.set(T.pref, false);
  // Only meaningful while the choice is `system`: the OS flipping at sunset
  // should carry the page with it, without a reload.
  if (mq && mq.addEventListener) {
    mq.addEventListener('change', function () { if (T.pref === 'system') T.set('system', false); });
  }
  window.TMOS_THEME = T;
})();
</script>
<style>
  /* ── tokens ───────────────────────────────────────────────────────────
     TASKLY'S PALETTE, READ OFF THE CODE THAT DEFINES IT — `app/globals.css`
     in the Taskly repo (`@theme` for light, `.dark` for dark), not off a
     design doc. What was here before was carried from `ui.html`, which
     predates the 2026-07-21 gold retune: its `#b8860b` is CSS's own
     `darkgoldenrod`, not Taskly's honey gold, and its dark mode was a cool
     blue-grey (`#0e1114` / `#161a1e`) that belongs to no Taskly surface.

     Values live in ONE place. `:root` is the complete light palette; the
     single `[data-theme="dark"]` block below redefines the same names. There
     is no `prefers-color-scheme` block: the head script resolves the media
     query itself and stamps `data-theme`, so a token can never be defined in
     a media query and nowhere else — the classic way a theme half-applies.

     THE RAMPS, and why each has three rungs rather than a colour per element:
       ground / ground-soft / surface   elevation. In dark this is the ONLY
                                        elevation cue there is — see below.
       ink / muted / faint              text. `faint` is the floor and it is a
                                        real text colour: #5E5E5E is the
                                        lightest the design system allows on
                                        light, and every rung clears 7:1.
       brass / brass-ink / brass-solid  the accent, split by JOB. `brass` is
                                        for marks and borders, `brass-ink` is
                                        gold AS TEXT (deepened on light,
                                        lightened on dark, because 9.5px of
                                        #B8873A on cream is not readable), and
                                        `brass-solid` is the filled pill. */
  :root{
    color-scheme:light;

    /* Surfaces — the documented hierarchy: canvas → adjacent → elevated card. */
    --ground:#FAFAFA;        /* cream — page canvas */
    --ground-soft:#F3F3F3;   /* cream-dark — an inset, one step BELOW the card */
    --surface:#FFFFFF;       /* the elevated card */

    --line:rgba(13,13,13,.11);
    /* Hover borders and dashed outlines used to reach for --faint, which is a
       TEXT token; a 1px dash at text contrast reads as a scribble. */
    --line-strong:rgba(13,13,13,.24);

    --ink:#0D0D0D;           /* rich black — headings, prose */
    --muted:#3A3A3A;         /* secondary sentences */
    --faint:#5E5E5E;         /* mono metadata, eyebrows, fine print — the floor */

    --brass:#B8873A;         /* honey gold — marks, rules, the caret */
    --brass-ink:#8A6414;     /* gold AS TEXT on light — deepened to hold contrast */
    --brass-solid:#C9A878;   /* the champagne fill of a chosen thing */
    --on-brass:#161311;      /* text on that fill — never white: #fff on gold is 2.9:1 */
    --brass-tint:rgba(184,135,58,.10);
    --brass-line:rgba(184,135,58,.30);

    --hold:#2C6E63;          /* confirmed */
    --moved:#A6421C;         /* unconfirmed. Kept clear of the gold hue on purpose:
                                brass already means "confirmed", and two warm
                                browns a few degrees apart at 9.5px is one channel
                                carrying two meanings. */

    /* Hover is a WASH, never a fill — the founder rule. Rich black is reserved
       for the pressed state and for the selected thread, which is what --press
       is: the same ink, further up. */
    --wash:rgba(13,13,13,.05);
    --press:rgba(13,13,13,.12);

    /* The fill that says "ours". A wash alone survives light and vanishes in
       dark — seen on the first dark-mode render of the grounded strip, where
       the Brain cards were all but invisible beside their neighbours. It is a
       FILL, not an accent: the brass stays reserved for citations. What it has
       to preserve in both themes is BORDERLESS AND FILLED, which is the form
       that means "inside the page, not on it". */
    --ours-fill:#F1F1F1;

    --shadow:0 1px 2px rgba(13,13,13,.04), 0 8px 24px rgba(13,13,13,.07);

    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius:16px;
  }

  /* ── dark: designed, not inverted ─────────────────────────────────────────
     Four things do not survive a swap of the light values, and each one is a
     line below rather than a rule of thumb:

     1. ELEVATION STOPS BEING A SHADOW. On #000 a black shadow is invisible,
        so a card cannot sit "above" the page by casting one. It sits above by
        being LIGHTER: #000 canvas → #1C1C1C card, with a hairline of light
        along the top edge doing the job the shadow used to do.

     2. BORDERS LIGHTEN. A darker line on a dark ground is a line that is not
        there; every border becomes white at low alpha.

     3. THE GOLD CHANGES LUMINANCE. #B8873A on black is a muddy 4.6:1 and reads
        brown; the accent is champagne #CDAC7C here, which is exactly what the
        design system ships. Gold-as-text lightens further still.

     4. INSET INVERTS. `--ground-soft` is BELOW the card on light and stays
        below on dark — #161616 under a #1C1C1C card — but `--ours-fill` goes
        the other way, UP to #232323, because the thing it must never be is
        indistinguishable from the canvas. Borderless-and-filled is the part
        that carries the meaning; which side of the surface it sits on is not. */
  :root[data-theme="dark"]{
    color-scheme:dark;

    --ground:#000000;        /* pure black — the canvas Taskly's dark shells use */
    --ground-soft:#161616;
    --surface:#1C1C1C;       /* the elevated card */

    --line:rgba(250,250,250,.16);
    --line-strong:rgba(250,250,250,.34);

    --ink:#FAFAFA;
    --muted:#C8CBD0;
    --faint:#9AA0A6;         /* still 7.4:1 on the card, 8.6:1 on the canvas */

    --brass:#CDAC7C;         /* champagne */
    --brass-ink:#E0C79A;     /* gold as text on dark */
    --brass-solid:#CDAC7C;   /* near-identical to light's fill, on purpose:
                                a chosen pill reads as the SAME highlight in
                                both themes */
    --on-brass:#161311;
    --brass-tint:rgba(205,172,124,.16);
    --brass-line:rgba(205,172,124,.35);

    --hold:#5FBBAD;
    --moved:#E9925B;

    --wash:rgba(250,250,250,.07);
    --press:rgba(250,250,250,.17);
    --ours-fill:#262626;   /* a real step up from the #1C1C1C card beside it */

    /* The top hairline is the elevation. The drop is only there to seat the
       card; on black it does almost nothing and is not asked to. */
    --shadow:inset 0 1px 0 rgba(250,250,250,.06), 0 12px 32px rgba(0,0,0,.66);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.014em}   /* 600 is the ceiling */
  /* 600 is the ceiling EVERYWHERE, and a bare <b> defaults to 700. The steps
     list builds one from a string, and the refusal rows build several. */
  b,strong{font-weight:600}
  a{color:inherit}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
           text-transform:uppercase;color:var(--faint)}
  .hidden{display:none!important}
  button{font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;
         border:1px solid var(--line);background:var(--surface);color:var(--ink);
         cursor:pointer;transition:background .14s ease,border-color .14s ease,transform .06s ease}
  button:hover:not(:disabled){background:var(--wash);border-color:var(--line-strong)}
  /* The one place the rich black is allowed to land: the press. */
  button:active:not(:disabled){background:var(--press);transform:translateY(1px)}
  button:disabled{opacity:.42;cursor:not-allowed}
  /* Champagne fill, rich-black label. White on gold is 2.9:1 — it was
     unreadable at 15px and the arrow was the most important control here. */
  button.primary{background:var(--brass-solid);border-color:var(--brass-solid);color:var(--on-brass)}
  button.primary:hover:not(:disabled){background:var(--brass-solid);filter:brightness(1.06)}
  button.primary:active:not(:disabled){background:var(--brass-solid);filter:brightness(.94)}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

  /* ── shell ────────────────────────────────────────────────────────────── */
  .app{display:flex;height:100vh;overflow:hidden}

  aside{width:246px;flex:none;background:var(--surface);border-right:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0}
  .side-head{padding:16px 16px 12px;display:flex;flex-direction:column;gap:2px}
  .side-head h1{font-size:14.5px}
  .side-new{margin:0 12px 10px;text-align:left;display:flex;align-items:center;gap:8px}
  .side-new .plus{font-family:var(--mono);color:var(--brass-ink)}
  .side-lab{padding:6px 18px 6px;display:flex;align-items:center;gap:8px}
  .threads{flex:1;overflow:auto;padding:2px 8px 14px;min-height:0}
  .thread{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;
          padding:8px 10px;color:var(--muted);font-size:13px;line-height:1.35;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread:hover{background:var(--wash);border-color:transparent}
  /* Selected nav is the other place the rich black is reserved for. A wash for
     both left "hovered" and "you are here" looking identical. */
  .thread[aria-current="true"]{background:var(--press);color:var(--ink)}
  .thread small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--faint);
                letter-spacing:.08em;margin-top:2px}
  .side-note{padding:4px 18px 16px;color:var(--faint);font-size:12px;line-height:1.5}
  .side-foot{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;
             flex-direction:column;align-items:flex-start;gap:9px}
  .side-links{display:flex;align-items:center;gap:5px 14px;flex-wrap:wrap}
  .side-foot a{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
               text-transform:uppercase;color:var(--faint);text-decoration:none}
  .side-foot a:hover{color:var(--brass-ink)}

  /* ── the theme control ────────────────────────────────────────────────────
     Three states, because two cannot express "follow the system" — and a tool
     someone leaves open all day is exactly where that matters, since the OS
     flips under it at sunset.

     One connected pill rather than three loose chips: it is a set of mutually
     exclusive states, which is the same control the mode pills above are, and
     two conventions for one idea in one sidebar is how a control stops being
     read. Deliberately the quietest thing in the window — mono, 9.5px, sitting
     under the utility links. This is a research tool, not a settings panel. */
  .theme{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;
         padding:2px;align-self:flex-start;max-width:100%}
  .theme button{border:0;background:none;padding:3px 9px;border-radius:999px;
                font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
                text-transform:uppercase;color:var(--faint);line-height:1.5}
  .theme button:hover{background:var(--wash);color:var(--ink)}
  .theme button:active{background:var(--press)}
  .theme button[aria-pressed="true"]{background:var(--brass-tint);color:var(--brass-ink)}


  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}

  /* ── empty state ──────────────────────────────────────────────────────── */
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
         padding:24px;overflow:auto}
  .empty-in{width:100%;max-width:640px;text-align:center}
  .empty h2{font-size:26px;letter-spacing:-.02em;margin-bottom:8px}
  .empty p.sub{color:var(--muted);margin:0 0 26px;font-size:14px}
  .prompts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
  .prompt{border:1px solid var(--line);background:var(--surface);border-radius:999px;
          padding:8px 14px;font-size:12.5px;color:var(--muted);text-align:left;
          max-width:100%;white-space:normal;line-height:1.4}
  .prompt:hover{background:var(--wash);color:var(--ink);border-color:var(--line-strong)}

  /* ── the box ──────────────────────────────────────────────────────────── */
  .box{display:flex;align-items:flex-end;gap:8px;background:var(--surface);
       border:1px solid var(--line);border-radius:var(--radius);padding:10px 10px 10px 16px;
       box-shadow:var(--shadow);transition:border-color .15s ease}
  .box:focus-within{border-color:var(--brass)}
  .box textarea{flex:1;font:inherit;font-size:15px;line-height:1.5;border:0;outline:0;
                background:none;color:var(--ink);resize:none;max-height:160px;min-height:26px;
                padding:3px 0}
  .box textarea::placeholder{color:var(--faint)}
  .box .go{width:34px;height:34px;padding:0;flex:none;display:grid;place-items:center;
           font-size:15px;line-height:1}
  .modes{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
  .modes button{border:0;padding:4px 10px;font-size:11.5px;color:var(--muted);background:none}
  .modes button[aria-pressed="true"]{background:var(--brass-tint);color:var(--brass-ink)}
  .modes button:hover{background:var(--wash)}

  /* ── thread view ──────────────────────────────────────────────────────── */
  .scroll{flex:1;overflow:auto;min-height:0}
  .col{max-width:760px;margin:0 auto;padding:30px 24px 40px}
  .composer{border-top:1px solid var(--line);background:var(--ground);padding:12px 24px 16px}
  .composer .col{padding:0}

  .turn{padding-bottom:30px;margin-bottom:6px}
  .turn + .turn{border-top:1px solid var(--line);padding-top:28px}
  .turn h2.q{font-size:23px;line-height:1.28;letter-spacing:-.02em;margin-bottom:14px;
             overflow-wrap:anywhere}

  /* ── status ───────────────────────────────────────────────────────────── */
  .status{margin:0 0 18px}
  .live{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;min-width:0}
  /* The real pipeline's `detail` is not a label — it is four search queries
     joined, or "33 result(s)". Rendering it AS the phase (which is what the
     first cut did) left the line reading "33 result(s)" with no verb in front
     of it. So the phase keeps its own words and the detail rides beside it,
     clipped, with the whole string on hover and in the steps list. */
  .live .detail{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
                color:var(--faint);white-space:nowrap;overflow:hidden;
                text-overflow:ellipsis;min-width:0;flex:1}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none;
       animation:pulse 1.15s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(.8)}}
  .live .phase{position:relative}
  .steps-toggle{padding:4px 11px;font-size:11.5px;color:var(--muted);
                font-family:var(--mono);letter-spacing:.06em}
  .steps{list-style:none;margin:10px 0 0;padding:0 0 0 9px;border-left:1px solid var(--line)}
  .steps li{font-size:12.5px;color:var(--muted);padding:3px 0 3px 12px;position:relative}
  .steps li::before{content:'';position:absolute;left:-13px;top:11px;width:7px;height:1px;
                    background:var(--line)}
  .steps li b{font-weight:500;color:var(--ink);font-family:var(--mono);font-size:10px;
              letter-spacing:.1em;text-transform:uppercase;margin-right:8px}

  /* ── deep research: the progress surface ──────────────────────────────────
     THE ONLY REASON THIS PANEL EXISTS IS THE ABANDON DECISION.

     A fast answer is over in thirty seconds, so a status line is enough — you
     could not usefully act on it anyway. A deep run is two to four minutes, and
     for most of it the honest question in the reader's head is "is this going
     anywhere, or am I paying for four minutes of the wrong search?" A spinner
     answers that with nothing. So everything here is aimed at making that call
     answerable at minute one:

       · the PLAN is on screen before the first search, so the run can be judged
         on its questions rather than on its elapsed time;
       · every step reports `found` — NEW PROVEN SPANS — and a step that read
         nine pages and proved nothing is styled as the warning it is, never as
         a tick. That single distinction is what a "9 sources" counter destroys;
       · the run's own reflection is printed, because a reader deciding whether
         to let it keep spending deserves the run's reasoning, not a summary of
         it written afterwards;
       · Stop is a first-class control sitting beside the plan, not buried.

     Unlike `.steps` this panel is OPEN by default and stays open. A collapsed
     progress surface during a four-minute wait is a status line again. */
  .deep{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
        padding:14px 16px 12px;margin:0 0 20px}
  .deep-head{display:flex;align-items:baseline;gap:10px 14px;flex-wrap:wrap;margin-bottom:5px}
  .deep-meter{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
              color:var(--faint);margin-left:auto}
  .deep-why{color:var(--muted);font-size:12.5px;line-height:1.5;margin:0 0 11px;max-width:64ch}
  .deep-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 12px}
  .deep-bar button{font-size:11.5px;padding:4px 12px}
  /* The one place in this panel the alarm colour is used, and it is used for
     exactly one fact: steps have finished and nothing has been proved. */
  .deep-warn{border:1px dashed var(--moved);border-radius:11px;padding:9px 12px;margin:0 0 12px;
             color:var(--moved);font-size:12.5px;line-height:1.55;max-width:64ch}

  .plan{list-style:none;margin:0;padding:0}
  .plan > li + li.pstep{border-top:1px solid var(--line)}
  .pstep{padding:9px 0 9px 27px;position:relative}
  .pstep .mk{position:absolute;left:0;top:10px;width:18px;height:18px;border-radius:50%;
             border:1px solid var(--line-strong);display:grid;place-items:center;
             font-family:var(--mono);font-size:9px;line-height:1;color:var(--faint);
             background:var(--surface)}
  .pstep.running .mk{border-color:var(--brass);color:var(--brass-ink);background:var(--brass-tint);
                     animation:pulse 1.15s ease-in-out infinite}
  .pstep.done .mk{border-color:transparent;background:var(--brass-tint);color:var(--brass-ink)}
  /* A finished step that proved nothing. Hollow and dotted — the same form
     this file already uses for "not an observation" — because it must not read
     as one more completed thing. */
  .pstep.barren .mk{background:none;border-color:var(--moved);color:var(--moved);border-style:dotted}
  .pstep.skipped .mk{border-style:dashed}
  .pstep .qn{font-size:13.5px;line-height:1.45;color:var(--ink);overflow-wrap:anywhere}
  .pstep.pending .qn{color:var(--muted)}
  .pstep.skipped .qn{color:var(--faint)}
  .pstep .why{font-size:12px;line-height:1.45;color:var(--muted);margin-top:3px;max-width:62ch}
  /* A revised question never replaces its predecessor silently: the old text
     stays, struck, under the new one. */
  .pstep .was{font-size:12px;line-height:1.5;color:var(--faint);margin-top:5px;max-width:62ch}
  .pstep .was b{font-weight:500;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
                text-transform:uppercase;margin-right:8px;color:var(--faint)}
  .pstep .was s{text-decoration-color:var(--line-strong)}
  /* The OLD question's outcome, carried with the old question. A reworded slot
     must not inherit the result of the question it replaced. */
  .pstep .was em{font-style:normal;display:block;margin:2px 0 0 calc(3ch + 8px);
                 font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--faint)}
  .pstep .st{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);
             font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px;
             color:var(--faint)}
  .pstep .st .found{color:var(--brass-ink);background:var(--brass-tint);border-radius:5px;
                    padding:1px 6px}
  .pstep .st .nil{color:var(--moved);border:1px dotted var(--moved);border-radius:5px;padding:0 5px}
  .pstep .st .det{font-family:var(--mono);letter-spacing:.04em;text-transform:none;
                  color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;
                  white-space:nowrap;flex:1}
  .tag-new{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
           color:var(--brass-ink);background:var(--brass-tint);border-radius:5px;padding:1px 5px;
           margin-left:7px;vertical-align:1px}

  /* A plan revision is an EVENT in the run, so it is rendered in the place it
     happened rather than by quietly swapping the list. */
  .prev{padding:10px 0 11px 27px;position:relative}
  .prev .eyebrow{display:block;color:var(--moved);margin-bottom:4px}
  .prev p{margin:0;font-size:12.5px;line-height:1.55;color:var(--muted);max-width:62ch}

  /* The run's own reasoning, inset under the step it followed. */
  .refl{margin:0 0 2px 27px;padding:9px 12px 10px;background:var(--ground-soft);
        border-radius:10px;border-left:2px solid var(--line-strong)}
  .refl .eyebrow{display:block;margin-bottom:5px}
  .refl p + .eyebrow{margin-top:9px}
  .refl p{margin:0;font-size:12.5px;line-height:1.55;color:var(--ink);max-width:62ch}
  .refl ul{margin:5px 0 0;padding-left:17px}
  .refl li{font-size:12px;line-height:1.5;color:var(--muted)}
  .refl .stopline{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);
                  font-size:12.5px;line-height:1.5;color:var(--moved)}
  .refl .stopline b{font-weight:500;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
                    text-transform:uppercase;margin-right:6px}

  /* ── clarifying questions ─────────────────────────────────────────────────
     Brass-edged, because it is the one card on the page that is waiting on the
     reader rather than reporting to them. The whole design goal is that nobody
     mistakes it for a result: nothing has run, nothing has been spent. */
  .clarify{border:1px solid var(--brass-line);background:var(--surface);border-radius:var(--radius);
           padding:16px 18px 15px;margin:0 0 20px}
  .clarify .eyebrow{display:block;color:var(--brass-ink);margin-bottom:6px}
  .clarify h3{font-size:15.5px;margin-bottom:6px}
  .clarify .lead{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 12px;max-width:64ch}
  .clarify .spend{font-size:13px;line-height:1.55;color:var(--ink);margin:0 0 15px;max-width:64ch}
  .cq{margin:0 0 13px}
  .cq label{display:block;font-size:13.5px;line-height:1.45;color:var(--ink);margin-bottom:6px}
  .cq label .n{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:8px}
  .cq input{width:100%;font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;
            border:1px solid var(--line);background:var(--ground);color:var(--ink)}
  .cq input::placeholder{color:var(--faint)}
  .cq input:focus{outline:none;border-color:var(--brass)}
  .clarify .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:15px}
  .clarify .fine{color:var(--faint);font-size:11.5px;line-height:1.5;margin-top:10px;max-width:64ch}
  /* Answered: the card stays in the transcript as the record of what was asked
     and what was said, rather than vanishing once it has done its job. */
  .cans{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
  .cans div{padding:3px 0}
  .cans b{font-weight:500;color:var(--ink);display:block}
  .cans i{font-style:normal;color:var(--faint)}

  /* ── sources ──────────────────────────────────────────────────────────── */
  .sources{margin:0 0 22px}
  .srchead{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
  .srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
  .src{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);
       border-radius:11px;padding:10px 11px;min-width:0;
       opacity:0;transform:translateY(6px);
       transition:opacity .34s ease,transform .34s cubic-bezier(.16,1,.3,1),
                  background .14s ease,border-color .14s ease}
  .src.in{opacity:1;transform:none}
  .src:hover{background:var(--wash);border-color:var(--line-strong)}
  .src .top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .fav{width:14px;height:14px;border-radius:3px;flex:none;object-fit:cover}
  .fav-fb{width:14px;height:14px;border-radius:3px;flex:none;display:grid;place-items:center;
          background:var(--brass-tint);color:var(--brass-ink);font-family:var(--mono);
          font-size:8.5px;line-height:1;text-transform:uppercase}
  .src .dom{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .src .num{font-family:var(--mono);font-size:9.5px;color:var(--faint);flex:none}
  .src .ttl{font-size:12.5px;line-height:1.35;color:var(--ink);
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ── source KINDS ──────────────────────────────────────────────
     COLOUR IS ALREADY SPOKEN FOR. Brass / orange / muted mean confirmed /
     unconfirmed / stored, and hanging a second meaning on the same channel
     makes both unreadable. So VERDICT keeps colour and KIND gets FORM —
     reusing three conventions this file already established:

       raised card, solid border   an outside page. You can open it.
       inset wash, no border       ours. It sits INSIDE the page, not on it.
       dashed                      not an observation (same as .blank, .drop).

     Form alone is a language nobody was taught, so every one of them is
     backed by a spelled-out label on the card, a glyph in the marker, and a
     key above the prose. Three redundant channels, because the one thing this
     mode must never do is let a forecast read like a measurement. */
  .srcgroup + .srcgroup{margin-top:13px}
  .srcgroup.bare > .eyebrow, .srcgroup.bare > .ghint{display:none}
  .srcgroup > .eyebrow{display:block;margin-bottom:3px}
  /* The caveat belongs to the GROUP, not to each card. Printed on every card
     it became four copies of one sentence and pushed the answer off screen —
     which is how a caveat stops being read. */
  .ghint{display:block;font-size:11.5px;line-height:1.45;color:var(--muted);
         margin:0 0 8px;max-width:64ch}
  /* Neutral on purpose. The brass is spoken for by the verdict, and a gold
     edge here would put KIND on the colour channel too. */
  .src.k-world{border-left:2px solid var(--line-strong)}
  .src.k-brain{background:var(--ours-fill);border-color:transparent}
  .src.k-ledger{background:transparent;border-style:dashed;border-color:var(--line-strong)}
  /* No href, so no pointer, no hover-lift: the card must not promise a click
     it cannot honour. */
  .src.internal{cursor:default}
  .src.internal:hover{background:var(--ours-fill);border-color:var(--line)}
  .src.k-ledger:hover{border-color:var(--line-strong);background:var(--wash)}
  .kmark{width:14px;height:14px;border-radius:3px;flex:none;display:grid;place-items:center;
         background:var(--wash);color:var(--muted);font-family:var(--mono);font-size:9px;
         line-height:1;font-weight:500}
  .src.k-brain .kmark{background:var(--surface)}
  .src .loc{font-family:var(--mono);font-size:10px;line-height:1.45;color:var(--muted);
            overflow-wrap:anywhere;margin-top:5px}
  .src .when{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.09em;
             text-transform:uppercase;color:var(--faint);margin-top:5px}
  /* Says, in words, what the form is hinting. Never omitted. */
  .src .cant{display:block;font-size:11px;line-height:1.45;color:var(--muted);margin-top:5px}
  .src .copy{margin-top:7px;padding:2px 8px;font-family:var(--mono);font-size:9px;
             letter-spacing:.09em;text-transform:uppercase;border-radius:6px}

  /* the key. Only the rows for kinds actually on screen. */
  .legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 16px;padding:9px 12px;
          border:1px dashed var(--line-strong);border-radius:11px;background:var(--surface)}
  .legend span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .legend i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--brass-ink);
            background:var(--brass-tint);border-radius:5px;padding:2px 5px;line-height:1}
  /* currentColor, matching the badge itself: the dotted rule is the FORM, and
     it takes whatever colour the verdict has already put on the marker. */
  .legend i.u{background:none;border-bottom:1px dotted currentColor;border-radius:0;
              color:var(--muted);padding:1px 2px}

  /* ── prose + citations ────────────────────────────────────────────────── */
  .prose{font-size:16px;line-height:1.72;max-width:66ch;overflow-wrap:anywhere}
  .sent{transition:background .25s ease}
  .sent.flagged{text-decoration:underline dotted var(--moved);text-underline-offset:4px;
                text-decoration-thickness:1px}
  .cb{font-family:var(--mono);font-size:9.5px;line-height:1;vertical-align:super;
      display:inline-block;min-width:10px;text-align:center;padding:2px 1px;margin:0 1px 0 0;
      border-radius:5px;cursor:pointer;border:1px solid transparent;
      transition:background .18s ease,color .18s ease,border-color .18s ease;
      user-select:none}
  .cb.pending{color:var(--faint);border-color:var(--line-strong);border-style:dashed;
              animation:breathe 1.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
  .cb.confirmed{color:var(--brass-ink);background:var(--brass-tint);border-color:transparent}
  .cb.stored{color:var(--muted);background:var(--wash);border-color:transparent}
  .cb.flagged{color:var(--moved);background:transparent;border-color:var(--moved);
              border-style:dotted}
  .cb:hover{background:var(--press);border-color:var(--brass)}
  /* KIND on the marker itself. The glyph rides in front of the number and
     inherits the verdict colour, so the two channels never fight. */
  .cb .g{font-size:.86em;opacity:.72;margin-right:.5px}
  /* `world` has a real URL and opens like a web source, so it keeps the web
     shape — the dotted rule underneath is the whole difference: this is our
     reading of their page on a date, not the page. */
  .cb.k-world{border-bottom:1px dotted currentColor;border-radius:5px 5px 0 0}
  .cb.k-brain{background:var(--ours-fill)}
  .cb.k-brain.confirmed{background:var(--ours-fill)}
  .cb.k-ledger{background:none;border-style:dashed;border-color:currentColor}
  /* A sentence whose every citation is a forecast is the one sentence in this
     interface that could pass for something we measured. It is labelled in
     words, not decorated. */
  .fx{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.11em;
      text-transform:uppercase;color:var(--moved);border:1px solid var(--moved);
      border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:2px;
      white-space:nowrap}
  /* WHY THE WHOLE SENTENCE IS WASHED, not just tagged. Rendered on its own the
     tag sits a few pixels after the PREVIOUS sentence's full stop and reads as
     if it labelled that one — seen on the first live render of the grounded
     demo. The wash draws the boundary the prose does not have. */
  .sent.fcast{background:var(--wash);border-radius:7px;padding:1px 6px 2px;
              box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .cursor{display:inline-block;width:7px;height:1em;vertical-align:-2px;margin-left:1px;
          background:var(--brass);opacity:.6;animation:blink .9s steps(2,start) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ── tooltip ──────────────────────────────────────────────────────────── */
  .tip{position:fixed;z-index:60;width:min(340px,calc(100vw - 24px));background:var(--surface);
       border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
       padding:11px 13px;opacity:0;transform:translateY(4px);pointer-events:none;
       transition:opacity .13s ease,transform .13s ease}
  .tip.on{opacity:1;transform:none}
  .tip .top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .tip .dom{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint)}
  .tip .ttl{font-size:13px;line-height:1.35;margin-bottom:8px}
  /* --ground-soft, not --ground: on light the canvas and the card are a
     shade apart, and the quote has to read as INSET into the tip. On dark it
     is the one surface that goes DOWN from the card. */
  .tip blockquote{margin:0 0 8px;padding:8px 11px;background:var(--ground-soft);
                  border-left:2px solid var(--brass);border-radius:0 8px 8px 0;
                  font-size:12px;line-height:1.5;color:var(--muted)}
  .tip .loc{font-family:var(--mono);font-size:10px;line-height:1.45;color:var(--muted);
            overflow-wrap:anywhere;margin:-4px 0 8px}
  .tip .when{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.09em;
             text-transform:uppercase;color:var(--faint);margin:-4px 0 8px}
  .tip .verdict{font-size:11.5px;line-height:1.45;color:var(--muted);
                padding-top:7px;border-top:1px solid var(--line)}
  .tip .verdict b{font-weight:500;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
                  text-transform:uppercase;margin-right:6px}
  .tip .verdict.confirmed b{color:var(--hold)}
  .tip .verdict.flagged b{color:var(--moved)}
  .tip .verdict.pending b{color:var(--faint)}
  .tip .open{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
             color:var(--faint);margin-top:7px;display:block}

  /* ── refusals: the section §7 says never to delete ────────────────────── */
  .refusals{margin-top:26px;border:1px solid var(--line);border-radius:var(--radius);
            background:var(--surface);padding:15px 17px}
  .refusals h3{font-size:13px;margin-bottom:3px}
  .refusals .why-here{color:var(--muted);font-size:12.5px;margin:0 0 12px;max-width:62ch}
  .rgroup + .rgroup{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .rgroup .eyebrow{display:block;margin-bottom:7px}
  .drop{padding:8px 0;border-bottom:1px dashed var(--line);color:var(--muted);font-size:13px;
        line-height:1.5}
  .drop:last-child{border-bottom:0}
  .drop b{font-weight:500;color:var(--faint);text-decoration:line-through}
  .drop em{display:block;font-style:normal;font-size:12px;color:var(--moved);margin-top:3px}
  .drop .qt{display:block;font-size:12.5px;color:var(--ink);margin-bottom:3px}
  /* These are full sentences and they carry the honesty of the card, so they
     sit on the text ramp rather than the metadata one. */
  .none{color:var(--muted);font-size:12.5px;padding:4px 0}
  .rgroup .note{color:var(--ink);font-size:13px;line-height:1.55;padding:4px 0}

  /* ── related + actions ────────────────────────────────────────────────── */
  .related{margin-top:24px}
  .related .eyebrow{display:block;margin-bottom:9px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .rq{border:1px solid var(--line);background:var(--surface);border-radius:999px;
      padding:7px 14px;font-size:12.5px;color:var(--muted);text-align:left;
      max-width:100%;white-space:normal;line-height:1.4}
  .rq:hover{background:var(--wash);color:var(--ink);border-color:var(--line-strong)}
  .rq .plus{color:var(--brass-ink);font-family:var(--mono);margin-right:7px}
  .related .foot{color:var(--faint);font-size:11.5px;margin-top:9px}
  .actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:22px}
  .actions .cost{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
                 text-transform:uppercase;color:var(--faint)}
  /* An answer that is empty ON PURPOSE. Not an error — the run worked, read
     its documents and found nothing it could quote. Dashed, muted, and clearly
     not prose, so it is never mistaken for the answer. */
  .blank{border:1px dashed var(--line-strong);border-radius:12px;padding:12px 15px;
         color:var(--muted);font-size:13.5px;line-height:1.55;background:var(--surface)}
  .blank b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
           text-transform:uppercase;font-weight:500;color:var(--faint);margin-bottom:5px}
  .err{border:1px solid var(--moved);border-radius:12px;padding:11px 14px;color:var(--moved);
       font-size:13px;background:var(--surface);margin-top:12px}
  .err b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
         text-transform:uppercase;font-weight:500;margin-bottom:3px}

  .banner{background:var(--brass-tint);border-bottom:1px solid var(--brass-line);
          padding:7px 24px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
          text-transform:uppercase;color:var(--brass-ink);display:flex;gap:12px;align-items:center}
  .banner .spacer{flex:1}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);z-index:70;
         background:var(--ink);color:var(--ground);font-size:12.5px;padding:8px 15px;
         border-radius:999px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ── narrow ───────────────────────────────────────────────────────────── */
  .side-toggle{display:none}
  @media (max-width:880px){
    aside{position:fixed;inset:0 auto 0 0;z-index:50;transform:translateX(-100%);
          transition:transform .2s cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow)}
    body.side-open aside{transform:none}
    .side-toggle{display:inline-flex;align-items:center;gap:7px;position:fixed;top:12px;left:12px;
                 z-index:40;background:var(--surface);box-shadow:var(--shadow)}
    .col{padding:56px 18px 34px}
    .composer{padding:10px 18px 14px}
    .modes button{padding:4px 8px;font-size:11px}
    .turn h2.q{font-size:20px}
    .prose{font-size:15.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .src{opacity:1;transform:none}
  }
</style>
</head>
<body>

<div class="app">
  <aside id="side">
    <div class="side-head">
      <div class="eyebrow">Taskly marketing OS</div>
      <h1>Ask</h1>
    </div>
    <button class="side-new" id="newThread"><span class="plus">+</span> New thread</button>
    <div class="side-lab"><span class="eyebrow">Threads</span></div>
    <div class="threads" id="threads"></div>
    <div class="side-note hidden" id="threadNote"></div>
    <div class="side-foot">
      <!-- The interpuncts between these went when the theme pill arrived: at
           246px the row has always wrapped, and a separator stranded at the end
           of the first line reads as a missing link. Spacing separates them. -->
      <div class="side-links">
        <a href="/" title="The old dashboard">Classic console</a>
        <a href="?demo=1" title="Replay a scripted web run with no server">Demo</a>
        <a href="?demo=1&amp;mode=grounded" title="Replay a scripted grounded run — all four source kinds">Demo · grounded</a>
        <a href="?demo=1&amp;mode=deep" title="Replay a scripted deep run — a clarifying question, a plan, a step that proves nothing, and the revision that follows. Timings compressed about 5:1.">Demo · deep</a>
      </div>
      <!-- Built from THEME_OPTIONS in the script, the same way the mode pills
           are: one table, one control, no chance of the labels and the values
           drifting apart. -->
      <div class="theme" id="themePick" role="group" aria-label="Theme"></div>
    </div>
  </aside>

  <button class="side-toggle" id="sideToggle" aria-label="Threads">☰</button>

  <div class="main">
    <div class="banner hidden" id="banner"></div>

    <!-- empty state -->
    <section class="empty" id="empty">
      <div class="empty-in">
        <h2>Ask it anything.</h2>
        <p class="sub" id="emptySub">Every figure comes back with the exact sentence it came from,
          on a page we actually fetched. What could not be sourced is listed, not smoothed over.</p>
        <div class="box" id="box0">
          <textarea id="q0" rows="1" placeholder="Ask about a market, a competitor, or a call you have to make…"></textarea>
          <!-- Built from MODES in the script: two pill groups that can drift
               apart is how a toggle ends up meaning one thing at the top of a
               page and another at the bottom. -->
          <div class="modes" id="modes0" role="group" aria-label="Where to answer from"></div>
          <button class="primary go" id="go0" aria-label="Ask">→</button>
        </div>
        <div class="prompts" id="prompts"></div>
      </div>
    </section>

    <!-- thread view -->
    <div class="scroll hidden" id="scroll">
      <div class="col" id="turns"></div>
    </div>
    <div class="composer hidden" id="composer">
      <div class="col">
        <div class="box">
          <textarea id="q1" rows="1" placeholder="Ask a follow-up…"></textarea>
          <div class="modes" id="modes1" role="group" aria-label="Where to answer from"></div>
          <button class="primary go" id="go1" aria-label="Ask">→</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ══ helpers ═══════════════════════════════════════════════════════════════ */

const $ = (s, r) => (r || document).querySelector(s);

/** Model output and page titles are untrusted text. Same pattern as ui.html. */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** An href is a capability. Only http(s) gets one — never `javascript:`. */
const safeUrl = (u) => {
  try {
    const p = new URL(String(u), location.href);
    return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : null;
  } catch { return null; }
};

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = String(text);
  return n;
};

const domainOf = (u, fallback) => {
  try { return new URL(String(u)).hostname.replace(/^www\./, ''); }
  catch { return String(fallback || ''); }
};

/** Markers out, and the space they left in front of the punctuation with them. */
const stripMarkers = (t) => String(t)
  .replace(/\[[\d,;\s]+\]/g, '')
  .replace(/\s+([.,;:!?])/g, '$1')
  .replace(/\s+/g, ' ')
  .trim();

const PHASE_LABEL = {
  planning: 'Planning searches…',
  searching: 'Searching…',
  reading: 'Reading sources…',
  attributing: 'Finding quotable spans…',
  writing: 'Writing…',
  checking: 'Checking every figure…',
  done: 'Done',
};

/* Grounded reads nothing from the open web, so "Searching…" beside a status
   line is a small lie about where the answer is coming from. Only the phases
   that change are overridden.

   THESE ARE EARNED, NOT ASSUMED — and a live run is what showed the
   difference. `mode=grounded` went to a route that does not know the
   parameter, which dropped it and ran a normal web search; the status line
   sat on "Reading our own records…" for forty seconds while the server read
   Wikipedia and four pages about a lawn-care company also called Jiffy. The
   pill said Grounded, so the interface said Grounded, and neither had any
   evidence for it. So these labels appear only after a source has arrived
   that is not a web page. Until then the neutral wording stands. */
const PHASE_LABEL_GROUNDED = {
  planning: 'Planning what to look up…',
  searching: 'Searching our own records…',
  reading: 'Reading our own records…',
  attributing: 'Finding quotable passages…',
};

function phaseLabel(turn, phase) {
  const earned = turn && turn.mode === 'grounded' &&
                 turn.sources.some((r) => r.kind !== 'web');
  if (earned && PHASE_LABEL_GROUNDED[phase]) return PHASE_LABEL_GROUNDED[phase];
  return PHASE_LABEL[phase] || phase || 'Working…';
}

/* Read once, up here, because the mode table below needs it: `?deep=1` is the
   escape hatch that turns the Deep pill on, and `?demo=1` turns it on
   unconditionally because a scripted run reaches no server and spends nothing. */
const QS = new URLSearchParams(location.search);

/* ══ IS DEEP RESEARCH ACTUALLY REACHABLE? ══════════════════════════════════

   READ AGAINST `answer-route.ts` AT 2026-08-31, TWICE — AND THE ANSWER MOVED
   BETWEEN THE TWO READINGS, WHICH IS WHY THIS IS WRITTEN DOWN RATHER THAN
   ASSUMED.

   FIRST READING: the route had no idea what `deep` was. `parseMode` mapped it
   to `web`, so `?mode=deep` bought a FAST ANSWER UNDER A PILL SAYING DEEP —
   the precise failure the grounded pill was caught in once already (see
   renderModeNote), and worse here, because a fast answer wearing Deep's badge
   looks like a deep run that went quickly.

   SECOND READING, after the route landed: `parseMode` accepts `deep`,
   `runnerFor` has a `deep` branch, `server.ts` relays the four frames and
   reads the clarify replies — but `DEEP_ANSWER` was still a stub that
   REJECTED. The pill stayed off, and the reason had changed under it: not
   "you would be lied to" but "you would spend a request to be told no, and
   leave a thread holding a question with no answer", because the route records
   the thread and the user turn BEFORE the pipeline runs.

   THIRD READING, and the one this constant is set from: `DEEP_ANSWER` is now
   `streamDeep`, and it was DRIVEN rather than read. A real question was asked
   against the real route: it came back with a real `clarify` (it caught which
   Jiffy was meant, which is the failure §10 records web mode walking straight
   into), then a four-step plan, four `step` frames and five `reflect` frames,
   and finished in 1m 36s. So the pill is on.

   There is still no capability endpoint, and the one probe available costs a
   real request. So this is a constant, not a detection — and the run checks
   itself afterwards regardless: an answer that arrives with NO PLAN behind it
   is reported as not-a-deep-run whatever this constant says. See
   `renderModeNote`. That is the part that survives a server whose build lags
   its source.

   THREE WAYS IT IS ON:
     · `DEEP_WIRED`, here. Set it back to false the moment the runner behind it
       stops being real, and the tooltip switches itself.
     · `?deep=1`, an explicit opt-in for whoever is working on the route.
     · `?demo=1`, always — the scripted stream reaches no server at all. */
const DEEP_WIRED = true;
const DEEP_ENABLED = DEEP_WIRED || QS.get('deep') === '1' || QS.get('demo') === '1';

/** Kept, not deleted, because DEEP_WIRED goes back to false the day the runner
 *  behind it does. A tooltip that has to be rewritten to turn a control off is
 *  a tooltip that will not be. */
const DEEP_OFF_TITLE =
  'Not available on this server: the deep pipeline is not wired, so the runner behind this mode ' +
  'refuses rather than writing prose no plan stands behind. Asking anyway would spend a request ' +
  'to be told no and leave a thread with a question and no answer. Try ?demo=1 to see the whole ' +
  'surface — plan, steps, a revision and a clarifying question — with no server and no spend.';

/* ══ modes ═════════════════════════════════════════════════════════════════

   Web · Grounded · Verified · Deep. One table, both pill groups, so the toggle
   cannot mean one thing at the top of the page and another at the bottom.

   `param` is what rides in the query string, and all three are real: read
   against `answer-route.ts` at 2026-08-31, `parseMode` accepts
   `web | grounded | verified` and treats anything else as `web`, and
   `server.ts` passes it through. So the pill sends its own name rather than
   relying on a default.

   VERIFIED IS ON, because it now runs: `VERIFIED_ANSWER = verifiedRunner(research)`
   is wired into the route's deps, which is the strict whole-answer gate §2
   promised and the console could not reach until today. It stays a second
   click rather than the default — it is slower, and it is the right tool when
   the answer feeds a pricing or positioning call.

   GROUNDED IS HALF-WIRED, and the toggle says so rather than hiding it.
   Retrieval is real — the route emits genuine world / brain / ledger source
   events — but `GROUNDED_ANSWER` is still a seam that REFUSES rather than
   writing prose it cannot cite. So a grounded run today shows its evidence and
   then stops with that refusal, which is a true picture of where the feature
   is. Offering it is more honest than hiding it: the evidence half is exactly
   what a reader needs to judge whether the mode is worth finishing.

   Either way the answer is checked on the way back — `renderModeNote` looks at
   what actually arrived, because a mode that is silently ignored is worse than
   one that is refused. */
const MODES = {
  web: {
    label: 'Web',
    param: 'web',
    enabled: true,
    title: 'Answers from pages fetched off the open web this run. Streams as it writes; each sentence is checked a beat behind.',
    sub: 'Every figure comes back with the exact sentence it came from, on a page we actually fetched. ' +
         'What could not be sourced is listed, not smoothed over.',
    placeholder: 'Ask about a market, a competitor, or a call you have to make…',
  },
  grounded: {
    label: 'Grounded',
    param: 'grounded',
    enabled: true,
    title: 'Answers from OUR evidence only — competitor facts we read off their pages, our own documents, and the prediction ledger. No web search. ' +
           'Half-built today: the evidence is retrieved and shown, then the run stops rather than writing prose it cannot cite.',
    sub: 'Answers from our own evidence: what we read off a competitor’s page and when, what we have written down, ' +
         'and what we have forecast. Each is marked as what it is — none of them is the open web.',
    placeholder: 'Ask what we know, what we have decided, or what we expect…',
  },
  verified: {
    label: 'Verified',
    param: 'verified',
    enabled: true,
    title: 'The strict gate: nothing is shown until the whole answer has passed a verbatim check. Slower, and the right tool when the answer feeds a decision.',
    sub: 'Nothing is shown until the whole answer has passed the verbatim gate. Slower than Web, and what the claims it drops ' +
         'are listed for. Use it when the answer feeds a pricing or positioning call.',
    placeholder: 'Ask something the answer has to be right about…',
  },
  /* The only mode that is measured in minutes, and the only one that publishes
     a plan you can stop. `enabled` is computed rather than declared — see
     DEEP_ENABLED above for the three ways it becomes true and why none of them
     is a probe. */
  deep: {
    label: 'Deep',
    param: 'deep',
    enabled: DEEP_ENABLED,
    title: DEEP_ENABLED
      ? 'Two to four minutes. Breaks the question into sub-questions, publishes the plan before it ' +
        'searches anything, then reports what each step actually proved — so you can stop it at minute ' +
        'one instead of finding out at minute four. It may ask you something first.'
      : DEEP_OFF_TITLE,
    sub: 'A long run that shows its work. The plan goes up before the first search, every step reports ' +
         'how many new proven quotes it added — not how many pages it read — and you can stop it at any point.',
    placeholder: 'Ask something worth three minutes — a decision, a market, a strategy…',
  },
};

const MODE_ORDER = ['web', 'grounded', 'verified', 'deep'];

/** Stored answers carry the pipeline's own name for the default mode. */
const normalizeMode = (m) => {
  const v = String(m || '');
  if (v === 'fast' || v === '') return 'web';
  return MODES[v] ? v : 'web';
};

/* ══ source kinds ══════════════════════════════════════════════════════════

   Four kinds, and the ONLY thing that matters about them is what a reader can
   do to check one. A web page opens in a tab. A competitor fact opens their
   page — but the fact is our reading of it on a date, and their page today
   may say something else. A Brain passage opens nothing: it is us citing
   ourselves. A ledger row is not an observation at all.

   `linkable` is load-bearing beyond styling. A Brain locator like
   `taskly-brain/…/PRICING_v3.md § Commission` resolves against location.href
   into a perfectly valid http URL, so `safeUrl()` would hand back
   `http://127.0.0.1:4478/taskly-brain/…` and the card would render as a live
   link to a 404. An internal locator therefore never reaches safeUrl at all. */
const KIND = {
  web: {
    group: 'From the open web',
    hint: '',
    one: 'web page', many: 'web pages',
    mark: '↗',                 // north-east arrow: it opens
    origin: '',                     // a hostname is its own origin
    linkable: true,
  },
  world: {
    group: 'Competitor pages, as we read them',
    hint: 'What their page said on the date we read it — our observation, not the page. ' +
          'The link opens their page as it stands today, which may differ.',
    one: 'competitor page', many: 'competitor pages',
    mark: '◉',                 // fisheye: an observation
    origin: '',
    linkable: true,
  },
  brain: {
    group: 'Our own documents',
    hint: 'Ours. Not links — these are documents in our own vault, so this is us citing ourselves. ' +
          'Nothing outside Taskly says them.',
    one: 'document of ours', many: 'documents of ours',
    mark: '§',                 // section mark: a document and a section
    origin: 'taskly brain',
    linkable: false,
  },
  ledger: {
    group: 'Forecasts we recorded',
    hint: 'What we expect, at some probability, written down before the fact. Not measurements, ' +
          'and not things that have happened.',
    one: 'forecast', many: 'forecasts',
    mark: '~',                      // approximately: not measured
    origin: 'prediction ledger',
    linkable: false,
  },
};

const KIND_ORDER = ['web', 'world', 'brain', 'ledger'];

/** The contract: an absent `kind` means `web` — every source emitted before
 *  2026-08-31 was one. Anything unrecognised is treated the same way, which
 *  is the conservative reading: it gets the kind with the weakest claim. */
const kindOf = (k) => (KIND[String(k || '')] ? String(k) : 'web');

const INTERNAL = { brain: true, ledger: true };

/** A date, or an honest admission that there is not one. Absence matters:
 *  a competitor fact from June and one from today are not equal evidence, so
 *  a missing date is printed, never quietly dropped. */
function whenText(iso) {
  const raw = String(iso || '').trim();
  if (raw === '') return null;
  const d = new Date(raw);
  if (isNaN(d.getTime())) return raw;
  return d.toLocaleDateString('en-CA', { day: 'numeric', month: 'short', year: 'numeric' });
}

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ══ state ═════════════════════════════════════════════════════════════════ */

/**
 * One object, mutated in place; render functions read from it and touch only
 * the nodes that changed. No diffing, no re-render of the answer — the whole
 * reason this is not `ui.html`.
 *
 * `QS` is declared up by the mode table — the Deep pill's availability is read
 * off the query string, and that decision has to be made before MODES is built.
 */
const S = {
  // `?mode=grounded` presets the pill, so a link can carry the mode as well as
  // the question — and so the grounded demo is one href, not a click.
  mode: (MODES[String(QS.get('mode') || '')] && MODES[String(QS.get('mode'))].enabled)
    ? String(QS.get('mode')) : 'web',
  threadId: null,
  threads: [],
  turns: [],          // Turn[] — one per question asked in this thread
  live: null,         // the Turn currently streaming, or null
  es: null,           // EventSource
  demo: QS.get('demo') === '1',
  endpoint: QS.get('api') || '/api/answer',
  demoTimers: [],
};

/**
 * A turn owns its own DOM. `sentences` is keyed by the SERVER's sentence index
 * — the client never splits text, because two splitters that disagree about
 * "Inc." put a verdict on the wrong sentence, which is worse than no verdict.
 */
function newTurn(question) {
  return {
    id: 't' + Math.random().toString(36).slice(2, 9),
    question,
    steps: [],          // {phase, detail}
    sources: [],        // SourceEvent, normalised — see onSource
    groups: new Map(),  // kind -> {sec, grid} in the source strip
    spans: new Map(),   // id -> SpanEvent
    sentences: new Map(), // n -> sentence record
    order: [],          // sentence indices, in creation order
    phase: '',
    phaseDetail: '',
    // Which pipeline wrote it. Neither web nor grounded has a claim-level drop
    // stage at all, and saying "nothing was dropped" about a stage that does
    // not exist is the kind of quiet over-claim the refusals card exists to
    // prevent. It also decides how the sources are framed.
    mode: 'web',
    // Fork needs (thread, seq). `done` carries a messageId, not a seq, so the
    // seq is resolved from the thread transcript at fork time — see forkTurn.
    threadId: null,
    messageId: null,
    seq: null,
    // The pre-`done` `epilogue` frame: unanswered, the run's note, related.
    epilogue: null,
    doneAt: null,
    els: null,

    /* ── deep research ──────────────────────────────────────────────────────
       `plan` is keyed by the step number the server owns — `PlanStep.n` is
       documented stable across a revision, so a replan revises `question` and
       never renumbers. That is what lets a revision be shown as a CHANGE to a
       row rather than as a new list replacing the old one.

       `timeline` is the chronology this panel renders: plan revisions and
       reflections interleaved with the steps in the order they actually
       arrived, because "the plan changed after step 2" is a fact about when,
       and a panel that sorts it away has thrown that away. */
    plan: new Map(),      // n -> {n, question, why, state, detail, found, was[], added}
    planOrder: [],        // step numbers, in the order the plan first named them
    revisions: [],        // {because, afterN, changed[], added[]}
    reflects: [],         // {after, stillOpen[], note, stop}
    foundTotal: 0,        // sum of `found` — PROVEN SPANS, never pages read
    deepStartedAt: null,
    tick: 0,              // the elapsed-time interval, cleared at finish
    clarify: null,        // the ClarifyEvent, while it is unanswered
    clarifyAnswers: null, // what the reader typed, once they have
    reAsked: false,       // a second clarify with the same questions — see onClarify
    stopped: false,
  };
}

/* ══ chrome ════════════════════════════════════════════════════════════════ */

/* Two sets, because the good question for each mode is a different question.
   Offering "what changed on their pricing page" under Grounded would send the
   reader at the one thing grounded mode cannot do, and vice versa. */
const SUGGESTED = {
  web: [
    'Should we run a snow-removal campaign in Toronto this October?',
    'What are Jiffy and TaskRabbit charging homeowners in the GTA right now?',
    'Which home-services category has the least competition in Toronto?',
    'What changed on our competitors’ pricing pages this month?',
  ],
  grounded: [
    'What do we know about Jiffy?',
    'What is our commission rate?',
    'What have we decided about the poster platform fee?',
    'What did we forecast about competitor pricing this quarter?',
  ],
  /* Deliberately bigger than the others. A question a fast run answers well is
     a question a deep run wastes three minutes on, and offering one here would
     teach the reader that the mode is slow for nothing. Each of these needs
     several sub-questions before it can be answered at all — which is exactly
     what the plan is going to show. */
  deep: [
    'How should we price against Jiffy and TaskRabbit in the GTA over the next two quarters?',
    'What would it take for a new marketplace to win Toronto home services?',
    'Which of our competitors is most exposed if labour costs rise next year?',
    'Where is GTA demand for home services growing fastest, and what is driving it?',
  ],
};
SUGGESTED.verified = SUGGESTED.web;

function mountPrompts() {
  const wrap = $('#prompts');
  wrap.replaceChildren();
  for (const p of (SUGGESTED[S.mode] || SUGGESTED.web)) {
    const b = el('button', 'prompt', p);
    b.addEventListener('click', () => { $('#q0').value = p; submit(p); });
    wrap.appendChild(b);
  }
}

/* ── the pills ────────────────────────────────────────────────────────────
   Rendered from MODES into both groups. A disabled pill keeps its title, so
   hovering "Verified" says why it is off rather than leaving a dead control. */
function mountModes() {
  for (const id of ['#modes0', '#modes1']) {
    const wrap = $(id);
    wrap.replaceChildren();
    for (const key of MODE_ORDER) {
      const m = MODES[key];
      const b = el('button', null, m.label);
      b.dataset.mode = key;
      b.type = 'button';
      b.title = m.title;
      b.setAttribute('aria-pressed', String(key === S.mode));
      if (!m.enabled) b.disabled = true;
      wrap.appendChild(b);
    }
  }
}

function setMode(key) {
  if (!MODES[key] || !MODES[key].enabled) return;
  S.mode = key;
  for (const b of document.querySelectorAll('.modes button')) {
    b.setAttribute('aria-pressed', String(b.dataset.mode === S.mode));
  }
  const sub = $('#emptySub');
  if (sub && MODES[key].sub) sub.textContent = MODES[key].sub;
  $('#q0').placeholder = MODES[key].placeholder || $('#q0').placeholder;
  mountPrompts();
}

mountModes();
setMode(S.mode);

/* ══ theme ═════════════════════════════════════════════════════════════════

   The state lives on <html>, put there by the head script before the first
   paint; this is only the control that writes it. Two attributes, and the
   difference between them is the whole reason there are three buttons:
   `data-theme-pref` is what the reader chose and is what the pill reflects,
   `data-theme` is what that currently resolves to and is what the CSS reads.
   With System pressed, the second one changes under the first.

   Nothing here touches localStorage directly — TMOS_THEME.set owns the
   try/catch, because a blocked or full store must lose the PREFERENCE, never
   the page. If the head script somehow did not run, every call below no-ops
   and the page stays light rather than throwing. */

const THEME_OPTIONS = [
  { key: 'system', label: 'System', title: 'Follow the operating system, and keep following it if it changes.' },
  { key: 'light', label: 'Light', title: 'Always light — cream ground, rich-black text.' },
  { key: 'dark', label: 'Dark', title: 'Always dark — black ground, champagne accent.' },
];

function mountTheme() {
  const T = window.TMOS_THEME;
  const wrap = $('#themePick');
  if (!wrap) return;
  wrap.replaceChildren();
  for (const opt of THEME_OPTIONS) {
    const b = el('button', null, opt.label);
    b.type = 'button';
    b.dataset.theme = opt.key;
    b.title = opt.title;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => { if (T) T.set(opt.key, true); paintTheme(); });
    wrap.appendChild(b);
  }
  paintTheme();
  // `system` is a standing instruction, so the resolved theme can change with
  // no click. The head script re-stamps <html>; this keeps the label honest.
  try {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', paintTheme);
  } catch { /* no matchMedia — the pill just never updates itself */ }
}

function paintTheme() {
  const root = document.documentElement;
  const pref = root.getAttribute('data-theme-pref') || 'system';
  const now = root.getAttribute('data-theme') || 'light';
  for (const b of document.querySelectorAll('#themePick button')) {
    b.setAttribute('aria-pressed', String(b.dataset.theme === pref));
  }
  const wrap = $('#themePick');
  if (wrap) {
    wrap.setAttribute('aria-label',
      'Theme — ' + pref + (pref === 'system' ? ' (' + now + ' right now)' : ''));
  }
}

mountTheme();

function bindBox(taInput, goBtn, modesId) {
  const ta = $(taInput);
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; };
  ta.addEventListener('input', grow);
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(ta.value); ta.value = ''; grow(); }
  });
  $(goBtn).addEventListener('click', () => { submit(ta.value); ta.value = ''; grow(); });
  $(modesId).addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]');
    if (b) setMode(b.dataset.mode);
  });
}
bindBox('#q0', '#go0', '#modes0');
bindBox('#q1', '#go1', '#modes1');

$('#newThread').addEventListener('click', () => resetToEmpty());
$('#sideToggle').addEventListener('click', () => document.body.classList.toggle('side-open'));

function resetToEmpty() {
  stopStream();
  S.turns = [];
  S.live = null;
  S.threadId = null;
  $('#turns').replaceChildren();
  $('#scroll').classList.add('hidden');
  $('#composer').classList.add('hidden');
  $('#empty').classList.remove('hidden');
  for (const t of document.querySelectorAll('.thread')) t.setAttribute('aria-current', 'false');
  $('#q0').focus();
}

function enterThreadView() {
  $('#empty').classList.add('hidden');
  $('#scroll').classList.remove('hidden');
  $('#composer').classList.remove('hidden');
  document.body.classList.remove('side-open');
}

if (S.demo) {
  const b = $('#banner');
  b.classList.remove('hidden');
  b.append(
    document.createTextNode('Demo — scripted events, no server, no spend'),
    el('span', 'spacer'),
  );
  // Which script is about to run matters: the grounded one is the only place
  // the world / brain / ledger cards can be seen until the route supports them.
  const which = el('span', null, '');
  which.style.cssText = 'font-family:var(--mono);font-size:10px;letter-spacing:.1em';
  const paintWhich = () => {
    // The deep script says its timings are compressed, because it is the one
    // script whose whole subject is how long the real thing takes.
    which.textContent = S.mode === 'deep' ? 'deep script — timings compressed ~5:1'
      : S.mode === 'grounded' ? 'grounded script' : 'web script';
  };
  paintWhich();
  b.insertBefore(which, b.querySelector('.spacer'));
  for (const btn of document.querySelectorAll('.modes button')) {
    btn.addEventListener('click', paintWhich);
  }
  const leave = el('button', null, 'Leave demo');
  leave.style.cssText = 'font-size:11px;padding:3px 10px';
  leave.addEventListener('click', () => { location.search = ''; });
  b.appendChild(leave);
}

/* ══ threads sidebar ═══════════════════════════════════════════════════════
   Another agent owns /api/threads. Until it lands this 404s, and a 404 here
   must cost nothing: the list is a convenience, the answer engine is not. */

async function loadThreads() {
  if (S.demo) { renderThreads(DEMO_THREADS); return; }
  try {
    const res = await fetch('/api/threads', { headers: { accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const body = await res.json();
    const rows = Array.isArray(body) ? body : (Array.isArray(body && body.threads) ? body.threads : []);
    renderThreads(rows);
  } catch {
    renderThreads([]);
    note('No saved threads yet. Answers persist once the thread store is wired up.');
  }
}

function note(msg) {
  const n = $('#threadNote');
  n.textContent = msg;
  n.classList.remove('hidden');
}

function renderThreads(rows) {
  const wrap = $('#threads');
  wrap.replaceChildren();
  S.threads = rows;
  if (!rows.length) return;
  $('#threadNote').classList.add('hidden');
  for (const r of rows) {
    const b = el('button', 'thread');
    b.setAttribute('aria-current', 'false');
    b.dataset.threadId = String(r.id ?? '');
    b.appendChild(document.createTextNode(String(r.title || r.question || 'Untitled thread')));
    const meta = [];
    if (r.createdAt || r.created_at) meta.push(String(r.createdAt || r.created_at).slice(0, 10));
    if (Number(r.messageCount) > 0) {
      const turns = Math.ceil(Number(r.messageCount) / 2);
      meta.push(turns + (turns === 1 ? ' turn' : ' turns'));
    }
    // A fork says so in the list. Otherwise the only difference between a fork
    // and a coincidentally similar thread is in the database.
    if (r.forkedFromMessageId) meta.push('forked');
    if (meta.length) b.appendChild(el('small', null, meta.join(' · ')));
    b.addEventListener('click', () => { void openThreadById(String(r.id ?? ''), r); });
    wrap.appendChild(b);
  }
  markThreadCurrent(S.threadId);
}

/** The sidebar's idea of "where you are". Called after a run creates a thread,
 *  after a fork, and on every re-list — the list is rebuilt from scratch each
 *  time, so the highlight has to be re-applied rather than assumed. */
function markThreadCurrent(id) {
  for (const t of document.querySelectorAll('.thread')) {
    t.setAttribute('aria-current', String(id != null && t.dataset.threadId === String(id)));
  }
}

async function openThreadById(id, row) {
  document.body.classList.remove('side-open');
  stopStream();
  S.threadId = id || null;
  markThreadCurrent(S.threadId);
  if (S.demo) { const q = String((row && row.title) || ''); resetToEmpty(); submit(q); return; }
  try {
    const res = await fetch('/api/threads/' + encodeURIComponent(String(id)));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const detail = await res.json();
    if (!Array.isArray(detail && detail.messages) || detail.messages.length === 0) throw new Error('empty');
    replayThread(detail);
    markThreadCurrent(S.threadId);
  } catch {
    // Degrade honestly rather than pretending the thread is empty.
    S.turns = [];
    $('#turns').replaceChildren();
    enterThreadView();
    const t = newTurn(String((row && (row.title || row.question)) || 'Saved thread'));
    S.turns.push(t);
    TURNS.set(t.id, t);
    $('#turns').appendChild(buildTurn(t));
    showError(t, 'This thread is saved, but the transcript endpoint is not available yet. Ask the question again to re-run it.');
    finishTurn(t, null);
  }
}

/**
 * Rebuild a stored thread through the same handlers the live stream uses.
 *
 * `ThreadDetail.messages` alternates user/assistant. An assistant message
 * carries the whole answer as one `body` string with its `[N]` markers intact,
 * plus the citations those markers resolve to — so the marker parser does the
 * same work it does on a live stream, just fed in one bite.
 *
 * WHAT IS NOT STORED: the per-sentence verdicts. `message_citation` keeps the
 * span (which is what stays checkable), not the checks that ran over the prose.
 * So a replayed badge renders `stored` — neither confirmed nor flagged — and
 * says so on hover. Painting them confirmed would be inventing a check.
 */
function replayThread(detail) {
  S.turns = [];
  S.live = null;
  $('#turns').replaceChildren();
  enterThreadView();

  let turn = null;
  const open = (question) => {
    turn = newTurn(question);
    turn.replayed = true;
    turn.threadId = detail.id ?? S.threadId;
    S.turns.push(turn);
    TURNS.set(turn.id, turn);
    $('#turns').appendChild(buildTurn(turn));
    return turn;
  };

  for (const m of (detail.messages || [])) {
    if (m.role === 'user') { open(String(m.body ?? '')); continue; }
    if (!turn) open('');

    const cites = Array.isArray(m.citations) ? m.citations : [];
    const payload = m.answer || {};
    const docs = Array.isArray(payload.sources) ? payload.sources : [];

    // Sources: the read documents when they were stored, otherwise the distinct
    // pages the citations point at — a span is worthless without its page.
    const order = [];
    const indexOf = (url) => {
      const at = order.indexOf(url);
      if (at !== -1) return at + 1;
      order.push(url);
      const c = cites.find((x) => x.sourceUrl === url);
      onSource(turn, { i: order.length, url, domain: domainOf(url, ''),
                       title: (c && c.title) || domainOf(url, url) });
      return order.length;
    };
    // Forwarded when the store kept them. A grounded answer replayed without
    // `kind` degrades to web cards — wrong label, but never a false link: a
    // locator that is not http(s) fails safeUrl and the card renders unclickable.
    for (const d of docs) { order.push(String(d.url)); onSource(turn, {
      i: order.length, url: d.url, domain: d.domain || domainOf(d.url, ''), title: d.title,
      kind: d.kind, observedAt: d.observedAt }); }
    for (const c of cites) {
      onSpan(turn, { id: Number(c.ordinal), sourceIndex: indexOf(String(c.sourceUrl)),
                     quote: String(c.span ?? '') });
    }

    /* A STORED BODY IS NOT ALWAYS AN ANSWER.
     *
     * When a run finds nothing quotable it writes no prose, and the route
     * persists the run's own note as the message body so the thread is not
     * blank. Replayed as prose that reads as a confident uncited sentence —
     * the exact shape this system refuses. A body carrying no `[N]` and no
     * citations was never an answer, so it is replayed as the note it is. */
    const body = String(m.body ?? '');
    const isNote = cites.length === 0 && !/\[\d{1,3}\]/.test(body);
    // The server numbers sentences from 0. A stored answer is one block, so it
    // is fed as sentence 0 — matching the live stream rather than inventing a
    // second convention for the replay path.
    if (!isNote) feedDelta(turn, 0, body);
    markStored(turn);
    turn.mode = normalizeMode(m.mode);
    // Fork needs the seq, and a replayed turn has it for free — no lookup.
    turn.seq = Number.isFinite(Number(m.seq)) ? Number(m.seq) : null;
    turn.messageId = m.id ?? null;
    finishTurn(turn, {
