<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TMOS — Ask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  THE ANSWER ENGINE SHELL.

  One file, no bundler, no framework. Not asceticism — arithmetic. React here
  would mean a build step, new devDeps in a LOCKED pnpm-lock.yaml, a knip entry,
  and a jsdom test env this repo does not have, to render a page that is one
  list, one paragraph, and a text box.

  ── WHY THIS IS NOT ui.html WITH A NEW TAB ─────────────────────────────────

  ui.html renders by rebuilding innerHTML from a snapshot. That is fine for a
  dashboard that changes once a minute and impossible for prose that changes
  forty times a second: rebuilding the answer on every token throws away the
  selection, the scroll anchor, the hover target and any animation in flight,
  and it is quadratic in answer length.

  So this file has a state object and functions that touch only the nodes that
  changed. The hot path — `feedDelta` — ends at `Text.appendData()`. Nothing
  above the live sentence is read, re-created or re-laid-out while text streams.

  ── WHAT IS UNTRUSTED ──────────────────────────────────────────────────────

  Everything the server sends. Page titles come from other people's HTML, and
  prose comes from a language model that has read other people's HTML. Dynamic
  values are written with `textContent` or through `esc()`; a URL is opened only
  after `safeUrl()` has agreed it is http(s).

  ── ?demo=1 ────────────────────────────────────────────────────────────────

  Replays a scripted run of the real events with real timing, no server, no
  spend. It exists because the staging IS the product and the staging cannot be
  reviewed from a screenshot of a finished answer — and because a UI you can
  only exercise by paying for a 60-second pipeline run is a UI nobody exercises.
-->
<style>
  /* ── tokens: carried from ui.html unchanged ───────────────────────────── */
  :root{
    --ground:#faf7f2; --surface:#ffffff; --line:#e8e2d8;
    --ink:#14120f; --muted:#6b6459; --faint:#9c948699;
    --brass:#b8860b; --hold:#2c6b50; --moved:#a04d1a;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius:16px;
    /* hover is a wash, never a fill — the founder rule */
    --wash:#14120f0a;
    --brass-tint:#b8860b14;
    --shadow:0 1px 2px #14120f0a, 0 8px 24px #14120f0a;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0e1114; --surface:#161a1e; --line:#272d33;
      --ink:#e7ebee; --muted:#939da5; --faint:#6c767e;
      --brass:#cba347; --hold:#5aa886; --moved:#d17b45;
      --wash:#e7ebee12; --brass-tint:#cba34720;
      --shadow:0 1px 2px #0006, 0 8px 24px #0004;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-weight:600;margin:0;letter-spacing:-.014em}   /* 600 is the ceiling */
  a{color:inherit}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
           text-transform:uppercase;color:var(--faint)}
  .hidden{display:none!important}
  button{font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;
         border:1px solid var(--line);background:var(--surface);color:var(--ink);
         cursor:pointer;transition:background .14s ease,border-color .14s ease,transform .06s ease}
  button:hover:not(:disabled){background:var(--wash);border-color:var(--faint)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.42;cursor:not-allowed}
  button.primary{background:var(--brass);border-color:var(--brass);color:#fff}
  button.primary:hover:not(:disabled){background:var(--brass);filter:brightness(1.07)}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

  /* ── shell ────────────────────────────────────────────────────────────── */
  .app{display:flex;height:100vh;overflow:hidden}

  aside{width:246px;flex:none;background:var(--surface);border-right:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0}
  .side-head{padding:16px 16px 12px;display:flex;flex-direction:column;gap:2px}
  .side-head h1{font-size:14.5px}
  .side-new{margin:0 12px 10px;text-align:left;display:flex;align-items:center;gap:8px}
  .side-new .plus{font-family:var(--mono);color:var(--brass)}
  .side-lab{padding:6px 18px 6px;display:flex;align-items:center;gap:8px}
  .threads{flex:1;overflow:auto;padding:2px 8px 14px;min-height:0}
  .thread{display:block;width:100%;text-align:left;border:0;background:none;border-radius:10px;
          padding:8px 10px;color:var(--muted);font-size:13px;line-height:1.35;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread:hover{background:var(--wash);border-color:transparent}
  .thread[aria-current="true"]{background:var(--wash);color:var(--ink)}
  .thread small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--faint);
                letter-spacing:.08em;margin-top:2px}
  .side-note{padding:4px 18px 16px;color:var(--faint);font-size:12px;line-height:1.5}
  .side-foot{border-top:1px solid var(--line);padding:10px 14px;display:flex;
             align-items:center;gap:8px;flex-wrap:wrap}
  .side-foot a{font-family:var(--mono);font-size:10px;letter-spacing:.1em;
               text-transform:uppercase;color:var(--faint);text-decoration:none}
  .side-foot a:hover{color:var(--brass)}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}

  /* ── empty state ──────────────────────────────────────────────────────── */
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
         padding:24px;overflow:auto}
  .empty-in{width:100%;max-width:640px;text-align:center}
  .empty h2{font-size:26px;letter-spacing:-.02em;margin-bottom:8px}
  .empty p.sub{color:var(--muted);margin:0 0 26px;font-size:14px}
  .prompts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
  .prompt{border:1px solid var(--line);background:var(--surface);border-radius:999px;
          padding:8px 14px;font-size:12.5px;color:var(--muted);text-align:left;
          max-width:100%;white-space:normal;line-height:1.4}
  .prompt:hover{background:var(--wash);color:var(--ink)}

  /* ── the box ──────────────────────────────────────────────────────────── */
  .box{display:flex;align-items:flex-end;gap:8px;background:var(--surface);
       border:1px solid var(--line);border-radius:var(--radius);padding:10px 10px 10px 16px;
       box-shadow:var(--shadow);transition:border-color .15s ease}
  .box:focus-within{border-color:var(--brass)}
  .box textarea{flex:1;font:inherit;font-size:15px;line-height:1.5;border:0;outline:0;
                background:none;color:var(--ink);resize:none;max-height:160px;min-height:26px;
                padding:3px 0}
  .box textarea::placeholder{color:var(--faint)}
  .box .go{width:34px;height:34px;padding:0;flex:none;display:grid;place-items:center;
           font-size:15px;line-height:1}
  .modes{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
  .modes button{border:0;padding:4px 10px;font-size:11.5px;color:var(--muted);background:none}
  .modes button[aria-pressed="true"]{background:var(--brass-tint);color:var(--brass)}
  .modes button:hover{background:var(--wash)}

  /* ── thread view ──────────────────────────────────────────────────────── */
  .scroll{flex:1;overflow:auto;min-height:0}
  .col{max-width:760px;margin:0 auto;padding:30px 24px 40px}
  .composer{border-top:1px solid var(--line);background:var(--ground);padding:12px 24px 16px}
  .composer .col{padding:0}

  .turn{padding-bottom:30px;margin-bottom:6px}
  .turn + .turn{border-top:1px solid var(--line);padding-top:28px}
  .turn h2.q{font-size:23px;line-height:1.28;letter-spacing:-.02em;margin-bottom:14px;
             overflow-wrap:anywhere}

  /* ── status ───────────────────────────────────────────────────────────── */
  .status{margin:0 0 18px}
  .live{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;min-width:0}
  /* The real pipeline's `detail` is not a label — it is four search queries
     joined, or "33 result(s)". Rendering it AS the phase (which is what the
     first cut did) left the line reading "33 result(s)" with no verb in front
     of it. So the phase keeps its own words and the detail rides beside it,
     clipped, with the whole string on hover and in the steps list. */
  .live .detail{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;
                color:var(--faint);white-space:nowrap;overflow:hidden;
                text-overflow:ellipsis;min-width:0;flex:1}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--brass);flex:none;
       animation:pulse 1.15s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.28;transform:scale(.8)}}
  .live .phase{position:relative}
  .steps-toggle{padding:4px 11px;font-size:11.5px;color:var(--muted);
                font-family:var(--mono);letter-spacing:.06em}
  .steps{list-style:none;margin:10px 0 0;padding:0 0 0 9px;border-left:1px solid var(--line)}
  .steps li{font-size:12.5px;color:var(--muted);padding:3px 0 3px 12px;position:relative}
  .steps li::before{content:'';position:absolute;left:-13px;top:11px;width:7px;height:1px;
                    background:var(--line)}
  .steps li b{font-weight:500;color:var(--ink);font-family:var(--mono);font-size:10px;
              letter-spacing:.1em;text-transform:uppercase;margin-right:8px}

  /* ── sources ──────────────────────────────────────────────────────────── */
  .sources{margin:0 0 22px}
  .srchead{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
  .srcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
  .src{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);
       border-radius:11px;padding:10px 11px;min-width:0;
       opacity:0;transform:translateY(6px);
       transition:opacity .34s ease,transform .34s cubic-bezier(.16,1,.3,1),
                  background .14s ease,border-color .14s ease}
  .src.in{opacity:1;transform:none}
  .src:hover{background:var(--wash);border-color:var(--faint)}
  .src .top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .fav{width:14px;height:14px;border-radius:3px;flex:none;object-fit:cover}
  .fav-fb{width:14px;height:14px;border-radius:3px;flex:none;display:grid;place-items:center;
          background:var(--brass-tint);color:var(--brass);font-family:var(--mono);
          font-size:8.5px;line-height:1;text-transform:uppercase}
  .src .dom{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint);
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .src .num{font-family:var(--mono);font-size:9.5px;color:var(--faint);flex:none}
  .src .ttl{font-size:12.5px;line-height:1.35;color:var(--ink);
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ── prose + citations ────────────────────────────────────────────────── */
  .prose{font-size:16px;line-height:1.72;max-width:66ch;overflow-wrap:anywhere}
  .sent{transition:background .25s ease}
  .sent.flagged{text-decoration:underline dotted var(--moved);text-underline-offset:4px;
                text-decoration-thickness:1px}
  .cb{font-family:var(--mono);font-size:9.5px;line-height:1;vertical-align:super;
      display:inline-block;min-width:10px;text-align:center;padding:2px 1px;margin:0 1px 0 0;
      border-radius:5px;cursor:pointer;border:1px solid transparent;
      transition:background .18s ease,color .18s ease,border-color .18s ease;
      user-select:none}
  .cb.pending{color:var(--faint);border-color:var(--line);border-style:dashed;
              animation:breathe 1.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
  .cb.confirmed{color:var(--brass);background:var(--brass-tint);border-color:transparent}
  .cb.stored{color:var(--muted);background:var(--wash);border-color:transparent}
  .cb.flagged{color:var(--moved);background:transparent;border-color:var(--moved);
              border-style:dotted}
  .cb:hover{filter:brightness(1.1);border-color:var(--brass)}
  .cursor{display:inline-block;width:7px;height:1em;vertical-align:-2px;margin-left:1px;
          background:var(--brass);opacity:.6;animation:blink .9s steps(2,start) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ── tooltip ──────────────────────────────────────────────────────────── */
  .tip{position:fixed;z-index:60;width:min(340px,calc(100vw - 24px));background:var(--surface);
       border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
       padding:11px 13px;opacity:0;transform:translateY(4px);pointer-events:none;
       transition:opacity .13s ease,transform .13s ease}
  .tip.on{opacity:1;transform:none}
  .tip .top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .tip .dom{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint)}
  .tip .ttl{font-size:13px;line-height:1.35;margin-bottom:8px}
  .tip blockquote{margin:0 0 8px;padding:8px 11px;background:var(--ground);
                  border-left:2px solid var(--brass);border-radius:0 8px 8px 0;
                  font-size:12px;line-height:1.5;color:var(--muted)}
  .tip .verdict{font-size:11.5px;line-height:1.45;color:var(--muted);
                padding-top:7px;border-top:1px solid var(--line)}
  .tip .verdict b{font-weight:500;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
                  text-transform:uppercase;margin-right:6px}
  .tip .verdict.confirmed b{color:var(--hold)}
  .tip .verdict.flagged b{color:var(--moved)}
  .tip .verdict.pending b{color:var(--faint)}
  .tip .open{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
             color:var(--faint);margin-top:7px;display:block}

  /* ── refusals: the section §7 says never to delete ────────────────────── */
  .refusals{margin-top:26px;border:1px solid var(--line);border-radius:var(--radius);
            background:var(--surface);padding:15px 17px}
  .refusals h3{font-size:13px;margin-bottom:3px}
  .refusals .why-here{color:var(--muted);font-size:12.5px;margin:0 0 12px;max-width:62ch}
  .rgroup + .rgroup{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
  .rgroup .eyebrow{display:block;margin-bottom:7px}
  .drop{padding:8px 0;border-bottom:1px dashed var(--line);color:var(--muted);font-size:13px;
        line-height:1.5}
  .drop:last-child{border-bottom:0}
  .drop b{font-weight:500;color:var(--faint);text-decoration:line-through}
  .drop em{display:block;font-style:normal;font-size:12px;color:var(--moved);margin-top:3px}
  .drop .qt{display:block;font-size:12.5px;color:var(--ink);margin-bottom:3px}
  .none{color:var(--faint);font-size:12.5px;padding:4px 0}
  .rgroup .note{color:var(--ink);font-size:13px;line-height:1.55;padding:4px 0}

  /* ── related + actions ────────────────────────────────────────────────── */
  .related{margin-top:24px}
  .related .eyebrow{display:block;margin-bottom:9px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .rq{border:1px solid var(--line);background:var(--surface);border-radius:999px;
      padding:7px 14px;font-size:12.5px;color:var(--muted);text-align:left;
      max-width:100%;white-space:normal;line-height:1.4}
  .rq:hover{background:var(--wash);color:var(--ink);border-color:var(--faint)}
  .rq .plus{color:var(--brass);font-family:var(--mono);margin-right:7px}
  .related .foot{color:var(--faint);font-size:11.5px;margin-top:9px}
  .actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:22px}
  .actions .cost{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
                 text-transform:uppercase;color:var(--faint)}
  /* An answer that is empty ON PURPOSE. Not an error — the run worked, read
     its documents and found nothing it could quote. Dashed, muted, and clearly
     not prose, so it is never mistaken for the answer. */
  .blank{border:1px dashed var(--line);border-radius:12px;padding:12px 15px;
         color:var(--muted);font-size:13.5px;line-height:1.55;background:var(--surface)}
  .blank b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
           text-transform:uppercase;font-weight:500;color:var(--faint);margin-bottom:5px}
  .err{border:1px solid var(--moved);border-radius:12px;padding:11px 14px;color:var(--moved);
       font-size:13px;background:var(--surface);margin-top:12px}
  .err b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
         text-transform:uppercase;font-weight:500;margin-bottom:3px}

  .banner{background:var(--brass-tint);border-bottom:1px solid var(--line);
          padding:7px 24px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
          text-transform:uppercase;color:var(--brass);display:flex;gap:12px;align-items:center}
  .banner .spacer{flex:1}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);z-index:70;
         background:var(--ink);color:var(--ground);font-size:12.5px;padding:8px 15px;
         border-radius:999px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* ── narrow ───────────────────────────────────────────────────────────── */
  .side-toggle{display:none}
  @media (max-width:880px){
    aside{position:fixed;inset:0 auto 0 0;z-index:50;transform:translateX(-100%);
          transition:transform .2s cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow)}
    body.side-open aside{transform:none}
    .side-toggle{display:inline-flex;align-items:center;gap:7px;position:fixed;top:12px;left:12px;
                 z-index:40;background:var(--surface);box-shadow:var(--shadow)}
    .col{padding:56px 18px 34px}
    .composer{padding:10px 18px 14px}
    .turn h2.q{font-size:20px}
    .prose{font-size:15.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .src{opacity:1;transform:none}
  }
</style>
</head>
<body>

<div class="app">
  <aside id="side">
    <div class="side-head">
      <div class="eyebrow">Taskly marketing OS</div>
      <h1>Ask</h1>
    </div>
    <button class="side-new" id="newThread"><span class="plus">+</span> New thread</button>
    <div class="side-lab"><span class="eyebrow">Threads</span></div>
    <div class="threads" id="threads"></div>
    <div class="side-note hidden" id="threadNote"></div>
    <div class="side-foot">
      <a href="/" title="The old dashboard">Classic console</a>
      <span class="eyebrow">·</span>
      <a href="?demo=1" title="Replay a scripted run with no server">Demo</a>
    </div>
  </aside>

  <button class="side-toggle" id="sideToggle" aria-label="Threads">☰</button>

  <div class="main">
    <div class="banner hidden" id="banner"></div>

    <!-- empty state -->
    <section class="empty" id="empty">
      <div class="empty-in">
        <h2>Ask it anything.</h2>
        <p class="sub">Every figure comes back with the exact sentence it came from,
          on a page we actually fetched. What could not be sourced is listed, not smoothed over.</p>
        <div class="box" id="box0">
          <textarea id="q0" rows="1" placeholder="Ask about a market, a competitor, or a call you have to make…"></textarea>
          <div class="modes" id="modes0">
            <button data-mode="fast" aria-pressed="true" title="Streams as it writes; each sentence is checked a beat behind">Fast</button>
            <button data-mode="verified" aria-pressed="false" disabled
              title="Not wired yet — /api/answer takes only a question and a thread, so every run is Fast. Disabled rather than left as a toggle that silently does nothing.">Verified</button>
          </div>
          <button class="primary go" id="go0" aria-label="Ask">→</button>
        </div>
        <div class="prompts" id="prompts"></div>
      </div>
    </section>

    <!-- thread view -->
    <div class="scroll hidden" id="scroll">
      <div class="col" id="turns"></div>
    </div>
    <div class="composer hidden" id="composer">
      <div class="col">
        <div class="box">
          <textarea id="q1" rows="1" placeholder="Ask a follow-up…"></textarea>
          <div class="modes" id="modes1">
            <button data-mode="fast" aria-pressed="true">Fast</button>
            <button data-mode="verified" aria-pressed="false" disabled
              title="Not wired yet — every run is Fast.">Verified</button>
          </div>
          <button class="primary go" id="go1" aria-label="Ask">→</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="tip" id="tip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ══ helpers ═══════════════════════════════════════════════════════════════ */

const $ = (s, r) => (r || document).querySelector(s);

/** Model output and page titles are untrusted text. Same pattern as ui.html. */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** An href is a capability. Only http(s) gets one — never `javascript:`. */
const safeUrl = (u) => {
  try {
    const p = new URL(String(u), location.href);
    return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : null;
  } catch { return null; }
};

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = String(text);
  return n;
};

const domainOf = (u, fallback) => {
  try { return new URL(String(u)).hostname.replace(/^www\./, ''); }
  catch { return String(fallback || ''); }
};

/** Markers out, and the space they left in front of the punctuation with them. */
const stripMarkers = (t) => String(t)
  .replace(/\[[\d,;\s]+\]/g, '')
  .replace(/\s+([.,;:!?])/g, '$1')
  .replace(/\s+/g, ' ')
  .trim();

const PHASE_LABEL = {
  planning: 'Planning searches…',
  searching: 'Searching…',
  reading: 'Reading sources…',
  attributing: 'Finding quotable spans…',
  writing: 'Writing…',
  checking: 'Checking every figure…',
  done: 'Done',
};

let toastTimer = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ══ state ═════════════════════════════════════════════════════════════════ */

/**
 * One object, mutated in place; render functions read from it and touch only
 * the nodes that changed. No diffing, no re-render of the answer — the whole
 * reason this is not `ui.html`.
 */
const S = {
  mode: 'fast',
  threadId: null,
  threads: [],
  turns: [],          // Turn[] — one per question asked in this thread
  live: null,         // the Turn currently streaming, or null
  es: null,           // EventSource
  demo: new URLSearchParams(location.search).get('demo') === '1',
  endpoint: new URLSearchParams(location.search).get('api') || '/api/answer',
  demoTimers: [],
};

/**
 * A turn owns its own DOM. `sentences` is keyed by the SERVER's sentence index
 * — the client never splits text, because two splitters that disagree about
 * "Inc." put a verdict on the wrong sentence, which is worse than no verdict.
 */
function newTurn(question) {
  return {
    id: 't' + Math.random().toString(36).slice(2, 9),
    question,
    steps: [],          // {phase, detail}
    sources: [],        // SourceEvent
    spans: new Map(),   // id -> SpanEvent
    sentences: new Map(), // n -> sentence record
    order: [],          // sentence indices, in creation order
    phase: '',
    phaseDetail: '',
    // Which pipeline wrote it. A fast run has no claim-level drop stage at all,
    // and saying "nothing was dropped" about a stage that does not exist is the
    // kind of quiet over-claim the refusals card exists to prevent.
    mode: 'fast',
    // Fork needs (thread, seq). `done` carries a messageId, not a seq, so the
    // seq is resolved from the thread transcript at fork time — see forkTurn.
    threadId: null,
    messageId: null,
    seq: null,
    // The pre-`done` `epilogue` frame: unanswered, the run's note, related.
    epilogue: null,
    doneAt: null,
    els: null,
  };
}

$('#newThread').addEventListener('click', () => resetToEmpty());
$('#sideToggle').addEventListener('click', () => document.body.classList.toggle('side-open'));

/* ══ threads sidebar ═══════════════════════════════════════════════════════
   Another agent owns /api/threads. Until it lands this 404s, and a 404 here
   must cost nothing: the list is a convenience, the answer engine is not. */

async function loadThreads() {
  if (S.demo) { renderThreads(DEMO_THREADS); return; }
  try {
    const res = await fetch('/api/threads', { headers: { accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const body = await res.json();
    const rows = Array.isArray(body) ? body : (Array.isArray(body && body.threads) ? body.threads : []);
    renderThreads(rows);
  } catch {
    renderThreads([]);
    note('No saved threads yet. Answers persist once the thread store is wired up.');
  }
}

function note(msg) {
  const n = $('#threadNote');
  n.textContent = msg;
  n.classList.remove('hidden');
}

function renderThreads(rows) {
  const wrap = $('#threads');
  wrap.replaceChildren();
  S.threads = rows;
  if (!rows.length) return;
  $('#threadNote').classList.add('hidden');
  for (const r of rows) {
    const b = el('button', 'thread');
    b.setAttribute('aria-current', 'false');
    b.dataset.threadId = String(r.id ?? '');
    b.appendChild(document.createTextNode(String(r.title || r.question || 'Untitled thread')));
    const meta = [];
    if (r.createdAt || r.created_at) meta.push(String(r.createdAt || r.created_at).slice(0, 10));
    if (Number(r.messageCount) > 0) {
      const turns = Math.ceil(Number(r.messageCount) / 2);
      meta.push(turns + (turns === 1 ? ' turn' : ' turns'));
    }
    // A fork says so in the list. Otherwise the only difference between a fork
    // and a coincidentally similar thread is in the database.
    if (r.forkedFromMessageId) meta.push('forked');
    if (meta.length) b.appendChild(el('small', null, meta.join(' · ')));
    b.addEventListener('click', () => { void openThreadById(String(r.id ?? ''), r); });
    wrap.appendChild(b);
  }
  markThreadCurrent(S.threadId);
}

/** The sidebar's idea of "where you are". Called after a run creates a thread,
 *  after a fork, and on every re-list — the list is rebuilt from scratch each
 *  time, so the highlight has to be re-applied rather than assumed. */
function markThreadCurrent(id) {
  for (const t of document.querySelectorAll('.thread')) {
    t.setAttribute('aria-current', String(id != null && t.dataset.threadId === String(id)));
  }
}

async function openThreadById(id, row) {
  document.body.classList.remove('side-open');
  stopStream();
  S.threadId = id || null;
  markThreadCurrent(S.threadId);
  if (S.demo) { const q = String((row && row.title) || ''); resetToEmpty(); submit(q); return; }
  try {
    const res = await fetch('/api/threads/' + encodeURIComponent(String(id)));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const detail = await res.json();
    if (!Array.isArray(detail && detail.messages) || detail.messages.length === 0) throw new Error('empty');
    replayThread(detail);
    markThreadCurrent(S.threadId);
  } catch {
    // Degrade honestly rather than pretending the thread is empty.
    S.turns = [];
    $('#turns').replaceChildren();
    enterThreadView();
    const t = newTurn(String((row && (row.title || row.question)) || 'Saved thread'));
    S.turns.push(t);
    TURNS.set(t.id, t);
    $('#turns').appendChild(buildTurn(t));
    showError(t, 'This thread is saved, but the transcript endpoint is not available yet. Ask the question again to re-run it.');
    finishTurn(t, null);
  }
}

/**
 * Rebuild a stored thread through the same handlers the live stream uses.
 *
 * `ThreadDetail.messages` alternates user/assistant. An assistant message
 * carries the whole answer as one `body` string with its `[N]` markers intact,
 * plus the citations those markers resolve to — so the marker parser does the
 * same work it does on a live stream, just fed in one bite.
 *
 * WHAT IS NOT STORED: the per-sentence verdicts. `message_citation` keeps the
 * span (which is what stays checkable), not the checks that ran over the prose.
 * So a replayed badge renders `stored` — neither confirmed nor flagged — and
 * says so on hover. Painting them confirmed would be inventing a check.
 */
function replayThread(detail) {
  S.turns = [];
  S.live = null;
  $('#turns').replaceChildren();
  enterThreadView();

  let turn = null;
  const open = (question) => {
    turn = newTurn(question);
    turn.replayed = true;
    turn.threadId = detail.id ?? S.threadId;
    S.turns.push(turn);
    TURNS.set(turn.id, turn);
    $('#turns').appendChild(buildTurn(turn));
    return turn;
  };

  for (const m of (detail.messages || [])) {
    if (m.role === 'user') { open(String(m.body ?? '')); continue; }
    if (!turn) open('');

    const cites = Array.isArray(m.citations) ? m.citations : [];
    const payload = m.answer || {};
    const docs = Array.isArray(payload.sources) ? payload.sources : [];

    // Sources: the read documents when they were stored, otherwise the distinct
    // pages the citations point at — a span is worthless without its page.
    const order = [];
    const indexOf = (url) => {
      const at = order.indexOf(url);
      if (at !== -1) return at + 1;
      order.push(url);
      const c = cites.find((x) => x.sourceUrl === url);
      onSource(turn, { i: order.length, url, domain: domainOf(url, ''),
                       title: (c && c.title) || domainOf(url, url) });
      return order.length;
    };
    for (const d of docs) { order.push(String(d.url)); onSource(turn, {
      i: order.length, url: d.url, domain: domainOf(d.url, ''), title: d.title }); }
    for (const c of cites) {
      onSpan(turn, { id: Number(c.ordinal), sourceIndex: indexOf(String(c.sourceUrl)),
                     quote: String(c.span ?? '') });
    }

    /* A STORED BODY IS NOT ALWAYS AN ANSWER.
     *
     * When a run finds nothing quotable it writes no prose, and the route
     * persists the run's own note as the message body so the thread is not
     * blank. Replayed as prose that reads as a confident uncited sentence —
     * the exact shape this system refuses. A body carrying no `[N]` and no
     * citations was never an answer, so it is replayed as the note it is. */
    const body = String(m.body ?? '');
    const isNote = cites.length === 0 && !/\[\d{1,3}\]/.test(body);
    // The server numbers sentences from 0. A stored answer is one block, so it
    // is fed as sentence 0 — matching the live stream rather than inventing a
    // second convention for the replay path.
    if (!isNote) feedDelta(turn, 0, body);
    markStored(turn);
    turn.mode = String(m.mode || 'fast');
    // Fork needs the seq, and a replayed turn has it for free — no lookup.
    turn.seq = Number.isFinite(Number(m.seq)) ? Number(m.seq) : null;
    turn.messageId = m.id ?? null;
    finishTurn(turn, {
      costCents: Number(m.costCents) || 0,
      threadId: detail.id ?? S.threadId,
      messageId: m.id ?? null,
      flagged: 0,
      // `dropped` is passed only when it has content. A fast run stores `[]`
      // because it HAS no drop stage, not because the stage ran and found
      // nothing — and an empty array here would be rendered as the latter.
      dropped: (Array.isArray(payload.dropped) && payload.dropped.length) ? payload.dropped : undefined,
      unanswered: payload.unanswered,
      queries: payload.queries,
      note: isNote ? body : undefined,
    });
    turn = null;
  }
  SCROLLER.scrollTop = 0;
}

/** Badges on a replayed answer are settled but unjudged. See replayThread. */
function markStored(turn) {
  for (const n of turn.order) {
    const s = turn.sentences.get(n);
    s.verdict = 'stored';
    s.node.classList.remove('pending');
    for (const b of s.badges) {
      b.classList.remove('pending');
      b.classList.add('stored');
      b.setAttribute('aria-label', 'Citation ' + b.dataset.span + ', from a saved answer');
    }
  }
}

/* ══ turn DOM ══════════════════════════════════════════════════════════════ */

function buildTurn(turn) {
  const root = el('article', 'turn');
  root.id = turn.id;

  const q = el('h2', 'q', turn.question);
  root.appendChild(q);

  /* status */
  const status = el('div', 'status');
  const live = el('div', 'live');
  const phase = el('span', 'phase', 'Planning searches…');
  const detail = el('span', 'detail');
  live.append(el('span', 'dot'), phase, detail);
  const toggle = el('button', 'steps-toggle hidden');
  toggle.setAttribute('aria-expanded', 'false');
  const steps = el('ol', 'steps hidden');
  toggle.addEventListener('click', () => {
    const open = steps.classList.toggle('hidden') === false;
    toggle.setAttribute('aria-expanded', String(open));
  });
  status.append(live, toggle, steps);
  root.appendChild(status);

  /* sources — before the prose, deliberately: it is what makes the wait legible */
  const sources = el('section', 'sources hidden');
  const shead = el('div', 'srchead');
  shead.append(el('span', 'eyebrow', 'Sources'), el('span', 'eyebrow srccount', ''));
  const sgrid = el('div', 'srcgrid');
  sources.append(shead, sgrid);
  root.appendChild(sources);

  /* prose */
  const prose = el('div', 'prose');
  const cursor = el('span', 'cursor hidden');
  prose.appendChild(cursor);
  root.appendChild(prose);

  const blank = el('div', 'blank hidden');
  root.appendChild(blank);

  const err = el('div', 'err hidden');
  root.appendChild(err);

  /* the sections §7 says are the most tempting thing to delete */
  const refusals = el('section', 'refusals hidden');
  root.appendChild(refusals);

  const related = el('section', 'related hidden');
  root.appendChild(related);

  const actions = el('div', 'actions hidden');
  root.appendChild(actions);

  turn.els = { root, live, phase, detail, toggle, steps, sources, sgrid,
               scount: shead.lastChild, prose, cursor, blank, err, refusals, related, actions };
  return root;
}

/* ══ event handlers — one per name in ANSWER_EVENTS ════════════════════════ */

/**
 * WHAT THE LIVE RUN CHANGED HERE.
 *
 * The first cut rendered `detail || PHASE_LABEL[phase]` as the whole live line,
 * on the assumption that a detail is a nicer sentence than a label. Against the
 * real pipeline it is not: `reading` arrives with `"33 result(s)"` and
 * `searching` with four model-written queries joined by `·`. The line read
 * "33 result(s)" — a number with no verb in front of it — and then a 90-column
 * query list. So the phase always speaks in words, and the detail rides beside
 * it, clipped, with the full string on hover and in the steps list.
 */
function onStatus(turn, ev) {
  const phase = String(ev && ev.phase || '');
  const detail = ev && ev.detail ? String(ev.detail) : '';
  turn.steps.push({ phase, detail });
  turn.phase = phase;
  turn.phaseDetail = detail;
  turn.els.phase.textContent = PHASE_LABEL[phase] || phase || 'Working…';
  paintDetail(turn);
  const li = el('li');
  // The one place markup is built from a string rather than nodes. `detail`
  // carries a search query the model wrote, so it goes through esc() — same
  // guard, same shape as ui.html.
  li.innerHTML = '<b>' + esc(phase) + '</b>' + esc(detail || PHASE_LABEL[phase] || phase);
  turn.els.steps.appendChild(li);
}

/**
 * The second thing the live run showed: sources do not burst, they trickle.
 * The robots-gated reader holds a 2s-per-host floor, so eight documents took
 * 19 seconds to land — from 8s to 27s — with the status frozen on one line the
 * whole time. A running count is the difference between "reading" and "stuck".
 */
function paintDetail(turn) {
  const bits = [];
  if (turn.phaseDetail) bits.push(turn.phaseDetail);
  if (turn.phase === 'reading' && turn.sources.length > 0) {
    bits.push(turn.sources.length + ' read');
  }
  const line = bits.join('  ·  ');
  turn.els.detail.textContent = line;
  turn.els.detail.title = line;
}

function onSource(turn, ev) {
  const i = Number(ev && ev.i) || (turn.sources.length + 1);
  const url = safeUrl(ev && ev.url);
  const domain = String((ev && ev.domain) || domainOf(url, ''));
  const title = String((ev && ev.title) || domain || 'Untitled');
  const rec = { i, url, domain, title };
  turn.sources.push(rec);

  const card = el('a', 'src');
  if (url) { card.href = url; card.target = '_blank'; card.rel = 'noreferrer noopener'; }
  const top = el('div', 'top');
  top.appendChild(favicon(domain));
  top.appendChild(el('span', 'dom', domain));
  top.appendChild(el('span', 'num', String(i)));
  card.append(top, el('div', 'ttl', title));
  turn.els.sgrid.appendChild(card);

  turn.els.sources.classList.remove('hidden');
  turn.els.scount.textContent = String(turn.sources.length);
  paintDetail(turn);

  // Staggered, capped: eight sources should not take a second to appear.
  const delay = Math.min(turn.sources.length - 1, 9) * 55;
  setTimeout(() => card.classList.add('in'), 20 + delay);
}

/** Favicon, with a CSS-drawn monogram when the fetch fails (or is blocked). */
function favicon(domain) {
  const fb = el('span', 'fav-fb', (domain || '?').slice(0, 1));
  if (!domain) return fb;
  const img = el('img', 'fav');
  img.alt = '';
  img.loading = 'lazy';
  img.referrerPolicy = 'no-referrer';
  img.src = 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(domain);
  img.addEventListener('error', () => { img.replaceWith(fb); }, { once: true });
  return img;
}

function onSpan(turn, ev) {
  const id = Number(ev && ev.id);
  if (!Number.isFinite(id)) return;
  turn.spans.set(id, {
    id,
    sourceIndex: Number(ev.sourceIndex),
    quote: String(ev.quote ?? ''),
  });
}

/* ── the hot path ─────────────────────────────────────────────────────────
   `delta` arrives many times a second. It must not read or rebuild anything
   above the sentence it names. The end of this function is appendData(). */

function sentenceOf(turn, n) {
  let s = turn.sentences.get(n);
  if (s) return s;
  const node = el('span', 'sent pending');
  node.dataset.n = String(n);
  s = { n, node, raw: '', cut: 0, badges: [], verdict: 'pending', why: '' };
  turn.sentences.set(n, s);
  turn.order.push(n);
  // Sentences are separated by a space; HTML collapses a doubled one, so this
  // is safe whether or not the server's text carries its own leading space.
  const prose = turn.els.prose;
  prose.insertBefore(node, turn.els.cursor);
  prose.insertBefore(document.createTextNode(' '), turn.els.cursor);
  turn.els.cursor.classList.remove('hidden');
  return s;
}

/**
 * Markers are written " [1]." and read "…October¹." — the space in front of a
 * superscript is a rendering artefact, so it comes back out here rather than
 * being trimmed from the model's text (which we never rewrite).
 *
 * `endsWith(' ')` was not enough, and the live run is what showed it: Groq
 * writes U+202F NARROW NO-BREAK SPACE before a marker (and inside money ranges
 * — "$40\u202fto\u202f$150"). Being no-break, it does not collapse the way an
 * ordinary space does, so every citation rendered as "$52 ¹ ." with a visible
 * gap on both sides. The scripted demo used ASCII spaces and could never have
 * caught it. `\s` in JS already covers the whole Unicode space-separator class,
 * so one character of any whitespace comes off.
 */
function eatTrailingSpace(s) {
  const last = s.node.lastChild;
  if (last && last.nodeType === 3 && /\s$/.test(last.data)) {
    last.deleteData(last.data.length - 1, 1);
  }
}

function appendText(s, text) {
  if (!text) return;
  const last = s.node.lastChild;
  if (last && last.nodeType === 3) last.appendData(text);   // ← the whole point
  else s.node.appendChild(document.createTextNode(text));
}

const MARKER_RE = /^\s*\d{1,3}(\s*[,;]\s*\d{1,3})*\s*$/;

/**
 * Consume as much of the accumulated sentence text as is unambiguous.
 *
 * A marker can be split across deltas ("[" then "2]"), so an unclosed bracket
 * is HELD rather than printed — otherwise a stray "[" flashes on screen and
 * then has to be un-printed, which means rewriting text already committed to
 * the DOM. It is released as literal text after 32 characters with no "]",
 * which is long enough for any marker and short enough that real prose
 * containing a bracket does not stall.
 */
function drain(turn, s) {
  const raw = s.raw;
  let i = s.cut;
  while (i < raw.length) {
    const open = raw.indexOf('[', i);
    if (open === -1) { appendText(s, raw.slice(i)); i = raw.length; break; }
    if (open > i) { appendText(s, raw.slice(i, open)); i = open; }
    const close = raw.indexOf(']', open);
    if (close === -1) {
      if (raw.length - open > 32) { appendText(s, '['); i = open + 1; continue; }
      break;                                    // wait for more text
    }
    const inner = raw.slice(open + 1, close);
    if (MARKER_RE.test(inner)) {
      eatTrailingSpace(s);
      for (const part of inner.split(/[,;]/)) addBadge(turn, s, Number(part.trim()));
    } else {
      appendText(s, raw.slice(open, close + 1)); // "[sic]" is prose, not a marker
    }
    i = close + 1;
  }
  s.cut = i;
}

function feedDelta(turn, n, text) {
  if (!Number.isFinite(n)) return;
  const s = sentenceOf(turn, n);
  s.raw += text;
  drain(turn, s);
}

function addBadge(turn, s, id) {
  if (!Number.isFinite(id)) return;
  const b = el('sup', 'cb ' + s.verdict, String(id));
  b.dataset.span = String(id);
  b.dataset.turn = turn.id;
  b.dataset.n = String(s.n);
  b.tabIndex = 0;
  b.setAttribute('role', 'button');
  b.setAttribute('aria-label', 'Citation ' + id + ', checking');
  s.badges.push(b);
  s.node.appendChild(b);
}

/**
 * pending → confirmed | flagged.
 *
 * The class swap is the entire mechanism: the badge is already in the DOM with
 * `.pending`, and the verdict replaces one class on each badge plus one on the
 * sentence. No text moves, so a settle mid-stream cannot disturb the prose the
 * reader is in the middle of.
 */
function onVerdict(turn, ev) {
  const n = Number(ev && ev.n);
  const v = (ev && ev.verdict) === 'flagged' ? 'flagged' : 'confirmed';
  const s = sentenceOf(turn, n);
  s.verdict = v;
  s.why = ev && ev.why ? String(ev.why) : '';
  s.node.classList.remove('pending');
  s.node.classList.add(v);
  for (const b of s.badges) {
    b.classList.remove('pending');
    b.classList.add(v);
    b.setAttribute('aria-label', 'Citation ' + b.dataset.span + ', ' +
      (v === 'flagged' ? 'could not be confirmed' : 'confirmed'));
  }
}

function showError(turn, msg) {
  turn.errored = true;
  const e = turn.els.err;
  e.replaceChildren(el('b', null, 'Stopped'), document.createTextNode(String(msg)));
  e.classList.remove('hidden');
  turn.els.live.classList.add('hidden');
  turn.els.cursor.classList.add('hidden');
}

/* ══ `epilogue` — the frame that is ABOUT the answer ════════════════════════

   event: epilogue
   data:  { unanswered: string[], note: string, related: string[] }

   Emitted at most once, immediately before `done`, and — this is the part the
   renderer has to respect — ONLY when at least one of the three carries
   something. `done` is unchanged, so a reader that ignores this frame loses
   nothing it used to have.

   Three fields, three different jobs:
     · `unanswered` fills the **Not answerable** card. §7 item 1: these are the
       most tempting thing to delete for a cleaner screen. They stay.
     · `note` co-occurs with an EMPTY answer. When it is here there is no prose
       on screen, and this is the reader's only explanation — so it renders
       first in the refusals card, above the lists.
     · `related` is what the PIPELINE proposed, never what this page invented.
       Chips beside a cited answer borrow the answer's credibility, so they say
       in a footnote that nothing checked them.

   `dropped` is deliberately not here — the route says attribution's refusals
   arrive per-span while the answer is still being built, on a frame that does
   not exist yet. So the Dropped group stays unreported rather than empty. */

const EPILOGUE_EVENT = 'epilogue';

/** Absent is NOT empty. A field this frame does not carry stays `undefined`,
 *  and renderRefusals says "not reported" rather than "nothing". */
function applyEpilogue(turn, raw) {
  const d = (raw && typeof raw === 'object') ? raw : {};
  const list = (v) => (Array.isArray(v) ? v.map(String).filter((x) => x.trim() !== '') : undefined);
  const next = {};
  const related = list(d.related);
  if (related !== undefined) next.related = related;
  const unanswered = list(d.unanswered);
  if (unanswered !== undefined) next.unanswered = unanswered;
  if (typeof d.note === 'string' && d.note.trim() !== '') next.note = d.note.trim();
  if (Object.keys(next).length === 0) return;
  turn.epilogue = Object.assign({}, turn.epilogue, next);
  // It arrives before `done` — but a run that dies in the half-second between
  // the two should still show what it managed to say. Cheap, and idempotent.
  if (turn.doneAt) { renderRefusals(turn, turn.lastDone); renderRelated(turn, turn.lastDone); }
}

/** `done` plus the epilogue, without letting either invent the other's fields.
 *  Null when neither arrived, which renderRefusals reads as "not reported". */
function mergeEpilogue(turn, done) {
  if (done == null && turn.epilogue == null) return null;
  const out = Object.assign({}, done || {});
  for (const k of ['related', 'unanswered', 'note']) {
    if (out[k] === undefined && turn.epilogue && turn.epilogue[k] !== undefined) {
      out[k] = turn.epilogue[k];
    }
  }
  return out;
}

/* ══ done: collapse the status, surface the refusals ═══════════════════════ */

function finishTurn(turn, done) {
  turn.doneAt = Date.now();
  turn.els.live.classList.add('hidden');
  turn.els.cursor.classList.add('hidden');
  // A replayed answer has no steps to re-open, and "Completed 0 steps" is a
  // button that lies about having something behind it.
  if (turn.steps.length > 0) {
    turn.els.toggle.textContent = 'Completed ' + turn.steps.length + ' step' +
      (turn.steps.length === 1 ? '' : 's');
    turn.els.toggle.classList.remove('hidden');
  }

  const full = mergeEpilogue(turn, done);
  turn.lastDone = full;

  if (full && full.threadId) { S.threadId = String(full.threadId); turn.threadId = S.threadId; }
  if (full && full.messageId) turn.messageId = String(full.messageId);

  renderBlank(turn, full);
  renderRefusals(turn, full);
  renderRelated(turn, full);
  renderActions(turn, full);

  S.live = null;
  setBusy(false);
}

/**
 * AN EMPTY ANSWER IS A RESULT, AND IT HAS TO SAY SO WHERE THE ANSWER WOULD BE.
 *
 * Seen on a live run, 2026-08-31: eight documents read, zero quotable spans, so
 * the model was given an empty citable universe and correctly wrote nothing.
 * The screen showed a source strip, an empty gap, and a refusals card — and the
 * run's own explanation ("The documents carried nothing quotable for this
 * question") was inside the status line, which collapses at `done`. A reader
 * saw eight sources and silence.
 *
 * So the reason is lifted to where the prose would have been. `note` from the
 * `epilogue` frame is preferred, because it is the same string that got
 * persisted as the message body and the two cannot disagree; the run's last
 * status detail is the fallback, and a plain line the floor.
 */
function renderBlank(turn, done) {
  const box = turn.els.blank;
  box.replaceChildren();
  const wrote = turn.order.some((n) => {
    const s = turn.sentences.get(n);
    return s && stripMarkers(s.raw) !== '';
  });
  if (wrote || turn.errored) { box.classList.add('hidden'); return; }

  const note = (done && typeof done.note === 'string' && done.note.trim() !== '')
    ? done.note.trim()
    : (turn.phaseDetail || '');
  box.append(
    el('b', null, 'No answer written'),
    document.createTextNode(note !== ''
      ? note
      : 'The documents this run read carried nothing quotable for that question. ' +
        'Nothing is being withheld — there was no sourced sentence to write.'),
  );
  box.classList.remove('hidden');
}

/**
 * §7.1 — Perplexity shows you an answer; we show what we refused.
 *
 * Two of the three lists here are derived from the wire contract itself: a
 * `sentence` verdict of `flagged` IS a refusal to vouch, and it is guaranteed
 * to arrive. `dropped` / `unanswered` are read off `done` if the pipeline
 * chooses to carry them — read defensively, never required, never invented.
 *
 * When nothing was refused the section still renders, saying so in words. A
 * gate whose refusals are invisible teaches nobody anything, and an empty
 * section that disappears is indistinguishable from a gate that never ran.
 */
function renderRefusals(turn, done) {
  const box = turn.els.refusals;
  box.replaceChildren();

  // A run that was refused at the door (budget, the concurrency guard, an
  // unreachable server) has no refusals of its own to report — the error box
  // above IS the whole story, and three "nothing to report" lines under it read
  // as a gate that ran. It did not run.
  if (turn.errored && turn.order.length === 0) { box.classList.add('hidden'); return; }

  const flagged = turn.order
    .map((n) => turn.sentences.get(n))
    .filter((s) => s && s.verdict === 'flagged');
  const has = (k) => done != null && done[k] !== undefined && done[k] !== null;
  const dropped = Array.isArray(done && done.dropped) ? done.dropped : [];
  const unanswered = Array.isArray(done && done.unanswered) ? done.unanswered : [];
  // An empty citable universe produces no prose at all, and every "none" line
  // below reads as a clean bill of health unless it knows that. "Every sentence
  // matched the spans it cites" is a lie about zero sentences.
  const wroteNothing = turn.order.every((n) => {
    const s = turn.sentences.get(n);
    return !s || stripMarkers(s.raw) === '';
  });

  box.appendChild(el('h3', null, 'What this answer does not carry'));
  box.appendChild(el('p', 'why-here',
    'Kept on screen on purpose. A short answer you can act on beats a fluent one you cannot check.'));

  /* 0 · the run's own words. `note` co-occurs with an empty answer, so when it
     is here there is nothing above this card and this line is the reader's only
     explanation. It goes first, before any list. */
  const note = (done && typeof done.note === 'string') ? done.note.trim() : '';
  // When there is no prose the note is already standing where the answer would
  // be (renderBlank). Printing it twice on one screen makes one explanation
  // look like two findings.
  if (note !== '' && !wroteNothing) {
    const g0 = el('div', 'rgroup');
    g0.appendChild(el('span', 'eyebrow', 'What the run said about itself'));
    g0.appendChild(el('div', 'note', note));
    box.appendChild(g0);
  }

  /* 1 · sentences whose citations did not vouch for them */
  const g1 = el('div', 'rgroup');
  g1.appendChild(el('span', 'eyebrow', 'Could not be confirmed'));
  // `wroteNothing` is tested BEFORE `replayed`: a stored turn with no prose has
  // no sentences whose verdicts could have been kept, and "verdicts are not
  // stored" implies there were some.
  if (wroteNothing) {
    g1.appendChild(el('div', 'none',
      'Nothing was written, so nothing was checked. This is not a clean run — it is an empty one.'));
  } else if (turn.replayed) {
    g1.appendChild(el('div', 'none',
      'Per-sentence verdicts are not stored with an answer. Ask it again to re-run the checks.'));
  } else if (!flagged.length) {
    g1.appendChild(el('div', 'none', 'None — every sentence matched the spans it cites.'));
  } else {
    for (const s of flagged) {
      const d = el('div', 'drop');
      d.appendChild(el('span', 'qt', stripMarkers(s.raw)));
      d.appendChild(el('em', null, s.why ||
        'Could not be confirmed from what it cites — the quote is real, the claim goes further.'));
      g1.appendChild(d);
    }
  }
  box.appendChild(g1);

  /* 2 · points the verbatim gate refused outright */
  const g2 = el('div', 'rgroup');
  g2.appendChild(el('span', 'eyebrow', 'Dropped'));
  if (!dropped.length) {
    // THREE different empties, and collapsing them is the failure this card
    // exists to avoid. A fast run has no claim-level drop stage AT ALL — spans
    // are proven verbatim before a word is written, so no claim is ever written
    // and then withdrawn. Printing "nothing was dropped" about a stage that
    // does not exist reads as a gate that ran clean. It did not run.
    g2.appendChild(el('div', 'none',
      turn.mode === 'fast'
        ? 'No drop stage on a fast run — every span is proven verbatim before the prose is written, so a claim is never written and then withdrawn. The drop list belongs to Verified mode.'
        : has('dropped')
          ? 'Nothing was dropped on this run.'
          : 'Not reported by this run.'));
  } else {
    for (const d of dropped) {
      const row = el('div', 'drop');
      row.appendChild(el('b', null, String(d && d.claim || d)));
      if (d && d.why) row.appendChild(el('em', null, String(d.why)));
      g2.appendChild(row);
    }
  }
  box.appendChild(g2);

  /* 3 · the hole, named */
  const g3 = el('div', 'rgroup');
  g3.appendChild(el('span', 'eyebrow', 'Not answerable from these sources'));
  if (!unanswered.length) {
    // Three empties again, and the middle one is subtle: `epilogue` is sent
    // ONLY when it has something, so a completed run with no frame is a run
    // that named no gap — which is weaker than a gap check that ran and
    // passed, and is written as the weaker thing.
    g3.appendChild(el('div', 'none',
      has('unanswered')
        ? (wroteNothing
            ? 'The run listed no gap — but it also wrote no answer, so read the reason above rather than this line.'
            : 'The retrieved pages covered the question as asked.')
        : (done && done.messageId)
          ? 'This run named no gap. The gap list is only sent when there is one, so this is silence rather than a check that ran and passed.'
          : 'Not reported by this run.'));
  } else {
    for (const u of unanswered) g3.appendChild(el('div', 'drop', String(u)));
  }
  box.appendChild(g3);

  box.classList.remove('hidden');
}

/**
 * Related questions, as chips that CONTINUE the thread rather than start one.
 *
 * `submit()` carries `S.threadId`, so a chip is a follow-up — which is the only
 * reading that makes sense: the questions were generated from this answer's own
 * spans, and answering them in a fresh thread would throw away the sources they
 * came from and re-buy them.
 *
 * They are suggestions, not findings, and the footnote says so. A rail of
 * confident-looking questions beside a cited answer borrows the answer's
 * credibility; these are model-written and nothing checked them.
 */
function renderRelated(turn, done) {
  const rel = Array.isArray(done && done.related) ? done.related : [];
  const box = turn.els.related;
  box.replaceChildren();
  if (!rel.length) { box.classList.add('hidden'); return; }
  box.appendChild(el('span', 'eyebrow', 'Ask next'));
  const chips = el('div', 'chips');
  for (const r of rel) {
    const b = el('button', 'rq');
    b.appendChild(el('span', 'plus', '+'));
    b.appendChild(document.createTextNode(String(r)));
    b.addEventListener('click', () => submit(String(r)));
    chips.appendChild(b);
  }
  box.appendChild(chips);
  box.appendChild(el('div', 'foot',
    'Suggestions, not findings — written from this answer\u2019s spans and not checked against anything. Each one continues this thread.'));
  box.classList.remove('hidden');
}

function renderActions(turn, done) {
  const box = turn.els.actions;
  box.replaceChildren();

  const copy = el('button', null, 'Copy answer');
  copy.addEventListener('click', () => copyText(plainAnswer(turn, false), 'Answer copied'));
  const copyCited = el('button', null, 'Copy with sources');
  copyCited.addEventListener('click', () => copyText(plainAnswer(turn, true), 'Copied with sources'));
  const again = el('button', null, 'Ask again');
  again.addEventListener('click', () => submit(turn.question));
  // §7.2 — thread bloat with no fork is their top complaint. Fork is first-class.
  const fork = el('button', null, 'Fork from here');
  fork.title = 'Copy this thread up to and including this answer into a new one, and continue there.';
  fork.addEventListener('click', () => { void forkTurn(turn, fork); });

  box.append(copy, copyCited, again);
  // A turn that never reached the store has nothing to fork FROM. Offering the
  // button and then explaining it does not work is worse than not offering it.
  if (!S.demo && (turn.threadId || S.threadId)) box.appendChild(fork);

  const bits = [];
  if (done && Number.isFinite(Number(done.costCents))) {
    bits.push((Number(done.costCents)).toFixed(2) + '¢');
  }
  if (done && Number(done.flagged) > 0) bits.push(Number(done.flagged) + ' flagged');
  bits.push(turn.sources.length + ' sources');
  box.appendChild(el('span', 'cost', bits.join(' · ')));
  box.classList.remove('hidden');
}

/**
 * FORK — §7.2, the gap Perplexity is most complained about.
 *
 * The server takes `{seq}`: everything up to and including that message is
 * copied into a new thread, and the rest is left behind. `done` hands us a
 * `messageId`, not a seq — deliberately, since seq is the store's ordering and
 * not the wire's — so the seq is resolved from the transcript at fork time.
 * That is one GET, on a click, and it is exact; counting turns in the browser
 * would guess, and a fork that cuts one message off is a fork nobody trusts.
 *
 * If the route is not there yet, this degrades to what it did before: a new
 * thread with the same question, and a toast that says the fork was not
 * available rather than pretending the new thread is a fork of the old one.
 */
async function seqFor(threadId, messageId) {
  if (!threadId || !messageId) return null;
  try {
    const res = await fetch('/api/threads/' + encodeURIComponent(threadId));
    if (!res.ok) return null;
    const detail = await res.json();
    const m = (detail && Array.isArray(detail.messages) ? detail.messages : [])
      .find((x) => x && x.id === messageId);
    const n = m ? Number(m.seq) : NaN;
    return Number.isFinite(n) ? n : null;
  } catch { return null; }
}

async function forkTurn(turn, btn) {
  const threadId = turn.threadId || S.threadId;
  if (S.demo) { toast('Fork needs the real thread store — leave the demo to try it'); return; }
  if (!threadId) { toast('Nothing to fork yet — this turn was never saved'); return; }

  btn.disabled = true;
  const fallback = (why) => {
    // Honest degradation: the same question in a NEW thread, and a line saying
    // that is what happened. Silently re-asking and calling it a fork would put
    // a thread in the sidebar that claims a parent it does not have.
    toast(why + ' — asking it again as a new thread instead');
    const q = turn.question;
    resetToEmpty();
    submit(q);
  };

  try {
    let seq = Number.isInteger(Number(turn.seq)) ? Number(turn.seq) : null;
    if (seq === null) seq = await seqFor(threadId, turn.messageId);
    if (seq === null || seq < 1) { fallback('Could not find this answer in the saved thread'); return; }
    turn.seq = seq;

    const res = await fetch('/api/threads/' + encodeURIComponent(threadId) + '/fork', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ seq }),
    });
    // 404 is the route not being there; 405 is it not taking POST. Both are
    // "not built yet", and neither is worth a scary message.
    if (res.status === 404 || res.status === 405) { fallback('Fork is not available on this server'); return; }
    if (!res.ok) { fallback('The fork was refused (HTTP ' + res.status + ')'); return; }

    const body = await res.json();
    const id = String((body && body.id) || '');
    if (!id) { fallback('The fork came back without a thread id'); return; }

    await loadThreads();
    await openThreadById(id);
    toast('Forked at this answer — the thread you came from is untouched');
  } catch {
    fallback('Could not reach the fork endpoint');
  } finally {
    btn.disabled = false;
  }
}

function plainAnswer(turn, withSources) {
  const prose = turn.order.map((n) => turn.sentences.get(n).raw).join(' ').replace(/\s+/g, ' ').trim();
  if (!withSources) return stripMarkers(prose);
  const lines = [turn.question, '', prose, ''];
  for (const s of turn.sources) lines.push('[' + s.i + '] ' + s.title + ' — ' + (s.url || s.domain));
  const flagged = turn.order.map((n) => turn.sentences.get(n)).filter((s) => s.verdict === 'flagged');
  if (flagged.length) {
    lines.push('', 'Could not be confirmed:');
    for (const f of flagged) lines.push('- ' + f.raw.trim() + (f.why ? '  (' + f.why + ')' : ''));
  }
  return lines.join('\n');
}

function copyText(text, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => toast('Could not copy'));
  } else {
    const ta = el('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch { toast('Could not copy'); }
    ta.remove();
  }
}

/* ══ citation tooltip ══════════════════════════════════════════════════════
   One floating node, not one per badge. A long answer can carry sixty badges;
   sixty hidden cards is sixty subtrees to lay out for a hover that may never
   happen. */

const TURNS = new Map();   // turn.id -> turn

const VERDICT_COPY = {
  pending: ['Checking', 'Reading this sentence against the span it cites.'],
  confirmed: ['Confirmed', 'The quote is verbatim on the page we fetched, and the figures in this sentence match it. That is not a claim the sentence is true.'],
  // The distinction this wording protects is load-bearing. `flagged` is NOT
  // "false" — it is "we could not confirm this from what it cites", which is a
  // weaker and different statement, and rendering it as a lie is the failure.
  stored: ['Saved', 'From a stored answer. The quote is the one that was checked when it was written; the per-sentence verdicts were not kept.'],
  flagged: ['Unconfirmed', 'Could not be confirmed from what it cites. The source is real; the sentence goes further than the quoted span does.'],
};

let tipFor = null;

function showTip(badge) {
  const turn = TURNS.get(badge.dataset.turn);
  if (!turn) return;
  const id = Number(badge.dataset.span);
  const span = turn.spans.get(id);
  const sent = turn.sentences.get(Number(badge.dataset.n));
  const verdict = sent ? sent.verdict : 'pending';
  const src = span ? turn.sources.find((s) => s.i === span.sourceIndex) : null;

  const tip = $('#tip');
  tip.replaceChildren();

  const top = el('div', 'top');
  top.appendChild(favicon(src ? src.domain : ''));
  top.appendChild(el('span', 'dom', src ? src.domain : 'source ' + (span ? span.sourceIndex : '?')));
  tip.appendChild(top);
  tip.appendChild(el('div', 'ttl', src ? src.title : 'Source not yet received'));

  if (span && span.quote) tip.appendChild(el('blockquote', null, '“' + span.quote + '”'));
  else tip.appendChild(el('blockquote', null, 'The quoted span for this marker has not arrived yet.'));

  const v = el('div', 'verdict ' + verdict);
  v.appendChild(el('b', null, VERDICT_COPY[verdict][0]));
  v.appendChild(document.createTextNode(
    verdict === 'flagged' && sent && sent.why ? sent.why : VERDICT_COPY[verdict][1]));
  tip.appendChild(v);

  if (src && src.url) tip.appendChild(el('span', 'open', 'Click to open ' + src.domain + ' ↗'));

  tip.classList.add('on');
  tipFor = badge;
  positionTip(badge);
}

function positionTip(badge) {
  const tip = $('#tip');
  const r = badge.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - w - 12));
  let top = r.top - h - 9;
  if (top < 12) top = r.bottom + 9;                     // flip under when tight
  tip.style.left = Math.round(left) + 'px';
  tip.style.top = Math.round(top) + 'px';
}

function hideTip() {
  $('#tip').classList.remove('on');
  tipFor = null;
}

document.addEventListener('mouseover', (e) => {
  const b = e.target.closest && e.target.closest('.cb');
  if (b) showTip(b);
  else if (tipFor && !(e.target.closest && e.target.closest('.tip'))) hideTip();
});
document.addEventListener('focusin', (e) => {
  const b = e.target.closest && e.target.closest('.cb');
  if (b) showTip(b); else hideTip();
});
window.addEventListener('scroll', () => { if (tipFor) positionTip(tipFor); }, true);
window.addEventListener('resize', () => { if (tipFor) positionTip(tipFor); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });

function openBadge(badge) {
  const turn = TURNS.get(badge.dataset.turn);
  if (!turn) return;
  const span = turn.spans.get(Number(badge.dataset.span));
  const src = span ? turn.sources.find((s) => s.i === span.sourceIndex) : null;
  const url = src && safeUrl(src.url);
  if (url) window.open(url, '_blank', 'noopener,noreferrer');
  else toast('No URL for that citation yet');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('.cb');
  if (b) openBadge(b);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const b = e.target.closest && e.target.closest('.cb');
  if (!b) return;
  e.preventDefault();
  openBadge(b);
});

/* ══ the run ═══════════════════════════════════════════════════════════════ */

function setBusy(busy) {
  $('#go0').disabled = busy;
  $('#go1').disabled = busy;
  $('#q1').placeholder = busy ? 'Working…' : 'Ask a follow-up…';
}

function stopStream() {
  if (S.es) { try { S.es.close(); } catch { /* already closed */ } S.es = null; }
  for (const t of S.demoTimers) clearTimeout(t);
  S.demoTimers = [];
}

/** Keeps the newest turn in view while it streams, unless the reader has
 *  scrolled up to read something — then leave them where they are. */
const SCROLLER = $('#scroll');
function nudgeScroll(force) {
  const sc = SCROLLER;
  const near = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 220;
  if (force || near) sc.scrollTop = sc.scrollHeight;
}

function submit(raw) {
  const q = String(raw || '').trim();
  if (!q) return;
  if (S.live) { toast('Still working on the last one'); return; }
  if (q.length < 8) { toast('Ask a fuller question — a few words cannot be turned into a search'); return; }

  stopStream();
  enterThreadView();

  const turn = newTurn(q);
  turn.mode = S.mode;
  // Captured at submit time, not at done: a follow-up belongs to the thread it
  // was asked in, and `done` will confirm the same id back. Without this a turn
  // that errors before `done` has no thread to fork from.
  turn.threadId = S.threadId;
  S.turns.push(turn);
  S.live = turn;
  TURNS.set(turn.id, turn);
  $('#turns').appendChild(buildTurn(turn));
  nudgeScroll(true);
  setBusy(true);

  if (S.demo) { runDemo(turn); return; }

  // `thread` is what makes this a FOLLOW-UP rather than a second conversation:
  // the route loads the thread's messages as history, the planner resolves
  // "and in Vancouver?" against them, and the prior sources are reused rather
  // than re-bought. Its absence is what starts a thread.
  const url = S.endpoint + '?q=' + encodeURIComponent(q) +
    (S.threadId ? '&thread=' + encodeURIComponent(S.threadId) : '') +
    (S.mode === 'verified' ? '&mode=verified' : '');

  let got = 0;
  const es = new EventSource(url);
  S.es = es;

  const on = (name, fn) => es.addEventListener(name, (e) => {
    got++;
    let data = null;
    try { data = JSON.parse(e.data); } catch { data = e.data; }
    fn(data);
    nudgeScroll(false);
  });

  on('status', (d) => onStatus(turn, d));
  on('source', (d) => onSource(turn, d));
  on('span', (d) => onSpan(turn, d));
  on('delta', (d) => feedDelta(turn, Number(d && d.n), String((d && d.text) ?? '')));
  on('sentence', (d) => onVerdict(turn, d));
  on('error_msg', (d) => {
    showError(turn, typeof d === 'string' ? d : (d && d.message) || 'The run stopped.');
    finishTurn(turn, null);
    stopStream();
  });
  on(EPILOGUE_EVENT, (d) => applyEpilogue(turn, d));
  on('done', (d) => {
    finishTurn(turn, d);
    stopStream();
    nudgeScroll(false);
    // The thread this run just created (or extended) should appear in the list
    // and be the one highlighted — otherwise the sidebar says you are nowhere.
    void loadThreads();
  });

  // `error` is EventSource's transport failure, never an application error —
  // which is exactly why the contract calls the other one `error_msg`.
  es.onerror = () => {
    if (turn.doneAt) { stopStream(); return; }
    stopStream();
    showError(turn, got === 0
      ? 'Could not reach ' + S.endpoint + '. The answer route may not be running — try ?demo=1 to see the interface with scripted events.'
      : 'The connection dropped mid-answer. Everything above arrived; the rest did not.');
    finishTurn(turn, null);
  };
}

/**
 * Timings and payload SHAPES corrected against a live run, 2026-08-31.
 *
 * What the scripted stream had wrong, and what the real one does:
 *  · `searching.detail` is the queries joined by `·`, not one query per event.
 *  · `reading.detail` is a bare count — `"33 result(s)"` — not a sentence.
 *  · sources trickle at roughly 2.5s apart (a 2s-per-host politeness floor),
 *    not 175ms. Held to 700ms here: long enough that the staggered reveal and
 *    the running count are visibly doing their job, short enough that reviewing
 *    the interface does not cost 30 seconds a run. It is a demo, not a clock.
 *  · sentences are numbered FROM ZERO.
 */
function runDemo(turn) {
  let t = 0;

  at(t += 90, () => onStatus(turn, { phase: 'planning' }));
  at(t += 560, () => onStatus(turn, { phase: 'searching',
    detail: 'toronto snow removal seasonal contract timing · jiffy snow removal pricing toronto · taskrabbit toronto snow' }));
  at(t += 800, () => onStatus(turn, { phase: 'reading', detail: '27 result(s)' }));

  // Sources land staggered, before a word of prose — this is the whole staging.
  DEMO_SOURCES.forEach((s, i) => at(t + 300 + i * 700, () => { onSource(turn, s); nudgeScroll(false); }));
  t += 300 + DEMO_SOURCES.length * 700;

  at(t += 240, () => onStatus(turn, { phase: 'attributing', detail: DEMO_SOURCES.length + ' document(s)' }));
  DEMO_SPANS.forEach((s, i) => at(t + 120 + i * 60, () => onSpan(turn, s)));
  t += 120 + DEMO_SPANS.length * 60;

  at(t += 340, () => onStatus(turn, { phase: 'writing' }));
  t += 240;

  // Chunked into token-sized pieces so the render loop is exercised the way a
  // real stream exercises it — including a marker split across two deltas.
  DEMO_SENTENCES.forEach((sent, idx) => {
    const n = idx;                       // the server numbers from zero
    for (const piece of chunk(sent.text)) {
      t += 22 + Math.random() * 34;
      const ms = t;
      S.demoTimers.push(setTimeout(() => { feedDelta(turn, n, piece); nudgeScroll(false); }, ms));
    }
    // The verdict settles about one sentence behind the writing.
    const settleAt = t + 900;
    S.demoTimers.push(setTimeout(() => {
      if (idx === DEMO_SENTENCES.length - 1) onStatus(turn, { phase: 'checking' });
      onVerdict(turn, { n, verdict: sent.verdict, why: sent.why });
    }, settleAt));
  });

  at(t + 1400, () => onStatus(turn, { phase: 'done',
    detail: DEMO_SENTENCES.length + ' sentence(s), 1 flagged' }));
  // The epilogue arrives before `done`, which is where the real one sits.
  at(t + 1550, () => applyEpilogue(turn, DEMO_EPILOGUE));
  at(t + 1700, () => { finishTurn(turn, DEMO_DONE); nudgeScroll(false); });
}

/** Split into 2–7 character pieces, deliberately cutting through "[4]" so the
 *  held-bracket path in `drain` is exercised every single run. */
function chunk(text) {
  const out = [];
  let i = 0;
  while (i < text.length) {
    const n = 2 + Math.floor(Math.random() * 6);
    out.push(text.slice(i, i + n));
    i += n;
  }
  return out;
}
