  if (flagged.length) {
    lines.push('', 'Could not be confirmed:');
    for (const f of flagged) lines.push('- ' + f.raw.trim() + (f.why ? '  (' + f.why + ')' : ''));
  }
  return lines.join('\n');
}

function copyText(text, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, () => toast('Could not copy'));
  } else {
    const ta = el('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch { toast('Could not copy'); }
    ta.remove();
  }
}

/* ══ citation tooltip ══════════════════════════════════════════════════════
   One floating node, not one per badge. A long answer can carry sixty badges;
   sixty hidden cards is sixty subtrees to lay out for a hover that may never
   happen. */

const TURNS = new Map();   // turn.id -> turn

const VERDICT_COPY = {
  pending: ['Checking', 'Reading this sentence against the span it cites.'],
  confirmed: ['Confirmed', 'The quote is verbatim on the page we fetched, and the figures in this sentence match it. That is not a claim the sentence is true.'],
  // The distinction this wording protects is load-bearing. `flagged` is NOT
  // "false" — it is "we could not confirm this from what it cites", which is a
  // weaker and different statement, and rendering it as a lie is the failure.
  stored: ['Saved', 'From a stored answer. The quote is the one that was checked when it was written; the per-sentence verdicts were not kept.'],
  flagged: ['Unconfirmed', 'Could not be confirmed from what it cites. The source is real; the sentence goes further than the quoted span does.'],
};

/**
 * CONFIRMED DOES NOT MEAN THE SAME THING FOR ALL FOUR KINDS, and one sentence
 * of copy for all of them is where grounded mode would quietly overclaim.
 *
 * On the web it means: these words are on a page we fetched this run. In our
 * own vault it means: these words are in a document WE wrote — which is
 * evidence we said it, not evidence it is so. On a ledger row it means the
 * forecast is quoted as recorded — a thing we expected, which may not happen.
 * The check is identical in all four cases; what it licenses is not.
 */
const CONFIRMED_BY_KIND = {
  web: VERDICT_COPY.confirmed[1],
  world: 'The quote is verbatim on their page as we recorded it, and the figures in this sentence match. ' +
         'What their page says today may differ — this is our reading, on a date.',
  brain: 'The quote is verbatim in our own document, and the figures match it. That we wrote it down is ' +
         'evidence we said it, not evidence it is true. Nothing outside Taskly was consulted for this line.',
  ledger: 'The forecast is quoted as it was recorded. It is what we expected at some probability — ' +
          'it is not a measurement, and it has not necessarily happened.',
};

function verdictCopy(kind, verdict) {
  const base = VERDICT_COPY[verdict] || VERDICT_COPY.pending;
  if (verdict !== 'confirmed') return base;
  return [base[0], CONFIRMED_BY_KIND[kind] || base[1]];
}

let tipFor = null;

function showTip(badge) {
  const turn = TURNS.get(badge.dataset.turn);
  if (!turn) return;
  const id = Number(badge.dataset.span);
  const span = turn.spans.get(id);
  const sent = turn.sentences.get(Number(badge.dataset.n));
  const verdict = sent ? sent.verdict : 'pending';
  const src = span ? turn.sources.find((s) => s.i === span.sourceIndex) : null;
  const kind = src ? src.kind : 'web';

  const tip = $('#tip');
  tip.replaceChildren();

  const top = el('div', 'top');
  top.appendChild(kind === 'web' && src ? favicon(src.domain) : kindMark(kind));
  top.appendChild(el('span', 'dom',
    src ? (INTERNAL[kind] ? KIND[kind].origin : src.domain) : 'source ' + (span ? span.sourceIndex : '?')));
  tip.appendChild(top);
  tip.appendChild(el('div', 'ttl', src ? src.title : 'Source not yet received'));
  // Same split the card uses: the document on one line, the place inside it
  // on the next. The clipboard still gets the locator whole.
  if (src && INTERNAL[kind] && src.path) tip.appendChild(el('div', 'loc', src.path));
  if (src && kind === 'world') {
    const when = whenText(src.observedAt);
    tip.appendChild(el('span', 'when', when ? 'Read on ' + when : 'Read — date not recorded'));
  }
  if (src && kind === 'ledger') {
    const when = whenText(src.observedAt);
    tip.appendChild(el('span', 'when', when ? 'Recorded ' + when : 'Recorded — date not noted'));
  }

  if (span && span.quote) tip.appendChild(el('blockquote', null, '“' + span.quote + '”'));
  else tip.appendChild(el('blockquote', null, 'The quoted span for this marker has not arrived yet.'));

  const copy = verdictCopy(kind, verdict);
  const v = el('div', 'verdict ' + verdict);
  v.appendChild(el('b', null, copy[0]));
  v.appendChild(document.createTextNode(
    verdict === 'flagged' && sent && sent.why ? sent.why : copy[1]));
  tip.appendChild(v);

  // The last line of a tooltip is a promise about the next click. It is made
  // only where it can be kept.
  if (src && src.url) {
    tip.appendChild(el('span', 'open', kind === 'world'
      ? 'Click to open ' + src.domain + ' ↗ — their page as it stands today'
      : 'Click to open ' + src.domain + ' ↗'));
  } else if (src && kind === 'brain') {
    tip.appendChild(el('span', 'open', 'No link — it is our own document. Click to copy the path'));
  } else if (src && kind === 'ledger') {
    tip.appendChild(el('span', 'open', 'No link — it is a ledger row. Click to copy it'));
  }

  tip.classList.add('on');
  tipFor = badge;
  positionTip(badge);
}

function positionTip(badge) {
  const tip = $('#tip');
  const r = badge.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - w - 12));
  let top = r.top - h - 9;
  if (top < 12) top = r.bottom + 9;                     // flip under when tight
  tip.style.left = Math.round(left) + 'px';
  tip.style.top = Math.round(top) + 'px';
}

function hideTip() {
  $('#tip').classList.remove('on');
  tipFor = null;
}

document.addEventListener('mouseover', (e) => {
  const b = e.target.closest && e.target.closest('.cb');
  if (b) showTip(b);
  else if (tipFor && !(e.target.closest && e.target.closest('.tip'))) hideTip();
});
document.addEventListener('focusin', (e) => {
  const b = e.target.closest && e.target.closest('.cb');
  if (b) showTip(b); else hideTip();
});
window.addEventListener('scroll', () => { if (tipFor) positionTip(tipFor); }, true);
window.addEventListener('resize', () => { if (tipFor) positionTip(tipFor); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });

/**
 * A marker click opens the page — WHERE THERE IS ONE.
 *
 * `src.url` was already resolved through safeUrl in onSource for the two kinds
 * that have a page, and left null for the two that do not, so an internal
 * locator can never be handed to window.open. The internal kinds get the only
 * useful action they have instead: the locator on the clipboard.
 */
function openBadge(badge) {
  const turn = TURNS.get(badge.dataset.turn);
  if (!turn) return;
  const src = sourceForSpan(turn, badge.dataset.span);
  if (src && src.url) { window.open(src.url, '_blank', 'noopener,noreferrer'); return; }
  if (src && src.locator) { copyText(src.locator, 'Copied — ' + src.locator); return; }
  if (src) { toast('No page to open — ' + KIND_SAYS[src.kind]); return; }
  toast('The source for that citation has not arrived yet');
}
document.addEventListener('click', (e) => {
  const b = e.target.closest && e.target.closest('.cb');
  if (b) openBadge(b);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const b = e.target.closest && e.target.closest('.cb');
  if (!b) return;
  e.preventDefault();
  openBadge(b);
});

/* ══ the run ═══════════════════════════════════════════════════════════════ */

function setBusy(busy) {
  $('#go0').disabled = busy;
  $('#go1').disabled = busy;
  $('#q1').placeholder = busy ? 'Working…' : 'Ask a follow-up…';
}

function stopStream() {
  if (S.es) { try { S.es.close(); } catch { /* already closed */ } S.es = null; }
  for (const t of S.demoTimers) clearTimeout(t);
  S.demoTimers = [];
  // The deep panel's clock is the one thing that keeps ticking after the events
  // stop, and a frozen page with a running timer reads as a live run.
  if (S.live) deepStopTick(S.live);
}

/** Keeps the newest turn in view while it streams, unless the reader has
 *  scrolled up to read something — then leave them where they are. */
const SCROLLER = $('#scroll');
function nudgeScroll(force) {
  const sc = SCROLLER;
  const near = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 220;
  if (force || near) sc.scrollTop = sc.scrollHeight;
}

function submit(raw) {
  const q = String(raw || '').trim();
  if (!q) return;
  if (S.live) { toast('Still working on the last one'); return; }
  if (q.length < 8) { toast('Ask a fuller question — a few words cannot be turned into a search'); return; }

  stopStream();
  enterThreadView();

  const turn = newTurn(q);
  turn.mode = S.mode;
  // Captured at submit time, not at done: a follow-up belongs to the thread it
  // was asked in, and `done` will confirm the same id back. Without this a turn
  // that errors before `done` has no thread to fork from.
  turn.threadId = S.threadId;
  S.turns.push(turn);
  S.live = turn;
  TURNS.set(turn.id, turn);
  $('#turns').appendChild(buildTurn(turn));
  nudgeScroll(true);
  setBusy(true);
  startRun(turn);
}

/**
 * Start (or restart) the run for a turn that already has its DOM.
 *
 * Split out of `submit` for one reason: answering a clarifying question is a
 * NEW REQUEST on the SAME turn — the stream that asked has ended and SSE has
 * no way back up it — so the run has to be startable without minting a turn.
 */
function startRun(turn) {
  // The panel goes up before the first `plan`, so the seconds spent working out
  // the sub-questions are visibly work rather than visibly nothing.
  if (turn.mode === 'deep') deepBegin(turn);
  if (S.demo) { runDemo(turn); return; }
  openStream(turn);
}

function openStream(turn) {
  const q = turn.question;

  // `thread` is what makes this a FOLLOW-UP rather than a second conversation:
  // the route loads the thread's messages as history, the planner resolves
  // "and in Vancouver?" against them, and the prior sources are reused rather
  // than re-bought. Its absence is what starts a thread.
  // Web sends no `mode` at all: it is the route's only behaviour today, and a
  // value invented here would be a guess about a vocabulary answer-route.ts
  // owns. Grounded sends one and then checks the answer for evidence it was
  // honoured — see renderModeNote.
  const param = MODES[turn.mode] && MODES[turn.mode].param;
  // The clarify replies, riding back in the query string because the stream
  // that asked for them has already ended. One `a=` per question, in order,
  // interior blanks kept — position is the addressing. See CLARIFY_PARAM.
  const answers = Array.isArray(turn.clarifyAnswers) ? turn.clarifyAnswers : [];
  const replies = answers.slice(0, CLARIFY_MAX)
    .map((a) => '&' + CLARIFY_PARAM + '=' +
      encodeURIComponent(String(a.answer || '').slice(0, CLARIFY_CHARS)))
    .join('');
  const url = S.endpoint + '?q=' + encodeURIComponent(q) +
    (S.threadId ? '&thread=' + encodeURIComponent(S.threadId) : '') +
    (param ? '&mode=' + encodeURIComponent(param) : '') +
    replies;

  let got = 0;
  const es = new EventSource(url);
  S.es = es;

  const on = (name, fn) => es.addEventListener(name, (e) => {
    got++;
    let data = null;
    try { data = JSON.parse(e.data); } catch { data = e.data; }
    fn(data);
    nudgeScroll(false);
  });

  on('status', (d) => onStatus(turn, d));
  on('source', (d) => onSource(turn, d));
  on('span', (d) => onSpan(turn, d));
  on('delta', (d) => feedDelta(turn, Number(d && d.n), String((d && d.text) ?? '')));
  on('sentence', (d) => onVerdict(turn, d));
  on('error_msg', (d) => {
    showError(turn, typeof d === 'string' ? d : (d && d.message) || 'The run stopped.');
    finishTurn(turn, null);
    stopStream();
  });
  on(EPILOGUE_EVENT, (d) => applyEpilogue(turn, d));

  /* The four deep frames. Registered unconditionally rather than only in deep
     mode: a listener costs nothing, and the alternative is a pipeline that
     starts publishing a plan while the browser silently ignores it because a
     pill said Web. `onPlan` opens the panel itself, so whichever arrives first
     is enough. */
  on('plan', (d) => onPlan(turn, d));
  on('step', (d) => onStep(turn, d));
  on('reflect', (d) => onReflect(turn, d));
  on('clarify', (d) => onClarify(turn, d));
  on('done', (d) => {
    finishTurn(turn, d);
    stopStream();
    nudgeScroll(false);
    // The thread this run just created (or extended) should appear in the list
    // and be the one highlighted — otherwise the sidebar says you are nowhere.
    void loadThreads();
  });

  // `error` is EventSource's transport failure, never an application error —
  // which is exactly why the contract calls the other one `error_msg`.
  es.onerror = () => {
    if (turn.doneAt || turn.stopped) { stopStream(); return; }
    // A `clarify` ENDS THE STREAM — that is the contract, not a fault. The
    // close that follows it must not be reported as a dropped connection, or
    // the one moment the run is politely waiting on the reader looks like the
    // server falling over.
    if (turn.clarify) { stopStream(); return; }
    stopStream();
    showError(turn, got === 0
      ? 'Could not reach ' + S.endpoint + '. The answer route may not be running — try ?demo=1 to see the interface with scripted events.'
      : 'The connection dropped mid-answer. Everything above arrived; the rest did not.');
    finishTurn(turn, null);
  };
}

  at(t += 500, () => onReflect(turn, {
    after: 2,
    note: 'Nothing survived the check. Both sites carry only today’s price, and the archived ' +
          'snapshots that would show the movement did not fetch.',
    stillOpen: ['How either price has moved since 2025'],
  }));

  /* …which is why the plan changes. */
  at(t += 900, () => { onPlan(turn, D_PLAN_2); nudgeScroll(false); });
  at(t += 400, () => onStep(turn, { n: 2, state: 'running', detail: 'our world model — readings of both pages' }));
  at(t += 2100, () => onStep(turn, { n: 2, state: 'done', found: 2, detail: '2 dated readings' }));

  /* Sources start landing once there is something proven to attach them to. */
  D_SOURCES.slice(0, 2).forEach((s, i) => at(t + 200 + i * 420, () => { onSource(turn, s); nudgeScroll(false); }));
  t += 200 + 2 * 420;

  at(t += 500, () => onStep(turn, { n: 3, state: 'running', detail: 'tasker earnings, both platforms' }));
  at(t += 2300, () => onStep(turn, { n: 3, state: 'done', found: 1, detail: '6 pages read' }));

  at(t += 400, () => onStep(turn, { n: 4, state: 'running', detail: 'our own documents' }));
  D_SOURCES.slice(2, 4).forEach((s, i) => at(t + 300 + i * 400, () => { onSource(turn, s); nudgeScroll(false); }));
  at(t += 1900, () => onStep(turn, { n: 4, state: 'done', found: 1, detail: 'PRICING_v3 · ADR-005' }));

  /* Skipped is neither done nor failed, and it says why. */
  at(t += 500, () => onStep(turn, { n: 5, state: 'skipped',
    detail: 'nothing to retrieve — it is arithmetic on the other four' }));

  D_SOURCES.slice(4).forEach((s, i) => at(t + 200 + i * 420, () => { onSource(turn, s); nudgeScroll(false); }));
  t += 200 + 2 * 420;

  at(t += 400, () => onReflect(turn, {
    after: 5,
    note: 'The plan is answered for the GTA and for our own fee model. The second-city part of the ' +
          'question is not, and more searching will not settle it — nothing read says anything about ' +
          'a market we do not operate in.',
    stillOpen: ['Whether any of this holds outside the GTA'],
    stop: 'the plan is answered — what is left needs a market we have no evidence for, not more searching',
  }));

  at(t += 600, () => onStatus(turn, { phase: 'attributing', detail: D_SOURCES.length + ' document(s)' }));
  D_SPANS.forEach((s, i) => at(t + 150 + i * 70, () => onSpan(turn, s)));
  t += 150 + D_SPANS.length * 70;

  at(t += 500, () => onStatus(turn, { phase: 'writing' }));
  t += 300;

  D_SENTENCES.forEach((sent, idx) => {
    const n = idx;
    for (const piece of chunk(sent.text)) {
      t += 20 + Math.random() * 30;
      const ms = t;
      S.demoTimers.push(setTimeout(() => { feedDelta(turn, n, piece); nudgeScroll(false); }, ms));
    }
    const settleAt = t + 850;
    S.demoTimers.push(setTimeout(() => {
      if (idx === D_SENTENCES.length - 1) onStatus(turn, { phase: 'checking' });
      onVerdict(turn, { n, verdict: sent.verdict, why: sent.why });
    }, settleAt));
  });

  at(t + 1400, () => onStatus(turn, { phase: 'done',
    detail: D_SENTENCES.length + ' sentence(s), 1 flagged' }));
  at(t + 1550, () => applyEpilogue(turn, D_EPILOGUE));
  at(t + 1750, () => { finishTurn(turn, D_DONE); nudgeScroll(false); });
}

/** Split into 2–7 character pieces, deliberately cutting through "[4]" so the
 *  held-bracket path in `drain` is exercised every single run. */
function chunk(text) {
  const out = [];
  let i = 0;
  while (i < text.length) {
    const n = 2 + Math.floor(Math.random() * 6);
    out.push(text.slice(i, i + n));
    i += n;
  }
  return out;
}

/* ══ boot ══════════════════════════════════════════════════════════════════ */

void loadThreads();
$('#q0').focus();

// A question in the URL runs on load, so a link can carry one.
const initial = new URLSearchParams(location.search).get('q');
if (initial) submit(initial);
else if (S.demo) { $('#q0').value = (SUGGESTED[S.mode] || SUGGESTED.web)[0]; }
</script>
